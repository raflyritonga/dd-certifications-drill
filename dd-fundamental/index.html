<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Fundamentals Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two shells. "Browse" (header, tabs, home/cheat sheet/setup) and "Focus" (quiz and results:
   a slim sticky bar with Exit on the left, nothing else on screen but the question). */
:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --subtle: #EFF1F4;
  --ink: #1A222C;
  --muted: #637081;
  --line: #E1E5EA;
  --accent: #0F6B8A;
  --accent-soft: #E3F0F5;
  --accent-ink: #FFFFFF;
  --ok: #1E8551;
  --ok-soft: #E6F4EC;
  --bad: #BE3B34;
  --bad-soft: #FBE9E7;
  --warn: #93600A;
  --warn-soft: #FAF0DD;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1419; --surface: #161C23; --subtle: #1E252E; --ink: #E3E8EE; --muted: #96A2B0; --line: #29313B;
    --accent: #52B4D5; --accent-soft: #14303A; --accent-ink: #062330; --ok: #44C287; --ok-soft: #133022;
    --bad: #EF7068; --bad-soft: #391C1A; --warn: #E2A747; --warn-soft: #33270F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1419; --surface: #161C23; --subtle: #1E252E; --ink: #E3E8EE; --muted: #96A2B0; --line: #29313B;
  --accent: #52B4D5; --accent-soft: #14303A; --accent-ink: #062330; --ok: #44C287; --ok-soft: #133022;
  --bad: #EF7068; --bad-soft: #391C1A; --warn: #E2A747; --warn-soft: #33270F; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.98rem; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.hint { font-size: 0.85rem; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* shells */
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 80px; }
body[data-shell="focus"] .browse-only { display: none; }
body[data-shell="focus"] .wrap { padding-top: 0; }

/* browse header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
.top .sub { color: var(--muted); font-size: 0.9rem; }
.top-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.stats b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.resetbtn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.resetbtn svg { width: 15px; height: 15px; }
.resetbtn:hover:not(:disabled) { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.modal-back { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: center; padding: 20px; }
.modal { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.modal .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); display: grid; place-content: center; }
.modal .ico svg { width: 18px; height: 18px; }
.modal ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.9rem; display: grid; gap: 2px; }
.modal .row { justify-content: flex-end; }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-fill:hover { filter: brightness(1.06); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.9rem; }
.nav { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.tab { border: 0; background: none; padding: 8px 0 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--subtle); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.small { padding: 5px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: .4; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; text-align: left; font-weight: 500; }
.textbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 0.82rem; text-decoration: underline; text-underline-offset: 3px; }
.textbtn:hover { color: var(--ink); }

/* home */
.home { display: grid; gap: 36px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pkgs { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 860px) { .pkgs { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 420px) { .pkgs { gap: 6px; } .pkg { padding: 8px; } .pkg .pn b { display: none; } .pkg .ps { font-size: 0.9rem; } }
.pkg { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 10px 10px; min-width: 0; display: grid; gap: 6px; }
.pkg:hover { border-color: var(--accent); }
.pkg .pn { font-size: 0.78rem; color: var(--muted); }
.pkg .ps { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.pkg .ps.none { color: var(--muted); }
.bar { height: 4px; background: var(--subtle); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.sim:hover { border-color: var(--accent); }
.sim .t { font-weight: 600; }
.sim .d { font-size: 0.85rem; color: var(--muted); }
.sim .r { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-mono); color: var(--muted); }
.src { font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.src a { overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 4px; }
.item:hover:not(:disabled) .t { color: var(--accent); }
.item:disabled { opacity: .5; cursor: default; }
.item .t { font-weight: 500; }
.item .d { grid-column: 1; font-size: 0.83rem; color: var(--muted); }
.item .r { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); text-align: right; }
.item .bar { grid-column: 1; margin-top: 4px; }
.badge { display: inline-block; white-space: nowrap; font-size: 0.66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 999px; font-weight: 600; vertical-align: 2px; margin-left: 6px; }

/* setup */
.setup { display: grid; gap: 22px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { text-align: left; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; display: grid; gap: 10px; align-content: start; }
.mode:hover { border-color: var(--accent); }
.mode.last { border-color: var(--accent); }
.mode ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 0.88rem; color: var(--muted); }
.mode .go { justify-self: start; margin-top: 6px; }
.tagline { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
.tagline.exam { color: var(--warn); }

/* focus bar */
.fbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); margin-inline: -20px; padding: 10px 20px 0; }
.fbar-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.fbar .title { min-width: 0; display: grid; line-height: 1.25; }
.fbar .title b { font-weight: 500; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fbar .title span { font-size: 0.78rem; color: var(--muted); }
.exit { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; }
.exit svg { width: 18px; height: 18px; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; padding: 4px 8px; border-radius: 6px; background: var(--subtle); }
.timer.low { color: var(--bad); background: var(--bad-soft); }
.progress { height: 3px; background: var(--line); margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s ease; }
.banner { margin-top: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }

/* question */
.quiz { display: grid; gap: 18px; padding-top: 22px; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
.stem { font-size: 1.08rem; line-height: 1.6; display: grid; gap: 12px; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--subtle); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 0.85rem; background: var(--subtle); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; line-height: 1.5; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 12px; align-items: start; text-align: left; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
button.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); width: 26px; height: 26px; border-radius: 6px; display: grid; place-content: center; background: var(--subtle); font-size: 0.82rem; color: var(--muted); grid-row: span 2; }
.opt .tx { overflow-wrap: anywhere; white-space: pre-wrap; padding-top: 1px; }
.opt .tx.code { font-family: var(--font-mono); font-size: 0.85rem; }
.opt .why { grid-column: 2; font-size: 0.86rem; color: var(--muted); }
.opt .why b { font-weight: 600; margin-right: 4px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.right .why b { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.wrong .why b { color: var(--bad); }
.opt.right code, .opt.wrong code, .opt.sel code { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.opt:disabled { cursor: default; color: var(--ink); }
.verdict { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.explain { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; display: grid; gap: 6px; font-size: 0.95rem; }
.explain a { font-size: 0.85rem; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-top: 4px; }
.flagbtn[aria-pressed="true"] { color: var(--warn); background: var(--warn-soft); }

/* overview (exam) */
.overview { display: grid; gap: 12px; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.palette button { height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 0.8rem; }
.palette button.done { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.palette button.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.palette button.cur { border-color: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }

/* results */
.score { display: flex; gap: 8px 24px; align-items: baseline; flex-wrap: wrap; }
.big { font-family: var(--font-mono); font-size: 2.8rem; line-height: 1; font-weight: 500; }
.rtable { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.rtable td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.rtable td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; padding-left: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: 0.85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--subtle); color: var(--ink); font-weight: 500; }
.review { display: grid; gap: 28px; }
.ritem { display: grid; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line); min-width: 0; }

/* cheat sheet */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.sheet { display: grid; gap: 20px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tbl table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--subtle); font-weight: 600; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-family: var(--font-mono); white-space: nowrap; font-weight: 500; }
.tbl.plain td:first-child { font-family: inherit; white-space: normal; font-weight: 400; }
.tbl.wrapmono td:first-child { white-space: normal; overflow-wrap: anywhere; min-width: 220px; }
.tbl code { white-space: nowrap; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 75ch; }
.sheet .panel { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 12px); }
.cs-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cs-head .badge { margin-left: 0; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.toc button:hover { border-color: var(--accent); color: var(--accent); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.facts > div { background: var(--subtle); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.facts b { font-family: var(--font-mono); font-weight: 500; font-size: 1.05rem; }
.facts span:last-child { font-size: 0.82rem; color: var(--muted); }
.sheet pre.code { max-width: 100%; }

@media (max-width: 520px) { .big { font-size: 2.3rem; } .stem { font-size: 1.02rem; } .exit span { display: none; } .exit { padding: 6px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top browse-only">
    <div>
      <h1>Fundamentals Drill</h1>
      <p class="sub">Practice for the Datadog Fundamentals certification</p>
    </div>
    <div class="top-right">
      <div class="stats" id="stats"></div>
      <button class="btn small resetbtn" id="reset" title="Erase all scores and history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset progress</button>
    </div>
  </header>
  <nav class="nav browse-only" aria-label="Sections">
    <button class="tab" data-view="home" aria-current="true">Practice</button>
    <button class="tab" data-view="sheet">Cheat sheet</button>
  </nav>
  <main id="app"></main>
</div>

<div class="modal-back" id="resetmodal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-desc">
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
    <h2 id="reset-title">Reset all progress?</h2>
    <div id="reset-desc" class="stack" style="gap:8px"></div>
    <div class="row"><button class="btn" id="reset-no">Cancel</button><button class="btn danger-fill" id="reset-yes">Erase everything</button></div>
  </div>
</div>

<template id="sheet-tpl"><div class="sheet">
  <div class="stack" style="gap:8px">
    <h2 style="font-size:1.5rem">Cheat sheet</h2>
    <p class="hint">Everything the exam guide lists, on one page. Checked against the live Datadog docs and pricing pages, <span id="checked"></span>. Each section ends with links to its sources. Sections marked <span class="badge">Exam-heavy</span> come up most.</p>
    <div class="toc" aria-label="Jump to section">
      <button data-jumpto="cs-ports">Ports</button>
      <button data-jumpto="cs-dsd">DogStatsD</button>
      <button data-jumpto="cs-types">Metric types</button>
      <button data-jumpto="cs-allot">Allotments &amp; billing</button>
      <button data-jumpto="cs-cm">Custom metrics</button>
      <button data-jumpto="cs-agent">Agent files &amp; commands</button>
      <button data-jumpto="cs-keys">Keys &amp; API</button>
      <button data-jumpto="cs-int">Integrations &amp; Autodiscovery</button>
      <button data-jumpto="cs-tags">Tags &amp; search</button>
      <button data-jumpto="cs-viz">Graphs &amp; dashboards</button>
      <button data-jumpto="cs-mon">Monitors</button>
      <button data-jumpto="cs-basics">Computing &amp; networking</button>
    </div>
  </div>

  <!-- PORTS -->
  <section class="panel" id="cs-ports">
    <div class="cs-head"><h2>Ports and network</h2><span class="badge">Exam-heavy</span></div>
    <p class="hint">The Agent always opens the connection. Datadog never connects in to your hosts, so no inbound rule from Datadog is needed. All Agent traffic is encrypted (SSL/TLS).</p>
    <h3>Outbound: Agent to Datadog</h3>
    <div class="tbl"><table>
      <thead><tr><th>Port</th><th>Protocol</th><th>Used for</th></tr></thead>
      <tbody>
        <tr><td>443</td><td>TCP</td><td>Nearly everything: metrics, events, service checks, APM traces, live processes and containers, profiles, Cloud Network Monitoring, flares, and logs over HTTPS (default since Agent 6.19 / 7.19)</td></tr>
        <tr><td>10516</td><td>TCP + TLS</td><td>Old log shipping over TCP to <code>agent-intake.logs.datadoghq.com</code> (US1). Deprecated, no delivery guarantee</td></tr>
        <tr><td>10514</td><td>TCP, no TLS</td><td>Old unencrypted log shipping over TCP (US1). Deprecated</td></tr>
        <tr><td>123</td><td>UDP</td><td>NTP time sync. The NTP check goes critical when the clock is off by more than 60 s</td></tr>
        <tr><td>8443</td><td>TCP</td><td>Custom Agent Autoscaling</td></tr>
        <tr><td>8042</td><td>TCP</td><td>Remote Configuration connectivity test (only when Remote Config is on; config itself is pulled over 443 from <code>config.&lt;site&gt;</code>)</td></tr>
      </tbody>
    </table></div>
    <h3>Local: ports the Agent listens on</h3>
    <div class="tbl"><table>
      <thead><tr><th>Port</th><th>Protocol</th><th>Service</th><th>Setting</th></tr></thead>
      <tbody>
        <tr><td>8125</td><td>UDP</td><td>DogStatsD (custom metrics, events, service checks)</td><td><code>dogstatsd_port</code>, <code>dogstatsd_non_local_traffic</code> / <code>DD_DOGSTATSD_NON_LOCAL_TRAFFIC</code></td></tr>
        <tr><td>8126</td><td>TCP</td><td>APM trace receiver (tracers and profiler)</td><td><code>apm_config.receiver_port</code> / <code>DD_APM_RECEIVER_PORT</code>, <code>DD_APM_NON_LOCAL_TRAFFIC</code></td></tr>
        <tr><td>5000</td><td>TCP</td><td>go_expvar server (Agent internal metrics)</td><td><code>expvar_port</code></td></tr>
        <tr><td>5001</td><td>TCP</td><td>IPC API used by the Agent CLI</td><td><code>cmd_port</code></td></tr>
        <tr><td>5002</td><td>TCP</td><td>Agent GUI (on by default on Windows and macOS, off on Linux)</td><td><code>GUI_port</code> (<code>-1</code> disables)</td></tr>
        <tr><td>5012</td><td>TCP</td><td>APM go_expvar server</td><td></td></tr>
        <tr><td>6062</td><td>TCP</td><td>Process Agent debug endpoints</td><td></td></tr>
        <tr><td>6162</td><td>TCP</td><td>Process Agent runtime configuration</td><td></td></tr>
      </tbody>
    </table></div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Where data goes</h3>
        <ul class="notes">
          <li>Metrics, events, service checks: <code>&lt;version&gt;-app.agent.&lt;site&gt;</code>. Allowlist <code>*.agent.&lt;site&gt;</code></li>
          <li>Traces: <code>trace.agent.&lt;site&gt;</code></li>
          <li>Live processes, containers, CNM: <code>process.&lt;site&gt;</code></li>
          <li>Flares: <code>&lt;version&gt;-flare.agent.&lt;site&gt;</code></li>
          <li>API calls: <code>api.&lt;site&gt;</code></li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Sites (<code>site:</code> / <code>DD_SITE</code>)</h3>
        <ul class="notes">
          <li>US1 <code>datadoghq.com</code> (the default)</li>
          <li>US3 <code>us3.datadoghq.com</code> · US5 <code>us5.datadoghq.com</code></li>
          <li>EU1 <code>datadoghq.eu</code></li>
          <li>AP1 <code>ap1.datadoghq.com</code> · AP2 <code>ap2.datadoghq.com</code></li>
          <li>US1-FED <code>ddog-gov.com</code></li>
          <li>Keys belong to one site. A wrong site means no data shows up.</li>
        </ul>
      </div>
    </div>
    <ul class="notes hint">
      <li><b>IP ranges</b>: <code>https://ip-ranges.datadoghq.com/</code> lists the IPs Datadog uses to receive data, as JSON (<code>prefixes_ipv4</code>, <code>prefixes_ipv6</code> per section: agents, api, apm, logs, process, webhooks…). Allowlist every range; the active subset changes.</li>
      <li><b>Proxy</b>: <code>proxy: https: / http: / no_proxy:</code> in datadog.yaml, or <code>DD_PROXY_HTTPS</code>. Environment variables override the file.</li>
      <li><b>Connectivity lost</b>: metrics wait in a memory queue (<code>forwarder_retry_queue_payloads_max_size</code>) and are dropped when it is full. Agent 7.27+ can also buffer to disk.</li>
      <li><b>Test connectivity</b>: <code>datadog-agent diagnose</code>.</li>
    </ul>

  <!-- DOGSTATSD -->
  <section class="panel" id="cs-dsd">
    <div class="cs-head"><h2>DogStatsD</h2><span class="badge">Exam-heavy</span></div>
    <p>A metrics aggregation server bundled with the Agent (v6+). Apps send it custom metrics, events and service checks; it aggregates them and the Agent forwards them to Datadog over HTTPS 443.</p>
    <div class="facts">
      <div><span class="label">Port</span><b>8125/UDP</b><span>Bound to localhost by default</span></div>
      <div><span class="label">Flush interval</span><b>10 s</b><span>One point per metric per interval (Agent checks run every 15 s)</span></div>
      <div><span class="label">Enabled</span><b>By default</b><span><code>use_dogstatsd: true</code>, <code>dogstatsd_port: 8125</code></span></div>
      <div><span class="label">Billing</span><b>Custom metrics</b><span>Everything sent through DogStatsD counts as custom</span></div>
    </div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Why UDP</h3>
        <ul class="notes">
          <li>Fire-and-forget: the app sends and moves on without waiting for a reply.</li>
          <li>If DogStatsD is down, the app isn't blocked or slowed; packets are just lost.</li>
          <li>Trade-off: no delivery guarantee. Use a Unix Domain Socket (<code>dogstatsd_socket</code>, <code>DD_DOGSTATSD_SOCKET</code>) to avoid network loss between containers that share a volume.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>What it adds to plain StatsD</h3>
        <ul class="notes">
          <li>Tags</li>
          <li>Histograms and distributions (timers are implemented as histograms)</li>
          <li>Events and service checks</li>
          <li>Any StatsD client can send to it but loses these extras. Use a DogStatsD client to get histograms and tags.</li>
        </ul>
      </div>
    </div>
    <h3>Datagram format</h3>
    <pre class="code">&lt;METRIC_NAME&gt;:&lt;VALUE&gt;|&lt;TYPE&gt;|@&lt;SAMPLE_RATE&gt;|#&lt;TAG_KEY&gt;:&lt;TAG_VALUE&gt;,&lt;TAG2&gt;

page.views:1|c|#env:prod,page:home      # count
queue.depth:42|g|#env:prod              # gauge
api.latency:250|ms|@0.5|#service:cart   # timer (histogram), sampled at 50%
users.online:1043|s                     # set (counts unique values)
request.size:512|d|#env:prod            # distribution

_e{5,12}:Alert|Disk is full|t:error     # event: _e{title length,text length}:title|text
_sc|app.can_connect|2|#env:prod         # service check: 0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN</pre>
    <div class="tbl"><table>
      <thead><tr><th>Type</th><th>Char</th><th>In one flush interval</th><th>Stored in-app as</th></tr></thead>
      <tbody>
        <tr><td>COUNT</td><td><code>c</code></td><td>Sums the values (<code>increment</code>/<code>decrement</code>)</td><td>RATE (per second), so decimals can appear</td></tr>
        <tr><td>GAUGE</td><td><code>g</code></td><td>Keeps the last value</td><td>GAUGE</td></tr>
        <tr><td>SET</td><td><code>s</code></td><td>Counts unique values (101, 102, 101 → 2)</td><td>GAUGE</td></tr>
        <tr><td>HISTOGRAM</td><td><code>h</code></td><td>Agent computes <code>.avg .count .median .95percentile .max</code> per host</td><td>GAUGE, with <code>.count</code> as RATE</td></tr>
        <tr><td>TIMER</td><td><code>ms</code></td><td>Same as HISTOGRAM, for durations</td><td>GAUGE + RATE</td></tr>
        <tr><td>DISTRIBUTION</td><td><code>d</code></td><td>Raw values sent to Datadog and aggregated server-side across all hosts</td><td>GAUGE + COUNT (enables global percentiles)</td></tr>
      </tbody>
    </table></div>
    <ul class="notes hint">
      <li><b>Sample rate</b> <code>@0.25</code>: the client sends about 1 in 4 events and DogStatsD multiplies counts by 1/0.25. Receiving 10 packets reports 40.</li>
      <li><b>Histogram vs distribution</b>: histogram percentiles are computed per Agent, so averaging p95 across hosts is wrong. Use a DISTRIBUTION for a fleet-wide p95/p99.</li>
      <li>Change histogram outputs with <code>histogram_aggregates</code> (default <code>max, median, avg, count</code>; add <code>min</code>, <code>sum</code>) and <code>histogram_percentiles</code> (default <code>0.95</code>).</li>
    </ul>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Receiving from other hosts or containers</h3>
        <ul class="notes">
          <li>Host Agent: <code>dogstatsd_non_local_traffic: true</code>, then restart, and allow UDP 8125 in to the Agent host.</li>
          <li>Agent container: <code>-e DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true -p 8125:8125/udp</code>. <b>The <code>/udp</code> matters</b>; Docker publishes TCP by default.</li>
          <li>In an app container, <code>localhost</code> is the app itself. Point the client at the Agent's address.</li>
          <li>Kubernetes: set <code>DD_AGENT_HOST</code> from <code>status.hostIP</code> (Downward API) so pods send to the Agent on their node. Helm: <code>dogstatsd.useHostPort</code>, <code>nonLocalTraffic</code>.</li>
          <li>Change the port with <code>dogstatsd_port</code> / <code>DD_DOGSTATSD_PORT</code>, and update every client to match.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Clients and testing</h3>
        <ul class="notes">
          <li>Python <code>datadog</code> · Ruby <code>dogstatsd-ruby</code> · Go <code>datadog-go</code> · Java <code>java-dogstatsd-client</code> · PHP <code>php-datadogstatsd</code> · .NET <code>DogStatsD-CSharp-Client</code>. (<code>ddtrace</code> is APM tracing, not metrics.)</li>
          <li>Origin detection (Agent 6.10+) adds container/pod tags to the metrics.</li>
        </ul>
        <pre class="code">from datadog import initialize, statsd
initialize(statsd_host="127.0.0.1", statsd_port=8125)
statsd.increment("page.views", tags=["env:prod"])
statsd.gauge("queue.depth", 42)
statsd.histogram("request.latency", 0.23)</pre>
        <pre class="code">echo -n "custom.metric:60|g|#shell" | nc -4u -w0 127.0.0.1 8125</pre>
      </div>
    </div>
    <p class="src"><span>Sources:</span> <a href="https://docs.datadoghq.com/developers/dogstatsd/" target="_blank" rel="noopener">DogStatsD</a> <a href="https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/" target="_blank" rel="noopener">Datagram format</a> <a href="https://docs.datadoghq.com/metrics/custom_metrics/dogstatsd_metrics_submission/" target="_blank" rel="noopener">Submitting metrics</a> <a href="https://docs.datadoghq.com/developers/dogstatsd/unix_socket/" target="_blank" rel="noopener">Unix Domain Socket</a> <a href="https://docs.datadoghq.com/containers/docker/" target="_blank" rel="noopener">Docker setup</a></p>
  </section>

  <!-- METRIC TYPES -->
  <section class="panel" id="cs-types">
    <h2>Metric types and timeseries</h2>
    <p class="hint">Values <code>[1,1,1,2,2,2,3,3]</code> received in a 10-second flush interval:</p>
    <div class="tbl"><table>
      <thead><tr><th>Type</th><th>Result</th><th>Use it for</th></tr></thead>
      <tbody>
        <tr><td>COUNT</td><td>15 (sum)</td><td>Number of events in the interval: requests handled, errors</td></tr>
        <tr><td>RATE</td><td>1.5 per second (15 / 10 s)</td><td>Events per second</td></tr>
        <tr><td>GAUGE</td><td>Last value received</td><td>A snapshot: queue depth, memory used, temperature</td></tr>
        <tr><td>HISTOGRAM</td><td>avg 1.88 · count 0.8 · median 2 · p95 3 · max 3</td><td>Per-host statistics: latency on one host</td></tr>
        <tr><td>DISTRIBUTION</td><td>Raw values kept; avg, count, min, max, sum and optional p50/p75/p90/p95/p99 across all hosts</td><td>Fleet-wide percentiles</td></tr>
      </tbody>
    </table></div>
    <ul class="notes hint">
      <li>A metric = name + value + timestamp + tags (+ type, + interval for COUNT/RATE). Values are 32-bit, not dates.</li>
      <li>Timestamps: up to 10 minutes in the future and 1 hour in the past. Fractions of a second are rounded to the nearest second.</li>
      <li>Names: start with a letter, ASCII letters, digits, <code>_</code> and <code>.</code> only (others become <code>_</code>), max 200 characters, case-sensitive.</li>
      <li>Retention: 15 months. A metric sent with no type shows as "Not Assigned".</li>
      <li>Values sent straight to the API are stored as-is; the Agent and DogStatsD aggregate per flush interval first.</li>
    </ul>
    <p class="src"><span>Sources:</span> <a href="https://docs.datadoghq.com/metrics/types/" target="_blank" rel="noopener">Metric types</a> <a href="https://docs.datadoghq.com/metrics/" target="_blank" rel="noopener">Metrics overview</a> <a href="https://docs.datadoghq.com/metrics/distributions/" target="_blank" rel="noopener">Distributions</a> <a href="https://docs.datadoghq.com/metrics/custom_metrics/" target="_blank" rel="noopener">Custom metrics rules</a> <a href="https://docs.datadoghq.com/developers/guide/data-collection-resolution-retention/" target="_blank" rel="noopener">Resolution and retention</a></p>
  </section>

  <!-- ALLOTMENTS -->
  <section class="panel" id="cs-allot">
    <div class="cs-head"><h2>Allotments and billing</h2><span class="badge">Exam-heavy</span></div>
    <div class="tbl"><table>
      <thead><tr><th>Parent unit</th><th>Included</th></tr></thead>
      <tbody>
        <tr><td>Infra Pro / host</td><td>100 custom metrics · 5 containers (per hour) · 500 custom events/month</td></tr>
        <tr><td>Infra Enterprise / host</td><td>200 custom metrics · 10 containers (per hour) · 1,000 custom events/month</td></tr>
        <tr><td>DevSecOps Pro / Enterprise</td><td>Same as Infra Pro / Enterprise</td></tr>
        <tr><td>APM host (all tiers)</td><td>1,000,000 indexed spans/month (≈1,370/hour) · 150 GB ingested spans/month</td></tr>
        <tr><td>APM Pro / Enterprise</td><td>+1 Data Streams Monitoring host per APM host</td></tr>
        <tr><td>APM Enterprise</td><td>+1 Continuous Profiler host and 4 profiled containers per APM host</td></tr>
        <tr><td>Profiler host</td><td>4 profiled containers (pooled; $2 per extra container)</td></tr>
        <tr><td>Database Monitoring host</td><td>200 normalized queries</td></tr>
        <tr><td>Serverless function</td><td>5 custom metrics per function · per app instance: 20</td></tr>
        <tr><td>Serverless APM / 1M invocations</td><td>300,000 indexed spans · 50 GB ingested spans</td></tr>
        <tr><td>CI committer</td><td>400,000 pipeline spans · 1,000,000 test spans per month</td></tr>
        <tr><td>CSM Pro / Enterprise host</td><td>5 / 20 containers · Workload Protection host: 4</td></tr>
      </tbody>
    </table></div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>How billing works</h3>
        <ul class="notes">
          <li><b>Pooled</b>: allotments add up across the account. 3 Pro hosts = 300 custom metrics, usable in any split.</li>
          <li><b>Hosts</b> (High Watermark Plan): counted hourly; bill = 99th percentile, so the top 1% of hours (about 7 in a 720-hour month) are dropped. Alternative: Hybrid Monthly/Hourly Plan.</li>
          <li><b>Containers</b>: counted every 5 minutes, hourly allotment only, billed on fractional hours.</li>
          <li><b>Custom metrics</b>: monthly average of distinct metrics per hour.</li>
          <li><b>Indexed spans</b>: summed over the month.</li>
          <li><b>Hourly on-demand</b>: allotment subtracted every hour. <b>Monthly on-demand</b>: subtracted once at month end.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Units and rules</h3>
        <ul class="notes">
          <li>Logs: per GB ingested, per million events indexed.</li>
          <li>Synthetics: API tests per 10,000 runs, browser tests per 1,000.</li>
          <li>RUM: per 1,000 sessions. A session ends after 15 min idle or 4 h of activity.</li>
          <li>CI Visibility: per committer (3+ commits in the month).</li>
          <li>A host with the Agent that the AWS integration also sees is billed once.</li>
          <li>Usage page: Admin role or <code>usage_read</code> permission. Don't estimate billing from the Host List.</li>
        </ul>
      </div>
    </div>
    <h3>Worked examples</h3>
    <div class="tbl plain"><table>
      <thead><tr><th>Scenario</th><th>Answer</th></tr></thead>
      <tbody>
        <tr><td>5 Pro hosts + 1,000 committed custom metrics</td><td>1,500 included per hour</td></tr>
        <tr><td>3 Enterprise hosts, 750 custom metrics on average</td><td>600 included → 150 overage</td></tr>
        <tr><td>4 Enterprise hosts; host A sends 700, three others 50 each</td><td>850 vs 800 pooled → 50 overage</td></tr>
        <tr><td>2 Pro hosts running 12 containers for an hour</td><td>10 included → 2 billable</td></tr>
        <tr><td>4 APM hosts, 5,500,000 spans indexed in a month</td><td>4,000,000 included → 1,500,000 billable</td></tr>
        <tr><td>3 APM Enterprise hosts profiling 15 containers</td><td>12 included → 3 billable</td></tr>
        <tr><td>100 hosts all month, 400 hosts for a 5-hour load test</td><td>Billed for 100 (those 5 hours fall in the dropped top 1%)</td></tr>
      </tbody>
    </table></div>

  <!-- CUSTOM METRICS -->
  <section class="panel" id="cs-cm">
    <div class="cs-head"><h2>Custom metrics</h2><span class="badge">Exam-heavy</span></div>
    <p><b>One custom metric = metric name + one unique combination of tag values, host included.</b></p>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>What counts as custom</h3>
        <ul class="notes">
          <li>Anything sent through DogStatsD or a custom Agent check.</li>
          <li>Marketplace integrations and integrations outside Datadog's 1,000+.</li>
          <li>Some standard integrations: Java-JMX, ActiveMQ XML, Go-Expvar (capped at 350 by default); Prometheus/OpenMetrics, Nagios, WMI, PDH, Windows performance counters (no cap); custom queries in MySQL, Postgres, Oracle, SQL Server.</li>
          <li>Not custom: the documented standard metrics of an integration (<code>system.cpu.user</code>, <code>aws.ec2.cpuutilization</code>).</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Counting per tag combination</h3>
        <div class="tbl"><table style="min-width:0">
          <tbody>
            <tr><td>Gauge, count, rate</td><td>1</td></tr>
            <tr><td>Histogram (default)</td><td>5</td></tr>
            <tr><td>Distribution</td><td>5, or 10 with percentiles</td></tr>
          </tbody>
        </table></div>
        <p class="hint">Example: <code>request.Latency</code> tagged endpoint (X, Y) × status (200, 400) = 4 combinations → gauge 4, histogram 20, distribution 20 (40 with percentiles).</p>
      </div>
    </div>
    <ul class="notes hint">
      <li>Sending more often doesn't add metrics. Reordering tags doesn't either. A tag that adds no new granularity (adding <code>state</code> when <code>city</code> exists) doesn't either.</li>
      <li>Unbounded tag values (<code>user_id</code>, <code>request_id</code>, timestamps) multiply the count: 4 endpoints × 50,000 users = 200,000 metrics.</li>
      <li><b>Metrics without Limits</b>: <i>ingested</i> = everything sent; <i>indexed</i> = what stays queryable after the tag allowlist. Unconfigured metrics are billed on indexed only. Ingested overage: $0.10 per 100.</li>
      <li>See near-real-time counts for one metric in Metrics Summary; account totals on the Usage page.</li>
    </ul>
    <p class="src"><span>Sources:</span> <a href="https://docs.datadoghq.com/account_management/billing/custom_metrics/" target="_blank" rel="noopener">Custom metrics billing</a> <a href="https://docs.datadoghq.com/metrics/custom_metrics/" target="_blank" rel="noopener">Custom metrics</a> <a href="https://docs.datadoghq.com/metrics/summary/" target="_blank" rel="noopener">Metrics Summary</a></p>
  </section>

  <!-- AGENT -->
  <section class="panel" id="cs-agent">
    <h2>Agent: files, commands, logs</h2>
    <div class="tbl"><table>
      <thead><tr><th>OS</th><th>datadog.yaml</th><th>Integration configs</th><th>Logs</th></tr></thead>
      <tbody>
        <tr><td>Linux</td><td><code>/etc/datadog-agent/datadog.yaml</code></td><td><code>/etc/datadog-agent/conf.d/</code></td><td><code>/var/log/datadog/</code></td></tr>
        <tr><td>macOS</td><td><code>/opt/datadog-agent/etc/datadog.yaml</code></td><td><code>/opt/datadog-agent/etc/conf.d/</code></td><td><code>/opt/datadog-agent/logs/</code></td></tr>
        <tr><td>Windows</td><td><code>%ProgramData%\Datadog\datadog.yaml</code></td><td><code>%ProgramData%\Datadog\conf.d\</code></td><td><code>C:\ProgramData\Datadog\logs\</code></td></tr>
      </tbody>
    </table></div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Config rules</h3>
        <ul class="notes">
          <li>Each integration has <code>conf.d/&lt;name&gt;.d/</code>. Rename <code>conf.yaml.example</code> to <code>conf.yaml</code> to enable it.</li>
          <li><code>conf.yaml.default</code> turns on core checks (cpu, disk, memory); ignored if other config exists.</li>
          <li><code>auto_conf.yaml</code> is an Autodiscovery template. <code>metrics.yaml</code> lists JMX beans.</li>
          <li>Custom check: <code>checks.d/my_check.py</code> + <code>conf.d/my_check.yaml</code>, and <b>the names must match</b>. Prefix with <code>custom_</code> to avoid clashing with real integrations.</li>
          <li><b>Restart the Agent after editing</b> datadog.yaml or a check config. Changes apply the next time it starts. (A few settings such as <code>log_level</code> can be changed live with <code>datadog-agent config set</code>.)</li>
          <li>The example file <code>datadog.yaml.example</code> lists every option with its default, commented out.</li>
          <li>YAML: spaces only, never tabs.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Key settings</h3>
        <ul class="notes">
          <li><code>api_key</code>, <code>site</code>, <code>hostname</code>, <code>tags</code>, <code>env</code></li>
          <li><code>logs_enabled: true</code> to collect logs</li>
          <li><code>apm_config.enabled</code> (on by default)</li>
          <li><code>use_dogstatsd</code>, <code>dogstatsd_port</code>, <code>dogstatsd_non_local_traffic</code></li>
          <li><code>log_level</code>: trace · debug · <b>info (default)</b> · warn · error · critical · off. Each level logs itself plus everything more severe, so <code>warn</code> = warn + error + critical.</li>
          <li>Containers: <code>DD_API_KEY</code> (required), <code>DD_SITE</code>, <code>DD_HOSTNAME</code>, <code>DD_TAGS</code> (space-separated), <code>DD_LOGS_ENABLED</code>, <code>DD_LOG_LEVEL</code>.</li>
        </ul>
      </div>
    </div>
    <h3>Commands</h3>
    <div class="tbl wrapmono"><table>
      <thead><tr><th>Command</th><th>What it does</th></tr></thead>
      <tbody>
        <tr><td>sudo systemctl start|stop|restart datadog-agent</td><td>Linux (systemd). Older hosts: <code>sudo service datadog-agent start</code>. After a stop, use <code>start</code>, not <code>restart</code></td></tr>
        <tr><td>sudo datadog-agent status</td><td>Overall health: running checks, forwarder, DogStatsD, logs, APM. Check this first when data is missing</td></tr>
        <tr><td>sudo -u dd-agent -- datadog-agent check &lt;name&gt;</td><td>Runs one check once and prints its metrics and errors</td></tr>
        <tr><td>datadog-agent configcheck</td><td>Prints every configuration loaded and resolved, including Autodiscovery</td></tr>
        <tr><td>datadog-agent diagnose</td><td>Tests connectivity to Datadog</td></tr>
        <tr><td>datadog-agent flare &lt;case_id&gt;</td><td>Sends logs and configs (secrets scrubbed) to Support</td></tr>
        <tr><td>datadog-agent hostname</td><td>Prints the hostname the Agent uses</td></tr>
        <tr><td>datadog-agent health · version · launch-gui · stream-logs · jmx · config</td><td>Health check, version, open the GUI (port 5002), live log stream, JMX troubleshooting, runtime config</td></tr>
        <tr><td>agent.exe start-service · restart-service · stopservice</td><td>Windows only (<code>%ProgramFiles%\Datadog\Datadog Agent\bin\</code>)</td></tr>
        <tr><td>sudo launchctl kickstart [-k] system/com.datadoghq.agent</td><td>macOS start (<code>-k</code> restarts); stop with <code>launchctl kill SIGTERM system/com.datadoghq.agent</code></td></tr>
        <tr><td>docker exec -it &lt;container&gt; agent status</td><td>Docker. Kubernetes: <code>kubectl exec -it &lt;pod&gt; -- agent status</code></td></tr>
      </tbody>
    </table></div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Install</h3>
        <ul class="notes">
          <li>Check that the OS and version are supported first.</li>
          <li>One-line script with <code>DD_API_KEY</code> and <code>DD_SITE</code>.</li>
          <li>Ansible: install from Ansible Galaxy first (<code>datadog.dd</code> collection; the <code>datadog.datadog</code> role is legacy), then run the playbook. Also Chef, Puppet, SaltStack.</li>
          <li>Docker: <code>registry.datadoghq.com/agent:7</code>, mounting <code>/var/run/docker.sock</code> (Docker API), <code>/proc/</code>, <code>/sys/fs/cgroup/</code>.</li>
          <li>Kubernetes: Helm chart or Datadog Operator (DaemonSet).</li>
          <li>Host Agent + Docker integration: <code>usermod -a -G docker dd-agent</code>.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Hostname and architecture</h3>
        <ul class="notes">
          <li>A <code>hostname</code> set in config wins. On EC2 with a default <code>ip-10-…</code> OS hostname, the Agent uses the <b>instance ID</b>.</li>
          <li>Several names for one host (instance ID, <code>ip-…</code>, FQDN) → one canonical name; the rest become <b>host aliases</b>.</li>
          <li>Containers (Agent 7.40+) exit if the hostname can't be found. Fix access to kubelet or cloud metadata, or set <code>DD_HOSTNAME</code>.</li>
          <li>Components: collector (checks every 15 s), forwarder (HTTPS out), DogStatsD, trace-agent (APM), process-agent (built into the core Agent on Linux 7.65+).</li>
          <li>Runs as user <code>dd-agent</code> on Linux. It needs read access to any log file it tails.</li>
        </ul>
      </div>
    </div>

  <!-- TAGS & SEARCH -->
  <section class="panel" id="cs-tags">
    <h2>Tags and search</h2>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Tag rules</h3>
        <ul class="notes">
          <li><code>key:value</code> recommended. The key is everything before the first colon.</li>
          <li>Must start with a letter, max 200 characters, lowercased.</li>
          <li>Allowed: letters, digits, <code>_ - : . /</code>. Others, including spaces, become <code>_</code>.</li>
          <li>Reserved: <code>host</code>, <code>device</code>, <code>source</code>, <code>service</code>, <code>env</code>, <code>version</code>, <code>team</code>.</li>
          <li>Set in config files, the UI, the API, or DogStatsD; integrations inherit host tags.</li>
          <li>Avoid unbounded values (IDs, timestamps).</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Unified service tagging</h3>
        <div class="tbl"><table style="min-width:0">
          <tbody>
            <tr><td>Env vars</td><td><code>DD_ENV</code>, <code>DD_SERVICE</code>, <code>DD_VERSION</code></td></tr>
            <tr><td>Docker labels</td><td><code>com.datadoghq.tags.env|service|version</code></td></tr>
            <tr><td>Kubernetes labels</td><td><code>tags.datadoghq.com/env|service|version</code></td></tr>
          </tbody>
        </table></div>
        <p class="hint"><code>env</code>, <code>service</code>, <code>version</code> link metrics, traces and logs, and let you compare deployments.</p>
      </div>
    </div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Metric query syntax</h3>
        <pre class="code">avg:system.cpu.user{env:prod,role:db} by {host}
{env:prod AND location NOT IN (atlanta,seattle)}
{!device:/dev/loop*}      exclude
{host:web-*}              wildcard</pre>
        <p class="hint">Comma inside <code>{}</code> means AND. Also <code>OR</code>, <code>IN</code>, <code>NOT IN</code>.</p>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Log search syntax</h3>
        <pre class="code">service:web status:error         two terms = AND
service:web -status:info         exclude
@http.status_code:[400 TO 499]   attribute range
@user.name:ali*                  wildcard</pre>
        <p class="hint">Tags have no prefix; attributes start with <code>@</code>. Attribute values are case-sensitive. <b>Facets</b> are for filtering and grouping (qualitative); <b>measures</b> for ranges and math (quantitative). Live Tail shows logs as they arrive, even ones excluded from indexes.</p>
      </div>
    </div>
    <p class="src"><span>Sources:</span> <a href="https://docs.datadoghq.com/getting_started/tagging/" target="_blank" rel="noopener">Tagging</a> <a href="https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/" target="_blank" rel="noopener">Unified service tagging</a> <a href="https://docs.datadoghq.com/getting_started/tagging/assigning_tags/" target="_blank" rel="noopener">Assigning tags</a> <a href="https://docs.datadoghq.com/metrics/advanced-filtering/" target="_blank" rel="noopener">Metric filtering</a> <a href="https://docs.datadoghq.com/logs/explorer/search_syntax/" target="_blank" rel="noopener">Log search syntax</a> <a href="https://docs.datadoghq.com/logs/explorer/facets/" target="_blank" rel="noopener">Facets</a></p>
  </section>

  <!-- VIZ -->
  <section class="panel" id="cs-viz">
    <h2>Graphs, dashboards and the Host Map</h2>
    <h3>How a query becomes a graph</h3>
    <ol class="notes">
      <li><b>Scope</b>: pick the sources that match the tags (<code>{env:prod}</code>, or <code>{*}</code> for all).</li>
      <li><b>Time aggregation (rollup)</b>: reduce each source to one value per time bucket (default avg; about 300 points per graph). <code>.rollup(sum, 60)</code> sums 60-second buckets.</li>
      <li><b>Space aggregation</b>: combine sources (avg, sum, min, max). <code>by {host}</code> keeps one line per host.</li>
      <li><b>Functions</b> and arithmetic are applied last. <code>.as_count()</code> / <code>.as_rate()</code> for counts; <code>calendar_shift("-7d")</code> overlays last week (<code>week_before()</code> is deprecated).</li>
    </ol>
    <div class="tbl plain"><table>
      <thead><tr><th>You want to show</th><th>Widget</th></tr></thead>
      <tbody>
        <tr><td>A metric over time, or this week vs last week</td><td>Timeseries</td></tr>
        <tr><td>One current number</td><td>Query Value</td></tr>
        <tr><td>Top 10 hosts by CPU</td><td>Top List</td></tr>
        <tr><td>Change vs an hour, day, week or month ago</td><td>Change</td></tr>
        <tr><td>Two metrics per host against each other</td><td>Scatter Plot</td></tr>
        <tr><td>Distribution of values over time</td><td>Heatmap (Distribution for one moment)</td></tr>
        <tr><td>Counts of monitors in Alert, Warn, No Data, OK</td><td>Monitor Summary</td></tr>
        <tr><td>Your hosts as tiles colored by a metric</td><td>Host Map</td></tr>
      </tbody>
    </table></div>
    <ul class="notes hint">
      <li><b>Template variables</b> (<code>$env</code>) rescope every widget that uses them.</li>
      <li>Layouts: Dashboards (grid), Timeboards (automatic layout, shared time frame, good for troubleshooting), Screenboards (free-form, status boards).</li>
      <li><b>Host Map</b>: one tile per host. <b>Filter by</b> tags, <b>Group by</b> tags (e.g. availability zone, then instance type), <b>Fill by</b> a metric (color, default CPU), <b>Size by</b> a metric.</li>
      <li><b>Host List</b> (Infrastructure > Hosts, formerly Infrastructure List): hosts active in the last 15 minutes by default, with aliases, tags and integrations.</li>
      <li><b>Software Catalog</b> (now titled "Catalog"): one view of every discovered service.</li>
      <li>System metrics: <code>system.cpu.user</code> app code · <code>system.cpu.system</code> kernel · <code>system.cpu.iowait</code> waiting on disk · <code>system.cpu.stolen</code> hypervisor · <code>system.load.1/5/15</code> · <code>system.mem.usable</code> · <code>system.swap.used</code> · <code>system.disk.in_use</code> (fraction).</li>
    </ul>

  <!-- MONITORS -->
  <section class="panel" id="cs-mon">
    <h2>Monitors and alerts</h2>
    <div class="tbl plain"><table>
      <thead><tr><th>You want to know when…</th><th>Monitor type</th></tr></thead>
      <tbody>
        <tr><td>A host or its Agent stops reporting</td><td>Host (<code>datadog.agent.up</code>)</td></tr>
        <tr><td>A process stops running</td><td>Process Check (<code>process.up</code>) or Live Process</td></tr>
        <tr><td>A URL or TCP port is unreachable</td><td>Network (HTTP / TCP check)</td></tr>
        <tr><td>A metric crosses a fixed threshold</td><td>Metric, threshold alert</td></tr>
        <tr><td>A metric moves by X% vs earlier</td><td>Metric, change alert</td></tr>
        <tr><td>A metric behaves unusually for its history</td><td>Anomaly</td></tr>
        <tr><td>One host behaves unlike its peers</td><td>Outlier</td></tr>
        <tr><td>A metric will cross a threshold soon (disk full)</td><td>Forecast</td></tr>
        <tr><td>Several monitors alert together</td><td>Composite (<code>a &amp;&amp; b</code>, <code>||</code>, <code>!</code>)</td></tr>
        <tr><td>Too many matching logs</td><td>Logs</td></tr>
        <tr><td>A custom check reports CRITICAL</td><td>Service Check</td></tr>
      </tbody>
    </table></div>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Configuration</h3>
        <ul class="notes">
          <li><b>Simple alert</b>: one alert for the whole query. <b>Multi alert</b>: one per group (<code>by {host}</code>).</li>
          <li>Thresholds: alert, warning, and recovery for each. Value 85 with warn 80 / alert 90 = <b>Warn</b>.</li>
          <li>States: OK, Warn, Alert, No Data.</li>
          <li>If data is missing: show OK, show No Data, or show No Data and notify.</li>
          <li><b>Sparse metric</b> (reports only right before a failure): alert on max ("at least once") over the window, and don't notify on missing data.</li>
          <li>Renotify while still alerting; priority P1–P5.</li>
          <li><b>Downtimes</b> silence notifications during planned maintenance. Don't delete monitors.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Message template</h3>
        <pre class="code">{{#is_alert}}Disk {{value}}% on {{host.name}} @pagerduty-ops{{/is_alert}}
{{#is_warning}}Disk filling up @slack-ops{{/is_warning}}
{{#is_recovery}}Recovered{{/is_recovery}}
{{^is_alert}}Not in alert{{/is_alert}}
@ops-team@example.com</pre>
        <ul class="notes hint">
          <li><code>{{value}}</code> is the value that breached; <code>{{threshold}}</code>; <code>{{host.name}}</code> in multi alerts by host.</li>
          <li>Handles: <code>@email</code>, <code>@slack-&lt;channel&gt;</code>, <code>@pagerduty-&lt;service&gt;</code>, <code>@webhook-&lt;name&gt;</code>.</li>
          <li>A handle inside <code>{{#is_alert}}</code> isn't notified on recovery; handles outside any block always are.</li>
          <li>Also <code>{{#is_no_data}}</code>, <code>{{^is_renotify}}</code> (first notification only).</li>
        </ul>
      </div>
    </div>
    <p class="src"><span>Sources:</span> <a href="https://docs.datadoghq.com/monitors/types/" target="_blank" rel="noopener">Monitor types</a> <a href="https://docs.datadoghq.com/monitors/configuration/" target="_blank" rel="noopener">Configuration</a> <a href="https://docs.datadoghq.com/monitors/notify/variables/" target="_blank" rel="noopener">Notification variables</a> <a href="https://docs.datadoghq.com/monitors/downtimes/" target="_blank" rel="noopener">Downtimes</a> <a href="https://docs.datadoghq.com/monitors/guide/monitoring-sparse-metrics/" target="_blank" rel="noopener">Sparse metrics</a> <a href="https://docs.datadoghq.com/monitors/types/composite/" target="_blank" rel="noopener">Composite monitors</a></p>
  </section>

  <!-- BASICS -->
  <section class="panel" id="cs-basics">
    <h2>Computing and networking basics</h2>
    <div class="cols">
      <div class="stack" style="gap:6px">
        <h3>Hardware</h3>
        <ul class="notes">
          <li><b>CPU</b> runs instructions. Load average = processes running or waiting; compare it to the core count.</li>
          <li><b>RAM</b> is volatile and holds the apps and data in use now.</li>
          <li><b>Swap</b> is disk used as RAM when RAM is full (slow). Many page faults mean too little RAM.</li>
          <li><b>Storage</b> is persistent. SSD beats HDD on latency and IOPS. A disk can run out of inodes while it still has space.</li>
          <li>Bits vs bytes: 100 Mbps ÷ 8 = 12.5 MB/s.</li>
        </ul>
        <h3>Linux</h3>
        <ul class="notes">
          <li><code>cat /etc/os-release</code> (or <code>/etc/os*</code>) distro and version · <code>uname -r</code> kernel · <code>hostname</code> / <code>uname -n</code></li>
          <li><code>top</code>, <code>ps aux</code>, <code>free -m</code>, <code>df -h</code>, <code>du -sh</code>, <code>tail -f</code>, <code>journalctl</code>, <code>systemctl</code></li>
          <li><code>chmod 640</code> = owner rw, group r, others none · <code>chown</code> · <code>sudo</code></li>
          <li><code>apt</code> (Debian/Ubuntu) vs <code>yum</code>/<code>dnf</code> (RHEL/CentOS/Amazon Linux)</li>
          <li><code>/etc</code> config · <code>/var/log</code> logs · <code>/proc</code> kernel pseudo-filesystem · <code>/opt</code> add-on software</li>
          <li>Linux is free and open source; Windows is proprietary.</li>
        </ul>
      </div>
      <div class="stack" style="gap:6px">
        <h3>Networking</h3>
        <ul class="notes">
          <li><b>TCP</b>: connection-oriented, handshake (SYN, SYN-ACK, ACK), reliable and ordered. <b>UDP</b>: connectionless, faster, less reliable.</li>
          <li>A <b>port</b> is an endpoint that identifies a service on a host, so many services can share one IP.</li>
          <li>HTTP 80 · HTTPS 443 · SSH 22 · DNS 53 · NTP 123/UDP · SNMP 161 (traps 162) · syslog 514 · SMTP 25</li>
          <li>Private ranges: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Loopback <code>127.0.0.1</code>.</li>
          <li><code>/24</code> = mask 255.255.255.0 (256 addresses). <code>192.168.1.1/16</code> and <code>192.168.2.1/16</code> share a subnet; with <code>/24</code> they don't.</li>
          <li>HTTP codes: 2xx success · 3xx redirect · 401 unauthenticated · 403 forbidden · 404 · 429 too many requests · 5xx server error.</li>
          <li>Tools: <code>curl</code>, <code>ping</code>, <code>traceroute</code>, <code>dig</code>/<code>nslookup</code>, <code>nc -zv host port</code>, <code>ss -tulpn</code>.</li>
          <li>Cloud Network Monitoring graphs throughput, TCP retransmits and latency between services.</li>
        </ul>
        <h3>File formats</h3>
        <ul class="notes">
          <li><b>YAML</b>: indentation with spaces (no tabs) sets nesting; <code>-</code> for lists; <code>#</code> comments.</li>
          <li><b>JSON</b>: double quotes only, no comments, no trailing commas.</li>
          <li><b>Shell</b>: <code>#!/bin/bash</code> picks the interpreter · <code>&gt;</code> overwrites, <code>&gt;&gt;</code> appends · <code>2&gt;&amp;1</code> sends errors to the same place · <code>&amp;&amp;</code> runs the next command only on success · <code>$?</code> is the last exit code.</li>
        </ul>
      </div>

<script>
const DATA = {"questions":[{"id":"fund-001","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"easy","q":"Which statement about RAM is correct?","options":["A disk area the OS falls back to when physical memory runs out","Volatile memory holding the programs and data currently in use","Non-volatile storage that keeps its contents after the host reboots"],"answer":1,"explanation":"RAM is fast, volatile working memory: it holds running programs and their data and is cleared when power is lost. The disk area used when memory runs out is swap.","notes":["That describes swap space, a disk area used as overflow when RAM is full.","Correct: RAM is fast, volatile working memory for running programs and their data.","That describes persistent storage such as an SSD or HDD; RAM loses its contents at power-off."],"ref":"https://en.wikipedia.org/wiki/Random-access_memory","verified":"2026-10"},{"id":"fund-002","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"easy","q":"What is swap space on a Linux host?","options":["A CPU cache layer that sits between main memory and the processor cores","Disk space used as overflow memory when RAM is full","A reserved region of physical RAM that only the kernel is allowed to use"],"answer":1,"explanation":"Swap is disk-backed space the OS pages memory out to when RAM is exhausted. Because disk is far slower than RAM, heavy swapping degrades performance.","notes":["CPU caches (L1/L2/L3) are on-chip SRAM, not disk space; swap lives on disk.","Correct: swap is disk space the OS pages memory out to when RAM is exhausted.","Kernel-reserved memory is part of RAM; swap is on disk and holds pages from any process."],"ref":"https://en.wikipedia.org/wiki/Memory_paging","verified":"2026-10"},{"id":"fund-003","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"A host shows a high, sustained rate of major page faults and system.swap.used keeps climbing. What is the MOST likely cause?","options":["The CPU has too few cores to schedule all running processes","The root filesystem has run out of inodes for new files","The host does not have enough RAM"],"answer":2,"explanation":"Many page faults plus growing swap usage mean the OS keeps moving memory pages between RAM and disk because RAM is insufficient. Adding cores or inodes would not fix that.","notes":["Too few cores shows up as high load per core and CPU usage, not as page faults and swap growth.","Inode exhaustion causes 'No space left on device' on file creation, not paging or swap use.","Correct: frequent major page faults plus rising swap mean pages are moving between RAM and disk because RAM is insufficient."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-004","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"A 4-core Linux host reports a 1-minute load average (system.load.1) of 4.0. How should this be read?","options":["The CPUs are only 4% utilized","Demand roughly matches capacity: about one running or waiting process per core","The host is overloaded at 400% of its capacity"],"answer":1,"explanation":"Load average counts processes running or waiting to run, so it must be compared with the core count. A load of 4 on 4 cores means the CPUs are about fully used without a queue building.","notes":["Load average is a count of runnable/waiting processes, not a utilization percentage.","Correct: load 4.0 on 4 cores is about one runnable process per core, roughly full but no queue.","Load must be divided by core count; 4.0 on 4 cores is about 100%, not 400%."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-005","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"hard","q":"Host A has 2 CPU cores and a 1-minute load average of 6. Host B has 16 cores and a load average of 8. Which statement is correct?","options":["Host B, because its absolute load average is higher than Host A's","Host A, at 3 processes per core versus 0.5 per core on Host B","Neither; both are equally saturated because each load is above 1.0"],"answer":1,"explanation":"Load must be normalized by cores: 6/2 = 3 per core (processes queueing) versus 8/16 = 0.5 per core. Datadog exposes this directly as system.load.norm.1 (load divided by the number of CPUs).","notes":["Absolute load ignores core count; 8 spread over 16 cores is only 0.5 per core.","Correct: 6/2 = 3 per core versus 8/16 = 0.5; system.load.norm.1 shows this normalized value.","Above 1.0 matters only per core; Host B at 0.5 per core is not saturated."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-006","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"A graph shows system.cpu.system is high while system.cpu.user stays low. Where is the CPU spending most of its time?","options":["Running user-space application code such as the web server or database","Sitting idle while waiting for outstanding disk I/O requests to complete","Running kernel code (system calls, drivers, interrupts)"],"answer":2,"explanation":"system.cpu.system is the percentage of time the CPU runs kernel code; system.cpu.user is time in user-space processes. Waiting on disk is reported as system.cpu.iowait.","notes":["User-space application time is system.cpu.user, which the stem says is low.","Time waiting on disk I/O is reported as system.cpu.iowait, not system.cpu.system.","Correct: system.cpu.system is the percent of time the CPU spent running the kernel."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-007","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"On a database host, system.cpu.iowait is consistently high. What does this indicate?","options":["The CPU is often waiting for disk I/O operations to finish","The hypervisor is giving physical CPU time to other virtual machines","The CPU is busy executing kernel code"],"answer":0,"explanation":"iowait is the percentage of time the CPU waits for I/O operations to complete, which usually points to a storage bottleneck. Hypervisor contention is shown by steal time (system.cpu.stolen).","notes":["Correct: system.cpu.iowait is the percent of time the CPU waited for I/O operations to complete.","Hypervisor contention is system.cpu.stolen (steal time), not iowait.","Kernel execution time is system.cpu.system, not iowait."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-008","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"On a cloud VM, system.cpu.stolen is high. What does this metric indicate?","options":["A hidden process on the VM is consuming CPU time that top does not account for","The kernel is reclaiming CPU time from processes that exceeded their cgroup limit","The virtual CPU is waiting while the hypervisor services other virtual CPUs"],"answer":2,"explanation":"Steal time is the percentage of time a virtual CPU waits for the hypervisor to service another virtual CPU. It applies only to virtual machines and usually means noisy neighbors or an undersized instance.","notes":["Unaccounted in-guest processes would still show as user or system time, not steal time.","cgroup CPU throttling is a container limit, unrelated to hypervisor steal time.","Correct: steal is time the virtual CPU waits for the hypervisor to service another virtual CPU."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"fund-009","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"Why does an SSD typically deliver far higher IOPS and lower latency than an HDD?","options":["No moving parts, so no seek time or rotational delay","It caches all data in RAM, which is faster but lost on power-off","It uses a larger block size, so fewer operations are needed per file"],"answer":0,"explanation":"HDDs must physically move a head and wait for a platter to spin; SSDs read flash memory electronically. SSDs are still persistent (non-volatile) storage.","notes":["Correct: SSDs use flash with no moving parts, so there is no seek time or rotational latency.","SSDs store data in non-volatile flash, not RAM; data survives power loss.","Block size is not the reason; the speedup comes from eliminating mechanical seeks and rotation."],"ref":"https://en.wikipedia.org/wiki/Solid-state_drive","verified":"2026-10"},{"id":"fund-010","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"easy","q":"A storage volume is rated at 3,000 IOPS. What does IOPS measure?","options":["The number of megabytes per second the device can transfer","The average time a single read or write takes to complete","The number of read/write operations the device can perform per second"],"answer":2,"explanation":"IOPS is input/output operations per second. Megabytes per second is throughput, and time per operation is latency; all three are different storage measures.","notes":["Megabytes per second is throughput (bandwidth), not IOPS.","Time per operation is latency, not IOPS.","Correct: IOPS is input/output operations per second."],"ref":"https://en.wikipedia.org/wiki/IOPS","verified":"2026-10"},{"id":"fund-011","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"hard","q":"df -h shows a filesystem is only 40% full, yet applications writing to it fail with \"No space left on device\". What should be checked next?","options":["Swap usage with swapon --show, since writes fail once swap space is full","Inode usage with df -i, since many small files can exhaust inodes","Memory usage with free -m, since a full page cache can block new disk writes"],"answer":1,"explanation":"Each file uses one inode; when inodes run out no new files can be created even with free blocks. Datadog's Disk check reports this as system.fs.inodes.in_use.","notes":["Swap is used for memory paging; a full swap does not cause filesystem write errors.","Correct: each file uses an inode; df -i shows inode exhaustion, tracked as system.fs.inodes.in_use.","Page cache is reclaimable memory and does not produce 'No space left on device'."],"ref":"https://docs.datadoghq.com/integrations/disk/","verified":"2026-10"},{"id":"fund-012","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"easy","q":"How many bits are in one byte?","options":["4","8","16"],"answer":1,"explanation":"One byte is 8 bits. Network speeds are usually quoted in bits per second, while file and memory sizes are quoted in bytes.","notes":["4 bits is a nibble (half a byte).","Correct: one byte is 8 bits.","16 bits is two bytes (often called a word on some architectures)."],"ref":"https://en.wikipedia.org/wiki/Byte","verified":"2026-10"},{"id":"fund-013","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"A network link is rated at 100 Mbps. Ignoring protocol overhead, what is its maximum transfer rate in megabytes per second?","options":["12.5 MB/s","100 MB/s","800 MB/s"],"answer":0,"explanation":"Mbps is megabits per second. Divide by 8 bits per byte: 100 / 8 = 12.5 MB/s. 800 comes from multiplying instead of dividing.","notes":["Correct: 100 megabits / 8 bits per byte = 12.5 megabytes per second.","100 MB/s confuses megabits (Mb) with megabytes (MB).","800 multiplies by 8 instead of dividing; converting bits to bytes divides by 8."],"ref":"https://en.wikipedia.org/wiki/Data-rate_units","verified":"2026-10"},{"id":"fund-014","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"hard","q":"A network graph shows a host receiving 2,500,000 bytes per second. Roughly what is this in megabits per second?","options":["0.3 Mbps","2.5 Mbps","20 Mbps"],"answer":2,"explanation":"Multiply bytes by 8 to get bits: 2,500,000 x 8 = 20,000,000 bits/s = 20 Mbps. 2.5 skips the conversion and 0.3 divides by 8 instead of multiplying.","notes":["0.3 divides by 8; converting bytes to bits multiplies by 8.","2.5 is the value in megabytes per second, skipping the bytes-to-bits conversion.","Correct: 2,500,000 bytes/s x 8 = 20,000,000 bits/s = 20 Mbps (system.net.bytes_rcvd is bytes per second)."],"ref":"https://docs.datadoghq.com/integrations/network/","verified":"2026-10"},{"id":"fund-015","topic":"Computing Fundamentals","subtopic":"Hardware","difficulty":"medium","q":"On a Linux host, which network interface is \"lo\"?","options":["The loopback interface for traffic to the host itself (127.0.0.1)","The primary physical Ethernet adapter connected to the local network switch","The default-route interface used for outbound traffic to the internet"],"answer":0,"explanation":"lo is the virtual loopback interface for 127.0.0.1. Physical NICs typically have names like eth0 or ens5. By default DogStatsD listens on localhost, which is reached through loopback.","notes":["Correct: lo is the virtual loopback interface for 127.0.0.1, traffic that never leaves the host.","Physical NICs have names like eth0, ens5 or enp0s3, not lo.","The default route usually goes through a physical or virtual NIC such as eth0, never loopback."],"ref":"https://en.wikipedia.org/wiki/Localhost","verified":"2026-10"},{"id":"fund-016","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"easy","q":"Which command displays the Linux distribution name and version of a host?","options":["uname -r","cat /proc/cpuinfo","cat /etc/os-release"],"answer":2,"explanation":"/etc/os-release holds distribution identification such as NAME, ID and VERSION_ID. uname -r shows the kernel release, not the distribution.","notes":["uname -r prints the kernel release, not the distribution name.","/proc/cpuinfo describes the processors, not the OS distribution.","Correct: /etc/os-release contains NAME, ID, VERSION_ID and similar distribution fields."],"ref":"https://www.freedesktop.org/software/systemd/man/latest/os-release.html","verified":"2026-10"},{"id":"fund-017","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"easy","q":"Which command prints the release of the running Linux kernel (for example 5.15.0-91-generic)?","options":["cat /etc/hostname","uname -r","lsb_release -c"],"answer":1,"explanation":"uname -r prints the kernel release. /etc/hostname holds the host name and lsb_release -c prints the distribution codename.","notes":["/etc/hostname holds the host name only.","Correct: uname -r prints the running kernel release.","lsb_release -c prints the distribution codename (for example jammy), not the kernel."],"ref":"https://man7.org/linux/man-pages/man1/uname.1.html","verified":"2026-10"},{"id":"fund-018","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"easy","q":"Which command prints the host's network node name, the same value as the hostname command?","options":["uname -n","uname -m","uname -r"],"answer":0,"explanation":"uname -n prints the network node hostname. -r is the kernel release and -m the machine hardware name (for example x86_64).","notes":["Correct: uname -n prints the network node hostname.","uname -m prints the machine hardware name, such as x86_64.","uname -r prints the kernel release."],"ref":"https://man7.org/linux/man-pages/man1/uname.1.html","verified":"2026-10"},{"id":"fund-019","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"medium","q":"Which file contains lines such as ID=ubuntu and VERSION_ID=\"22.04\"?","options":["/proc/version","/proc/sys/kernel/osrelease","/etc/os-release"],"answer":2,"explanation":"/etc/os-release is the standard distribution identification file. /proc/version shows the kernel version string and /proc/sys/kernel/osrelease holds only the kernel release.","notes":["/proc/version shows the kernel version and build string, not distribution IDs.","/proc/sys/kernel/osrelease holds only the kernel release string.","Correct: /etc/os-release is the standard distribution identification file with ID and VERSION_ID."],"ref":"https://www.freedesktop.org/software/systemd/man/latest/os-release.html","verified":"2026-10"},{"id":"fund-020","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"easy","q":"Which command shows the host's total, used and free memory and swap in megabytes?","options":["free -m","df -m","du -m"],"answer":0,"explanation":"free reports RAM and swap usage; -m displays megabytes. df reports filesystem space and du reports space used by files and directories.","notes":["Correct: free reports RAM and swap totals, used and free; -m shows megabytes.","df reports filesystem disk space, not memory.","du reports disk space used by files and directories, not memory."],"ref":"https://man7.org/linux/man-pages/man1/free.1.html","verified":"2026-10"},{"id":"fund-021","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"medium","q":"You need the total disk space used by everything under /var/log. Which command gives that number?","options":["df -h /var/log","du -sh /var/log","ls -lh /var/log"],"answer":1,"explanation":"du -sh sums the space used by a directory tree. df -h /var/log shows usage of the whole filesystem that contains /var/log, and ls -lh lists files without totalling subdirectories.","notes":["df shows usage of the whole filesystem containing /var/log, not just that directory.","Correct: du -sh sums the space used by the whole directory tree in human-readable form.","ls -lh lists entries in one directory and does not total subdirectories."],"ref":"https://man7.org/linux/man-pages/man1/du.1.html","verified":"2026-10"},{"id":"fund-022","topic":"Computing Fundamentals","subtopic":"Linux Basics","difficulty":"easy","q":"Which command shows a continuously refreshing view of running processes with their CPU and memory usage?","options":["ps aux","lsof","top"],"answer":2,"explanation":"top refreshes every few seconds and sorts by CPU by default. ps aux prints a one-time snapshot, and lsof lists open files.","not
