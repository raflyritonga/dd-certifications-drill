<title>Moved</title>

<body>
<p>The drill moved to <a href="../index.html">../index.html</a>.</p>
<script>
// The app moved to the repo root. Some browsers keep saved data per file, so carry this page's
// Fundamentals progress along once; the new page only fills in what it doesn't have yet.
let carry = "";
try {
  const v = localStorage.getItem("ddf-drill-v1");
  if (v !== null) carry = "#import=" + btoa(unescape(encodeURIComponent(JSON.stringify({ "ddf-drill-v1": v }))));
} catch (e) {}
location.replace("../index.html" + carry);
</script>
