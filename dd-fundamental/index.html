t first.","Quoting makes it a literal string match, not a numeric comparison.","Logs are already arriving; the issue is the missing facet, not collection."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-035","topic":"Tagging & Search","subtopic":"Facets & Measures","difficulty":"medium","q":"Which statement about searching log attributes is correct?","options":["A facet must exist before an attribute can be searched at all","Only tags can be searched; attributes are for display only","Attributes can be searched without a facet, but numeric operators and ranges need a facet"],"answer":2,"explanation":"Datadog says you don't need a facet to search attributes and tags. Facets are needed for numeric searches and to filter or group from the facet panel.","notes":["Facets are not required to search attributes; only for numeric operators and ranges.","Attributes can be searched with @, not just displayed.","Correct: attributes are searchable without a facet, but numeric searches need one."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-036","topic":"Tagging & Search","subtopic":"Facets & Measures","difficulty":"medium","q":"An analyst wants to graph the average of the 'response_time_ms' log attribute and filter logs where it is above 2000. How should the attribute be defined?","options":["As a qualitative facet","As a reserved tag","As a measure (quantitative facet)"],"answer":2,"explanation":"Measures are quantitative facets with integer or double values, used for aggregations such as averages or sums and for range filtering. Qualitative facets (dimensions) are for filtering and grouping on discrete values like status or country.","notes":["Qualitative facets (dimensions) filter and group discrete values; they don't aggregate numbers.","Reserved tags are host, service, env and so on; they aren't for numeric attributes.","Correct: measures are quantitative facets used for averages, sums and range filters."],"ref":"https://docs.datadoghq.com/logs/explorer/facets/","verified":"2026-10"},{"id":"viz-037","topic":"Tagging & Search","subtopic":"Live Tail & Patterns","difficulty":"easy","q":"An exclusion filter keeps debug logs out of your index. Where can you still see those debug logs as they arrive?","options":["Log Explorer search over the past 15 minutes","Live Tail","Metrics Explorer"],"answer":1,"explanation":"Live Tail streams both indexed and non-indexed logs in near real time. The Log Explorer search only returns indexed logs.","notes":["The Log Explorer only searches indexed logs, so excluded logs don't appear.","Correct: Live Tail shows both indexed and non-indexed logs in real time.","Metrics Explorer graphs metrics, not individual log events."],"ref":"https://docs.datadoghq.com/logs/explorer/live_tail/","verified":"2026-10"},{"id":"viz-038","topic":"Tagging & Search","subtopic":"Live Tail & Patterns","difficulty":"easy","q":"There are thousands of error logs that differ only in IDs and timestamps. Which Log Explorer feature groups them into a few clusters by message structure?","options":["Live Tail","Saved Views","Patterns"],"answer":2,"explanation":"Patterns clusters logs with similar structure so you can see the few distinct message shapes behind a large volume.","notes":["Live Tail streams logs in real time without clustering them.","Saved Views store a search and layout; they don't cluster logs.","Correct: Patterns groups logs with similar message structure into clusters."],"ref":"https://docs.datadoghq.com/logs/explorer/analytics/patterns/","verified":"2026-10"},{"id":"viz-039","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"medium","q":"A user searches the Log Explorer for \"*timeout*\" (with the double quotes). What happens?","options":["It matches any message containing 'timeout'","It is rejected as a syntax error","It matches the literal string *timeout*, because wildcards don't work inside quotes"],"answer":2,"explanation":"Wildcards don't work inside double quotes, so \"*test*\" searches for the literal characters. Leave out the quotes to use * as a wildcard.","notes":["Inside quotes * is literal, so it doesn't act as a wildcard.","It is valid syntax; it just searches for the literal string.","Correct: wildcards only work outside double quotes."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-040","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"hard","q":"Logs have the attribute @user.name set to 'alice'. Which search will NOT match them?","options":["@user.name:Alice","@user.name:alice","@user.name:ali*"],"answer":0,"explanation":"Attribute searches are case sensitive, so 'Alice' doesn't match 'alice'. A wildcard on the correct case does match; use full-text search for case-insensitive results.","notes":["Correct: attribute searches are case sensitive, so 'Alice' doesn't match 'alice'.","Matches: exact value with the right case.","Matches: a wildcard on the correct case matches 'alice'."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-041","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"easy","q":"In the log query service:web status:error, how are the two terms combined?","options":["OR","AND","The second term only sorts the results"],"answer":1,"explanation":"AND is the default operator between log search terms, so this returns logs from service web that also have status error.","notes":["OR must be written explicitly; it isn't the default.","Correct: AND is the default operator between terms.","Terms filter results; they don't sort them."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-042","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"hard","q":"What is the difference between the log searches 'hello' and '*:hello'?","options":["They are identical","'hello' searches every attribute; '*:hello' searches only the message","'hello' searches the message (and a few error/title fields); '*:hello' searches all log attributes"],"answer":2,"explanation":"Free-text 'hello' searches the message plus @title, @error.message and @error.stack. Full-text '*:hello' searches every log attribute, including the message.","notes":["They differ in which fields are searched.","This reverses the two: free text is narrower than *:hello.","Correct: free text searches message, title and error fields; *:hello searches all attributes."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-043","topic":"Tagging & Search","subtopic":"Metrics Explorer & Summary","difficulty":"easy","q":"Where can you view a metric's metadata (type, unit, description) and its tags, and edit that metadata?","options":["Metrics Summary","Host Map","Live Tail"],"answer":0,"explanation":"Metrics Summary lists the metrics reporting to Datadog. Its side panel shows metadata, tags and cardinality, and the metadata can be edited there.","notes":["Correct: Metrics Summary shows metric metadata and tags and lets you edit most metadata.","Host Map visualizes hosts by metric; it doesn't edit metric metadata.","Live Tail streams logs, not metric metadata."],"ref":"https://docs.datadoghq.com/metrics/summary/","verified":"2026-10"},{"id":"viz-044","topic":"Tagging & Search","subtopic":"Metrics Explorer & Summary","difficulty":"easy","q":"An engineer wants to quickly graph a metric ad hoc, try different scopes and groupings, and then export the graph to a dashboard. Which tool fits?","options":["Metrics Summary","Metrics Explorer","Software Catalog"],"answer":1,"explanation":"Metrics Explorer is for ad-hoc exploration and graphing of metrics, and its graphs can be exported to dashboards or notebooks.","notes":["Metrics Summary lists metrics and metadata; it isn't for ad-hoc graphing.","Correct: Metrics Explorer is for ad-hoc graphing and can export to dashboards or notebooks.","Software Catalog shows services and ownership, not ad-hoc metric graphs."],"ref":"https://docs.datadoghq.com/metrics/explorer/","verified":"2026-10"},{"id":"viz-045","topic":"Tagging & Search","subtopic":"Metrics Explorer & Summary","difficulty":"medium","q":"With Metrics without Limits, where do you configure which tags stay queryable (indexed) for a custom metric?","options":["In the Agent's datadog.yaml with histogram_aggregates","On the Host Map with Group by","In Metrics Summary, using the metric's tag configuration"],"answer":2,"explanation":"Metrics without Limits tag configuration is managed per metric from Metrics Summary. histogram_aggregates controls which histogram aggregations the Agent computes, not tag indexing.","notes":["histogram_aggregates sets which histogram aggregations the Agent computes, not tag indexing.","Host Map Group by arranges hosts; it doesn't configure metric tags.","Correct: Manage Tags for Metrics without Limits is in Metrics Summary."],"ref":"https://docs.datadoghq.com/metrics/summary/","verified":"2026-10"},{"id":"viz-046","topic":"Dashboards & Host Map","subtopic":"Query Processing Order","difficulty":"medium","q":"In what order does Datadog process a metric query to draw a graph?","options":["Scope by tags → time aggregation (rollup) → space aggregation → functions","Space aggregation → scope by tags → time aggregation → functions","Scope by tags → space aggregation → functions → time aggregation"],"answer":0,"explanation":"Sources are first scoped by tags, each source is rolled up in time, the series are then aggregated across space (avg/sum/min/max by), and functions are applied last.","notes":["Correct: scope, then time aggregation, then space aggregation, then functions.","Space aggregation happens after scoping and time aggregation.","Time aggregation comes before space aggregation, and functions run last."],"ref":"https://docs.datadoghq.com/dashboards/guide/query-to-the-graph/","verified":"2026-10"},{"id":"viz-047","topic":"Dashboards & Host Map","subtopic":"Rollup & Points per Graph","difficulty":"hard","q":"A graph displays about 300 points. You graph 4 hours of a metric submitted every second (14,400 raw points). About how many raw points does each displayed point represent?","options":["48","300","240"],"answer":0,"explanation":"14,400 / 300 = 48, so Datadog automatically rolls up about 48 raw points into each displayed point.","notes":["Correct: 14,400 / 300 = 48 raw points per displayed point.","300 is the number of displayed points, not raw points per point.","240 would be 14,400 / 60; the graph shows about 300 points, not 60."],"ref":"https://docs.datadoghq.com/dashboards/querying/","verified":"2026-10"},{"id":"viz-048","topic":"Dashboards & Host Map","subtopic":"Rollup & Points per Graph","difficulty":"easy","q":"When Datadog automatically rolls up points for a graph and no rollup method is specified, which aggregator does it use?","options":["sum","max","avg"],"answer":2,"explanation":"The rollup aggregator defaults to avg. Use .rollup(sum, …) or .as_count() to sum within each time bucket.","notes":["sum is only used if you request it, for example with .rollup(sum) or .as_count().","max is not the default rollup aggregator.","Correct: the default rollup aggregator is avg."],"ref":"https://docs.datadoghq.com/dashboards/functions/rollup/","verified":"2026-10"},{"id":"viz-049","topic":"Dashboards & Host Map","subtopic":"Rollup & Points per Graph","difficulty":"medium","q":"What does appending .rollup(sum, 60) to a metric query do?","options":["Each displayed point is the sum of the values within a 60-second interval","The graph shows a 60-minute moving average","Only the last 60 points are summed into one value"],"answer":0,"explanation":"rollup(<aggregator>, <interval in seconds>) sets the time aggregation, so each point is the sum over a 60-second bucket.","notes":["Correct: rollup(sum, 60) sums values within each 60-second bucket.","The interval is in seconds, and the method is sum, not a moving average.","Rollup buckets by time; it doesn't sum the last N points."],"ref":"https://docs.datadoghq.com/dashboards/functions/rollup/","verified":"2026-10"},{"id":"viz-050","topic":"Dashboards & Host Map","subtopic":"Rollup & Points per Graph","difficulty":"hard","q":"With no explicit rollup, what is the default rollup interval for a line graph over the past week?","options":["1 minute","1 hour","1 day"],"answer":1,"explanation":"Default line-graph intervals are about 20 s for the past hour, 1 hour for the past week and 1 day for the past year, which keeps the number of points readable.","notes":["About 1 minute is too fine; the past hour uses about 20 seconds.","Correct: line graphs over the past week default to 1-hour rollups.","1 day is the default for the past year."],"ref":"https://docs.datadoghq.com/dashboards/functions/rollup/","verified":"2026-10"},{"id":"viz-051","topic":"Dashboards & Host Map","subtopic":"as_count & as_rate","difficulty":"medium","q":"What does .as_count() do when applied to a COUNT metric?","options":["It converts the metric into a gauge","It sets the time aggregator to SUM and disables interpolation","It divides each point by the rollup interval to get a per-second rate"],"answer":1,"explanation":"On COUNT metrics, .as_count() sets time aggregation to SUM and turns off interpolation, so each point is the total count in its bucket. Dividing by the interval is what .as_rate() does.","notes":["as_count() doesn't change the metric type.","Correct: on COUNT metrics it sets time aggregation to SUM and disables interpolation.","Dividing by the interval is what .as_rate() does."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/type_modifiers/","verified":"2026-10"},{"id":"viz-052","topic":"Dashboards & Host Map","subtopic":"as_count & as_rate","difficulty":"hard","q":"A RATE metric reports 0.5 per second, and the graph uses a 20-second rollup. What value does each point show with .as_count()?","options":["0.5","0.025","10"],"answer":2,"explanation":"For RATE metrics, .as_count() sums and then multiplies by the sampling interval: 0.5/s x 20 s = 10. This matches the docs example where 0.05/s becomes 1 per 20-second point.","notes":["0.5 is the raw per-second rate, not the count per bucket.","0.025 divides by the interval instead of multiplying.","Correct: 0.5/s x 20 s = 10 per point."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/type_modifiers/","verified":"2026-10"},{"id":"viz-053","topic":"Dashboards & Host Map","subtopic":"Space Aggregation","difficulty":"medium","q":"Three hosts of service 'api' each report requests per second: 100, 200 and 300. What does sum:app.requests{service:api} by {service} show?","options":["200","300","600"],"answer":2,"explanation":"Space aggregation with sum adds the hosts together: 100 + 200 + 300 = 600. avg by would show 200, and max by would show 300.","notes":["200 is the average across hosts (avg by), not the sum.","300 is the maximum (max by), not the sum.","Correct: sum adds the hosts: 100 + 200 + 300 = 600."],"ref":"https://docs.datadoghq.com/dashboards/querying/","verified":"2026-10"},{"id":"viz-054","topic":"Dashboards & Host Map","subtopic":"Timeshift Functions","difficulty":"medium","q":"On a timeseries graph you want to overlay today's request rate with the same metric's values from exactly one week earlier, to spot unusual behavior. What should you add?","options":["A second query wrapped in a timeshift function such as week_before() (calendar_shift with \"-7d\")","The same query with .rollup(avg, 604800) appended","Nothing extra; set the dashboard time frame to 'Past 1 Week'"],"answer":0,"explanation":"Timeshift functions graph a metric's values from an earlier period alongside the current ones. week_before() shifts by 7 days; Datadog now recommends calendar_shift() with \"-7d\" as its replacement.","notes":["Correct: timeshift functions such as week_before() or calendar_shift(\"-7d\") graph last week's values.","rollup(avg, 604800) averages into one-week buckets; it doesn't overlay last week.","A one-week time frame shows recent values but doesn't overlay the same time last week."],"ref":"https://docs.datadoghq.com/dashboards/functions/timeshift/","verified":"2026-10"},{"id":"viz-055","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"easy","q":"A wallboard should show just the current number of 5xx errors as one big number. Which widget fits?","options":["Timeseries","Query Value","Heatmap"],"answer":1,"explanation":"The Query Value widget displays the current value of a metric query as a single number.","notes":["Timeseries shows values over time, not a single number.","Correct: Query Value shows one aggregated value as a big number.","Heatmap shows the distribution of values over time."],"ref":"https://docs.datadoghq.com/dashboards/widgets/query_value/","verified":"2026-10"},{"id":"viz-056","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"easy","q":"Which widget shows the 10 hosts with the highest CPU usage as a ranked list?","options":["Top List","Pie Chart","Heatmap"],"answer":0,"explanation":"Top List ranks tag values such as host or service by a metric, showing the highest or lowest values.","notes":["Correct: Top List ranks dimensions such as hosts by a metric.","Pie Chart shows proportions of a whole, not a ranked top 10.","Heatmap shows value distribution over time."],"ref":"https://docs.datadoghq.com/dashboards/widgets/top_list/","verified":"2026-10"},{"id":"viz-057","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"medium","q":"You want to see whether hosts with high memory usage also have high CPU, with each host plotted by those two metrics. Which widget should you use?","options":["Change","Heatmap","Scatter Plot"],"answer":2,"explanation":"A Scatter Plot plots a scope against two metrics, one on each axis, showing how they relate across hosts.","notes":["Change shows a metric's change versus an earlier period.","Heatmap shows the distribution of one metric over time.","Correct: Scatter Plot plots a scope against two metrics, one per axis."],"ref":"https://docs.datadoghq.com/dashboards/widgets/scatter_plot/","verified":"2026-10"},{"id":"viz-058","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"medium","q":"Which widget graphs the change in a metric's value compared with an hour, day, week or month earlier, as an absolute or relative (%) change?","options":["Change","Query Value","Top List"],"answer":0,"explanation":"The Change widget compares the current value with the value from a chosen earlier period and shows absolute or percentage change.","notes":["Correct: the Change widget compares now with an hour, day, week or month earlier.","Query Value shows the current aggregated value with no comparison.","Top List ranks dimensions by value."],"ref":"https://docs.datadoghq.com/dashboards/widgets/change/","verified":"2026-10"},{"id":"viz-059","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"medium","q":"You want to see how request latency is spread across hundreds of containers OVER TIME, with darker cells where more values fall. Which widget fits?","options":["Distribution","Heatmap","Top List"],"answer":1,"explanation":"A Heatmap shows the distribution of values over time. The Distribution widget shows a histogram with value on the x-axis instead of time.","notes":["Distribution shows a histogram with value on the x-axis, not time.","Correct: Heatmap shows how values are distributed over time.","Top List ranks dimensions; it doesn't show spread over time."],"ref":"https://docs.datadoghq.com/dashboards/widgets/heatmap/","verified":"2026-10"},{"id":"viz-060","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"hard","q":"Which widget shows a histogram of a metric aggregated across tags such as hosts, with the x-axis being the metric value rather than time?","options":["Heatmap","Timeseries","Distribution"],"answer":2,"explanation":"The Distribution widget shows how values are spread across sources as a histogram; its x-axis is quantity, not time. A Heatmap keeps time on the x-axis.","notes":["Heatmap keeps time on the x-axis.","Timeseries plots values over time.","Correct: the Distribution widget's x-axis is quantity, not time."],"ref":"https://docs.datadoghq.com/dashboards/widgets/distribution/","verified":"2026-10"},{"id":"viz-061","topic":"Dashboards & Host Map","subtopic":"Widget Selection","difficulty":"medium","q":"A team lead wants a dashboard widget listing how many of the team's monitors are in Alert, Warn, No Data and OK. Which widget fits?","options":["Monitor Summary","SLO","Query Value"],"answer":0,"explanation":"The Monitor Summary widget shows a summary of monitors (all or a filtered subset) broken down by status.","notes":["Correct: Monitor Summary shows counts of monitors by status.","The SLO widget shows SLO status and error budget, not monitor status counts.","Query Value shows a single metric value, not monitor statuses."],"ref":"https://docs.datadoghq.com/dashboards/widgets/monitor_summary/","verified":"2026-10"},{"id":"viz-062","topic":"Dashboards & Host Map","subtopic":"Timeboard vs Screenboard","difficulty":"medium","q":"During an incident, an engineer needs a dashboard where every graph shares the same time frame so spikes can be lined up across metrics. Which dashboard layout type fits?","options":["Screenboard","Timeboard","Host Map"],"answer":1,"explanation":"Timeboards use an automatic layout where a single time setting (fixed or real-time) applies to the whole dashboard, which suits troubleshooting and correlation. Screenboards are free-form.","notes":["Screenboards are free-form and suited to status boards, not one shared time frame.","Correct: Timeboards apply one time setting across the whole dashboard.","Host Map visualizes hosts; it isn't a dashboard layout type."],"ref":"https://docs.datadoghq.com/dashboards/","verified":"2026-10"},{"id":"viz-063","topic":"Dashboards & Host Map","subtopic":"Timeboard vs Screenboard","difficulty":"medium","q":"A team wants a free-form status board for an office TV that mixes images, notes, graphs and monitor statuses, with widgets placed anywhere. Which dashboard layout type fits?","options":["Timeboard","Metrics Explorer","Screenboard"],"answer":2,"explanation":"Screenboards are dashboards with free-form layouts that can mix images, graphs, logs and other objects, which suits status boards. Timeboards use an automatic layout.","notes":["Timeboards use an automatic layout with one shared time frame.","Metrics Explorer is for ad-hoc graphing, not a status board.","Correct: Screenboards are free-form layouts that mix images, graphs and other objects."],"ref":"https://docs.datadoghq.com/dashboards/","verified":"2026-10"},{"id":"viz-064","topic":"Dashboards & Host Map","subtopic":"Template Variables","difficulty":"easy","q":"Which dashboard feature lets viewers rescope every graph to a chosen environment from a dropdown, without editing each widget?","options":["Template variables","Widget groups","Saved views"],"answer":0,"explanation":"Template variables add dropdowns that dynamically filter (or group) the widgets whose queries reference them.","notes":["Correct: template variables add dropdowns that filter or group widgets that use them.","Widget groups organize widgets visually; they don't rescope queries.","Saved views belong to explorers like the Log Explorer, not dashboard scoping."],"ref":"https://docs.datadoghq.com/dashboards/template_variables/","verified":"2026-10"},{"id":"viz-065","topic":"Dashboards & Host Map","subtopic":"Template Variables","difficulty":"medium","q":"A dashboard has a template variable named 'env' on the tag key env. How should a widget query reference it?","options":["avg:system.cpu.user{$env} by {host}","avg:system.cpu.user{%%env%%} by {host}","avg:system.cpu.user{{{env}}} by {host}"],"answer":0,"explanation":"Template variables are referenced as $<name> in the query scope. %%var%% is Autodiscovery template syntax, and {{var}} is monitor message syntax.","notes":["Correct: template variables are referenced as $name in the query.","%%var%% is Autodiscovery template syntax.","{{var}} is monitor message template syntax."],"ref":"https://docs.datadoghq.com/dashboards/template_variables/","verified":"2026-10"},{"id":"viz-066","topic":"Dashboards & Host Map","subtopic":"Template Variables","difficulty":"medium","q":"A dashboard's template variable $service is changed to 'billing'. One widget's query is avg:system.cpu.user{env:prod}. What happens to that widget?","options":["It is filtered to service:billing automatically","It shows an error until $service is added","It is unchanged, because its query doesn't reference $service"],"answer":2,"explanation":"Template variables only affect queries that include them. Widgets that don't reference the variable keep their original scope.","notes":["Only widgets whose queries use $service are rescoped.","Widgets don't error when they don't reference a variable.","Correct: the widget's query doesn't use $service, so it is unaffected."],"ref":"https://docs.datadoghq.com/dashboards/template_variables/","verified":"2026-10"},{"id":"viz-067","topic":"Dashboards & Host Map","subtopic":"Integration Dashboards","difficulty":"easy","q":"The Redis integration was just enabled and is reporting metrics. Where does a user find the out-of-the-box Redis dashboard?","options":["In the Dashboard List, where Datadog adds the integration's preset dashboard automatically","In conf.d/redisdb.d/ on the host, as a dashboard.json file to import","Nowhere until a user builds one from the Metrics Explorer"],"answer":0,"explanation":"When you install an integration, Datadog automatically creates its out-of-the-box dashboard, listed under the All Integrations preset list in the Dashboard List.","notes":["Correct: installing an integration automatically adds its out-of-the-box dashboard.","Integration dashboards are not files in conf.d to import.","Users don't need to build it; Datadog creates it automatically."],"ref":"https://docs.datadoghq.com/dashboards/list/","verified":"2026-10"},{"id":"viz-068","topic":"Dashboards & Host Map","subtopic":"Host Map","difficulty":"easy","q":"By default, what does the color of each hexagon in the Host Map represent?","options":["Memory used","CPU utilization","Number of running containers"],"answer":1,"explanation":"Fill by defaults to CPU usage. You can change it to another metric or signal.","notes":["Memory is a selectable Fill by metric, not the default.","Correct: Fill by defaults to CPU usage.","Container count is not the default Host Map color."],"ref":"https://docs.datadoghq.com/infrastructure/hostmap/","verified":"2026-10"},{"id":"viz-069","topic":"Dashboards & Host Map","subtopic":"Host Map","difficulty":"medium","q":"On the Host Map you want hosts clustered first by availability zone and then by instance type. What should you use?","options":["Group by with two tags: availability-zone, then instance-type","Filter by availability-zone AND instance-type","Size by availability-zone"],"answer":0,"explanation":"Group by arranges hosts into clusters and supports multiple groupings, for example availability zone then instance type. Filter only limits which hosts are shown.","notes":["Correct: Group by supports multiple tags, nesting zone then instance type.","Filter limits which hosts are shown; it doesn't cluster them.","Size by sets hexagon size from a metric, not grouping."],"ref":"https://docs.datadoghq.com/infrastructure/hostmap/","verified":"2026-10"},{"id":"viz-070","topic":"Dashboards & Host Map","subtopic":"Host Map","difficulty":"easy","q":"On the Host Map you want to see only production hosts. Which control should you use?","options":["Group by env","Filter by env:prod","Fill by env"],"answer":1,"explanation":"Filter limits the map to a subset of hosts (with AND, OR, NOT and wildcards). Group by only rearranges hosts and still shows all of them.","notes":["Group by rearranges hosts but still shows all of them.","Correct: Filter limits the map to matching hosts.","Fill by sets color from a metric; it doesn't hide hosts."],"ref":"https://docs.datadoghq.com/infrastructure/hostmap/","verified":"2026-10"},{"id":"viz-071","topic":"Dashboards & Host Map","subtopic":"Host Map","difficulty":"hard","q":"A Host Map is set to Filter by env:prod, Group by role, Fill by system.load.norm.1, Size by system.mem.used. Two hexagons in the 'db' group are the same color but one is much larger. What can you conclude?","options":["The larger host has higher normalized load","Both hosts have similar normalized load, and the larger one uses more memory","The larger host has more CPU cores"],"answer":1,"explanation":"Color comes from Fill by (normalized load), so matching colors mean similar load. Size comes from Size by (memory used), so the larger host uses more RAM.","notes":["Same color means similar load; size reflects memory, not load.","Correct: color comes from Fill by (load) and size from Size by (memory used).","Hexagon size here is memory used, not CPU core count."],"ref":"https://docs.datadoghq.com/infrastructure/hostmap/","verified":"2026-10"},{"id":"viz-072","topic":"Dashboards & Host Map","subtopic":"Host List","difficulty":"medium","q":"By default, which hosts does the Host List (Infrastructure > Hosts, formerly called the Infrastructure List) show?","options":["Hosts with activity in the last 15 minutes","Hosts with activity in the last 2 hours","Every host that has ever reported"],"answer":0,"explanation":"The Host List shows hosts with activity in the last 15 minutes by default.","notes":["Correct: the Host List shows hosts active in the last 15 minutes by default.","2 hours is not the Host List default.","Hosts that stopped reporting long ago are not shown by default."],"ref":"https://docs.datadoghq.com/infrastructure/list/","verified":"2026-10"},{"id":"viz-073","topic":"Dashboards & Host Map","subtopic":"Host List","difficulty":"medium","q":"An EC2 host is known as i-0abc123, ip-10-0-1-5 and db1.example.com. How does Datadog show this in the Host List?","options":["As three separate hosts, each billed separately","As the instance ID only; the other names are discarded","As one canonical hostname, with the other names listed as host aliases"],"answer":2,"explanation":"When a host has several uniquely identifiable names, Datadog picks one canonical hostname and keeps the others as aliases, shown in the host's detail panel.","notes":["One host with several names is one host, not three billed hosts.","The other names are kept as aliases, not discarded.","Correct: Datadog picks one canonical hostname and lists the others as aliases."],"ref":"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/","verified":"2026-10"},{"id":"viz-074","topic":"Dashboards & Host Map","subtopic":"Software Catalog","difficulty":"easy","q":"Which Datadog feature provides a centralized, consolidated view of all discovered services along with their ownership and related telemetry?","options":["Host Map","Metrics Summary","Software Catalog"],"answer":2,"explanation":"The Software Catalog (titled Catalog in the docs, under the Internal Developer Portal) gives a centralized view of services and other entities detected from telemetry, with ownership and observability context.","notes":["Host Map visualizes hosts by metric, not services and ownership.","Metrics Summary lists metrics and their metadata.","Correct: the Software Catalog is the centralized view of discovered services and ownership."],"ref":"https://docs.datadoghq.com/software_catalog/","verified":"2026-10"},{"id":"viz-075","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"easy","q":"What does system.cpu.system measure?","options":["Percent of time the CPU spent running user-space processes","Percent of time the CPU spent waiting for I/O to complete","Percent of time the CPU spent running the kernel"],"answer":2,"explanation":"system.cpu.system is time spent in the kernel. User-space processes are system.cpu.user.","notes":["That is system.cpu.user.","That is system.cpu.iowait.","Correct: system.cpu.system is time spent running the kernel."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"viz-076","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"medium","q":"On a cloud VM, system.cpu.stolen is consistently high. What is the most likely cause?","options":["The application is blocked waiting on disk reads","The hypervisor is serving other virtual CPUs, so this VM waits for physical CPU time","The kernel is handling many system calls"],"answer":1,"explanation":"Stolen CPU is the time the virtual CPU waited for the hypervisor to service another virtual CPU, often from noisy neighbors. Disk waits show up as iowait.","notes":["Disk waits show up as system.cpu.iowait, not stolen time.","Correct: stolen time is the vCPU waiting for the hypervisor to serve other vCPUs.","Kernel time from system calls is system.cpu.system."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"viz-077","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"medium","q":"A database host shows high system.cpu.iowait while user and system CPU are low. What does this indicate?","options":["The CPU is mostly waiting for I/O operations, such as disk, to complete","The host is out of swap space","Network packets are being dropped"],"answer":0,"explanation":"iowait is the time the CPU spent waiting for I/O operations to complete, which points to a storage bottleneck rather than compute load.","notes":["Correct: iowait is CPU time spent waiting for I/O to complete.","Swap exhaustion shows in system.swap metrics, not iowait.","Dropped packets show in network metrics, not iowait."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"viz-078","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"medium","q":"You want a threshold for disks that are 90% full using system.disk.in_use. What threshold value should you set?","options":["90","0.9","900"],"answer":1,"explanation":"system.disk.in_use reports used space as a fraction of the total (0–1), so 90% is 0.9.","notes":["90 would never trigger; the metric is a fraction between 0 and 1.","Correct: system.disk.in_use is a fraction, so 90% is 0.9.","900 is not a meaningful value for a fraction."],"ref":"https://docs.datadoghq.com/integrations/disk/","verified":"2026-10"},{"id":"viz-079","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"hard","q":"A 4-core Linux host reports system.load.1 = 8. What would system.load.norm.1 be, and what does it suggest?","options":["8; the host is lightly loaded","0.5; the host is half used","2; there are about twice as many runnable/waiting processes as cores"],"answer":2,"explanation":"system.load.norm.1 is the 1-minute load divided by the number of CPUs: 8 / 4 = 2. Above 1 means more processes are running or waiting than there are cores.","notes":["8 is the raw load, not the normalized value.","0.5 would be 4 / 8; normalization divides load by CPU count.","Correct: 8 / 4 cores = 2, meaning twice as many runnable processes as cores."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"viz-080","topic":"Dashboards & Host Map","subtopic":"System Metrics","difficulty":"easy","q":"system.mem.usable is low and system.swap.used is climbing steadily. What is the most likely situation?","options":["The host doesn't have enough RAM and is paging to disk","The disk is almost full","CPU steal time is high"],"answer":0,"explanation":"Swap is disk used as memory once RAM fills up. Low usable memory plus rising swap means RAM is insufficient, which slows the host.","notes":["Correct: low usable memory and rising swap mean RAM is insufficient.","Disk fullness shows in system.disk.in_use, not swap.","CPU steal is a hypervisor scheduling issue, unrelated to swap."],"ref":"https://docs.datadoghq.com/integrations/system/","verified":"2026-10"},{"id":"viz-081","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"easy","q":"You want to be notified when the Datadog Agent on any production host stops reporting. Which monitor type should you create?","options":["Host monitor","Log monitor","Process Check monitor"],"answer":0,"explanation":"A Host monitor checks whether the Agent is still reporting its datadog.agent.up heartbeat, and alerts when a host stops reporting.","notes":["Correct: a Host monitor alerts when a host stops reporting.","Log monitors count logs; they don't track Agent reporting.","Process Check monitors watch process.up for specific processes."],"ref":"https://docs.datadoghq.com/monitors/types/host/","verified":"2026-10"},{"id":"viz-082","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"Which heartbeat does a Host monitor use to decide whether a host is still reporting?","options":["system.uptime","process.up","datadog.agent.up"],"answer":2,"explanation":"Every Agent reports the datadog.agent.up heartbeat, which the Host monitor watches. process.up belongs to the process check.","notes":["system.uptime is a system metric, not the Host monitor's check.","process.up comes from the Agent's process check.","Correct: every Agent reports the datadog.agent.up service check."],"ref":"https://docs.datadoghq.com/monitors/types/host/","verified":"2026-10"},{"id":"viz-083","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"The Agent's process check (conf.d/process.d) is configured for nginx and reports the process.up service check. Which monitor type alerts on that status?","options":["Live Process monitor","Process Check monitor","Network monitor"],"answer":1,"explanation":"Process Check monitors watch the process.up service check from the Agent's process check. Live Process monitors use Process Agent data instead.","notes":["Live Process monitors use Live Processes data, not process.up.","Correct: Process Check monitors watch the process.up service check.","Network monitors cover TCP and HTTP checks."],"ref":"https://docs.datadoghq.com/monitors/types/process_check/","verified":"2026-10"},{"id":"viz-084","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"Without setting up any Agent check, you want an alert when fewer than 2 processes matching 'java' are running across hosts tagged role:worker, using Live Processes data. Which monitor type fits?","options":["Live Process monitor","Process Check monitor","Host monitor"],"answer":0,"explanation":"Live Process monitors are based on Live Processes data and alert on the count of matching processes across hosts or tags. Process Check monitors need the Agent's process.up check configured.","notes":["Correct: Live Process monitors count processes across hosts or tags using Live Processes data.","Process Check monitors need the Agent process check configured.","Host monitors check whether hosts report, not process counts."],"ref":"https://docs.datadoghq.com/monitors/types/process/","verified":"2026-10"},{"id":"viz-085","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"The Agent's HTTP check probes https://shop.example.com/health. Which monitor type alerts when the endpoint can't be reached?","options":["Forecast monitor","Network monitor","Event monitor"],"answer":1,"explanation":"Network monitors cover the TCP and HTTP checks available in the Agent, so they alert when the HTTP check can't reach the endpoint.","notes":["Forecast monitors predict where a metric is heading.","Correct: Network monitors cover the Agent's TCP and HTTP checks.","Event monitors alert on events, not HTTP check status."],"ref":"https://docs.datadoghq.com/monitors/types/network/","verified":"2026-10"},{"id":"viz-086","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"Checkout traffic follows strong daily and weekly cycles. You want an alert when traffic is unusual for that time of day, not when it crosses a fixed number. Which monitor type fits?","options":["Outlier monitor","Forecast monitor","Anomaly monitor"],"answer":2,"explanation":"Anomaly detection compares a metric with its own history, accounting for trends and daily or weekly seasonality.","notes":["Outlier monitors compare group members with their peers.","Forecast monitors predict future values against a threshold.","Correct: Anomaly monitors account for trends and daily or weekly seasonality."],"ref":"https://docs.datadoghq.com/monitors/types/anomaly/","verified":"2026-10"},{"id":"viz-087","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"Twelve web servers behind a load balancer should behave the same. You want an alert when one of them starts behaving differently from the others. Which monitor type fits?","options":["Outlier monitor","Anomaly monitor","Composite monitor"],"answer":0,"explanation":"Outlier monitors detect when a member of a group, such as one web server in a pool, behaves differently from its peers. Anomaly monitors compare a metric with its own history.","notes":["Correct: Outlier monitors flag a group member behaving differently from its peers.","Anomaly monitors compare a metric with its own history, not its peers.","Composite monitors combine existing monitors with logic."],"ref":"https://docs.datadoghq.com/monitors/types/outlier/","verified":"2026-10"},{"id":"viz-088","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"easy","q":"You want a warning about a week before a database volume is expected to fill up, based on its current trend. Which monitor type fits?","options":["Change alert","Forecast monitor","Outlier monitor"],"answer":1,"explanation":"Forecast monitors predict where a metric is heading and alert before it is expected to cross a threshold, as with disk usage.","notes":["Change alerts compare with a past value; they don't predict.","Correct: Forecast monitors can alert, for example, a week before a disk fills.","Outlier monitors compare group members with peers."],"ref":"https://docs.datadoghq.com/monitors/types/forecasts/","verified":"2026-10"},{"id":"viz-089","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"You want to be paged only when BOTH the 'high CPU' monitor and the 'high error rate' monitor are alerting at the same time. Which monitor type fits?","options":["Multi alert metric monitor","Outlier monitor","Composite monitor"],"answer":2,"explanation":"Composite monitors combine existing monitors with logical operators such as && (AND), || (OR) and ! (NOT).","notes":["Multi alert splits one monitor by group; it doesn't combine monitors.","Outlier monitors compare group members.","Correct: Composite monitors combine monitors with &&, || and !."],"ref":"https://docs.datadoghq.com/monitors/types/composite/","verified":"2026-10"},{"id":"viz-090","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"hard","q":"A composite monitor uses the expression a && !b, where a = 'API latency high' and b = 'Scheduled batch job running'. When does it trigger?","options":["When either monitor is alerting","When latency is high AND the batch job monitor is NOT alerting","Only when both monitors are alerting"],"answer":1,"explanation":"&& is AND and ! negates, so the composite triggers when a alerts and b doesn't, suppressing latency alerts caused by the batch job.","notes":["Either-monitor behavior would be a || b.","Correct: a && !b triggers when a alerts and b does not.","Both alerting would be a && b; !b requires b NOT to alert."],"ref":"https://docs.datadoghq.com/monitors/types/composite/","verified":"2026-10"},{"id":"viz-091","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"easy","q":"You want an alert when more than 100 logs with status:error from service:payments are received in 5 minutes. Which monitor type fits?","options":["Log monitor","Metric monitor on system.cpu.user","Process Check monitor"],"answer":0,"explanation":"Log monitors alert when the count of logs matching a search query crosses a threshold within the evaluation window.","notes":["Correct: Log monitors alert when matching log counts cross a threshold.","A CPU metric monitor doesn't count error logs.","Process Check monitors watch process.up."],"ref":"https://docs.datadoghq.com/monitors/types/log/","verified":"2026-10"},{"id":"viz-092","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"A custom Agent check submits a service check with status OK, WARNING or CRITICAL. Which monitor type alerts on that status?","options":["Event monitor","Forecast monitor","Service Check monitor"],"answer":2,"explanation":"Service Check monitors evaluate the status of any service check submitted to Datadog, including those from custom Agent checks.","notes":["Event monitors alert on events, not service check status.","Forecast monitors predict metric values.","Correct: Service Check monitors cover custom checks sent by the Agent, DogStatsD or API."],"ref":"https://docs.datadoghq.com/monitors/types/service_check/","verified":"2026-10"},{"id":"viz-093","topic":"Monitors & Alerts","subtopic":"Monitor Types","difficulty":"medium","q":"You want an alert when a queue length metric increases by more than 50% compared with its value one hour earlier, whatever the absolute value. Which option fits?","options":["Outlier monitor","Metric monitor using Change alert detection","Forecast monitor"],"answer":1,"explanation":"A metric monitor with Change detection compares the current value with a past value and can use absolute or percentage change.","notes":["Outlier monitors compare peers, not a value with its own past.","Correct: Change detection compares now with N minutes ago, as absolute or percentage.","Forecast monitors predict future values."],"ref":"https://docs.datadoghq.com/monitors/types/metric/","verified":"2026-10"},{"id":"viz-094","topic":"Monitors & Alerts","subtopic":"Simple vs Multi Alert","difficulty":"easy","q":"A multi alert monitor uses avg:system.cpu.user{env:prod} by {host} with a threshold of 90. Of 20 hosts, 3 go above 90. How many alerts are triggered?","options":["1","3","20"],"answer":1,"explanation":"Multi alert triggers separate notifications for each group (here, each host) that crosses the threshold, so there are 3 alerts.","notes":["One alert would be simple alert behavior.","Correct: multi alert notifies separately for each host above the threshold.","Only hosts crossing the threshold alert, not all 20."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-095","topic":"Monitors & Alerts","subtopic":"Simple vs Multi Alert","difficulty":"medium","q":"A metric monitor's query has no 'by' grouping. Which alert mode does it use?","options":["Simple alert","Multi alert by host","Composite alert"],"answer":0,"explanation":"If the query has no grouping, it defaults to Simple Alert: one alert based on the value aggregated across all reporting sources.","notes":["Correct: a query with no grouping defaults to Simple Alert.","Multi alert needs a 'by' grouping in the query.","Composite is a separate monitor type, not an alert mode."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-096","topic":"Monitors & Alerts","subtopic":"Simple vs Multi Alert","difficulty":"hard","q":"A simple alert monitor on avg:system.cpu.user{role:web} (alert above 80) covers 4 hosts at 95, 20, 20 and 25. What is the monitor's state?","options":["Alert, because one host is above 80","Warn, because one of four hosts is high","OK, because the aggregated average (40) is below 80"],"answer":2,"explanation":"A simple alert aggregates over all sources before comparing: (95+20+20+25)/4 = 40, which is below 80. Use multi alert by host to catch the single hot host.","notes":["Simple alert compares the aggregated value, not each host.","There is no warning threshold, and the average is below 80.","Correct: (95+20+20+25)/4 = 40, below the 80 threshold."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-097","topic":"Monitors & Alerts","subtopic":"Thresholds & Evaluation","difficulty":"medium","q":"A monitor has an alert threshold of 90 and a warning threshold of 80 (above). The evaluated value is 85. What is the monitor's state?","options":["OK","Warn","Alert"],"answer":1,"explanation":"85 is above the warning threshold (80) but below the alert threshold (90), so the monitor is in Warn.","notes":["85 is above the 80 warning threshold, so it is not OK.","Correct: 85 is between the warning (80) and alert (90) thresholds.","85 is below the 90 alert threshold."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-098","topic":"Monitors & Alerts","subtopic":"Thresholds & Evaluation","difficulty":"hard","q":"A monitor alerts above 90 and has an alert recovery threshold of 70. It is in Alert at 95, then the value drops to 80. What happens?","options":["It stays in Alert until the value goes below the 70 recovery threshold","It recovers to OK because 80 is below 90","It changes to No Data"],"answer":0,"explanation":"A recovery threshold adds a condition for recovering, so the monitor stays in Alert until the value crosses 70. Without it, the monitor would recover as soon as the value fell below 90.","notes":["Correct: with a recovery threshold, the monitor stays in Alert until below 70.","That would be true without a recovery threshold.","No Data is for missing data; the metric is still reporting."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-099","topic":"Monitors & Alerts","subtopic":"Thresholds & Evaluation","difficulty":"hard","q":"You want a metric monitor to alert only if EVERY point in the 10-minute evaluation window is above the threshold. Which aggregation should you choose?","options":["max (at least once)","avg (on average)","min (at all times)"],"answer":2,"explanation":"With min, the alert fires only when all points in the window cross the threshold. With max, a single point crossing is enough.","notes":["max alerts if any single point crosses the threshold.","avg alerts on the window's average.","Correct: min alerts only if all points in the window cross the threshold."],"ref":"https://docs.datadoghq.com/monitors/types/metric/","verified":"2026-10"},{"id":"viz-100","topic":"Monitors & Alerts","subtopic":"Thresholds & Evaluation","difficulty":"easy","q":"In a monitor condition such as 'avg of the query over the last 5 minutes is above 80', what does 'the last 5 minutes' set?","options":["The evaluation window: the time range of data checked against the threshold","How long notifications are muted after an alert","How often the Agent sends the metric"],"answer":0,"explanation":"The evaluation window sets how much data is aggregated and compared to the threshold each time the monitor runs.","notes":["Correct: the evaluation window is the time range checked against the threshold.","Muting notifications is done with downtimes, not the evaluation window.","The Agent's reporting interval is unrelated to the evaluation window."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-101","topic":"Monitors & Alerts","subtopic":"Monitor States","difficulty":"easy","q":"Which of the following is NOT a standard Datadog monitor status?","options":["No Data","Degraded","Warn"],"answer":1,"explanation":"The main monitor statuses are OK, Warn, Alert and No Data. 'Degraded' isn't a monitor status.","notes":["No Data is a monitor status.","Correct: Degraded is not a monitor status.","Warn is a monitor status."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-102","topic":"Monitors & Alerts","subtopic":"No Data","difficulty":"easy","q":"A metric is expected to report continuously. You want a notification if it stops arriving. Which 'If data is missing' option should you choose?","options":["Show NO DATA","Show NO DATA and notify","Show OK"],"answer":1,"explanation":"Show NO DATA and notify sets the monitor to NO DATA and sends a notification when data stops. Show NO DATA changes the status without notifying, and Show OK treats missing data as healthy.","notes":["Show NO DATA changes the status but doesn't send a notification.","Correct: Show NO DATA and notify sets NO DATA and sends a notification.","Show OK treats missing data as healthy, so nobody is notified."],"ref":"https://docs.datadoghq.com/monitors/configuration/","verified":"2026-10"},{"id":"viz-103","topic":"Monitors & Alerts","subtopic":"Sparse Metrics","difficulty":"hard","q":"A metric 'disk.controller.errors' is only submitted in the minutes right before a disk controller fails; otherwise nothing is reported. How should a metric monitor on it be configured?","options":["Alert when the max (at least once) over the window is above the threshold, and do NOT notify on missing data","Alert when the min (at all times) over the window is above the threshold, and do NOT notify on missing data","Alert when the max (at least once) over the window is above the threshold, and notify on missing data"],"answer":0,"explanation":"With max, a single point crossing the threshold triggers the alert, which suits a metric that appears only briefly. Missing data is the normal healthy state here, so notifying on it would page constantly.","notes":["Correct: max fires on one point, and missing data is the normal healthy state.","min needs every point above threshold, which a brief sparse metric rarely gives.","Max is right, but notifying on missing data would page constantly."],"ref":"https://docs.datadoghq.com/monitors/guide/monitoring-sparse-metrics/","verified":"2026-10"},{"id":"viz-104","topic":"Monitors & Alerts","subtopic":"Renotification","difficulty":"medium","q":"A P1 monitor should keep notifying every 30 minutes while unresolved, and escalations should include '@pagerduty-oncall-manager'. Which setup does this?","options":["Enable renotify every 30 minutes and put the manager handle inside {{#is_renotify}} … {{/is_renotify}}","Set the evaluation window to 30 minutes and add the handle outside any block","Create a downtime that repeats every 30 minutes"],"answer":0,"explanation":"Renotify re-sends the notification while the monitor stays in alert. {{#is_renotify}} limits the escalation handle to those re-notifications.","notes":["Correct: renotify plus an {{#is_renotify}} block sends escalations every 30 minutes.","The evaluation window doesn't control renotification.","Downtimes silence notifications; they don't escalate."],"ref":"https://docs.datadoghq.com/monitors/notify/","verified":"2026-10"},{"id":"viz-105","topic":"Monitors & Alerts","subtopic":"Renotification","difficulty":"hard","q":"In this message, when is '@slack-ops-alerts' notified?\n{{^is_renotify}}\nNew incident @slack-ops-alerts\n{{/is_renotify}}","options":["Only on renotifications","On every notification, including renotifications","Only on the first notification, not on renotifications"],"answer":2,"explanation":"^ inverts the condition, so the block shows only when the event is NOT a renotification, which is the first notification.","notes":["The ^ inverts the block, so it is skipped on renotifications.","The block is skipped when is_renotify is true.","Correct: {{^is_renotify}} shows only on the first notification."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-106","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"easy","q":"Given this monitor message, when is 'CPU critical on {{host.name}}' sent?\n{{#is_alert}}\nCPU critical on {{host.name}} @slack-ops\n{{/is_alert}}","options":["Only when the monitor goes into Alert","On every state change, including recovery","Only when the monitor recovers"],"answer":0,"explanation":"Text and handles inside {{#is_alert}} … {{/is_alert}} are sent only when the monitor transitions to Alert.","notes":["Correct: {{#is_alert}} content is sent only on transitions to Alert.","Recovery would need {{#is_recovery}} or text outside blocks.","Recovery-only text uses {{#is_recovery}}."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-107","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"easy","q":"Which conditional variable should wrap text sent only when the monitor goes into the WARN state?","options":["{{#is_alert}}","{{#is_warning}}","{{#is_recovery}}"],"answer":1,"explanation":"{{#is_warning}} … {{/is_warning}} shows its content only when the monitor warns.","notes":["{{#is_alert}} is for the Alert state.","Correct: {{#is_warning}} shows only when the monitor warns.","{{#is_recovery}} is for recoveries."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-108","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"medium","q":"When is the text inside {{^is_alert}} … {{/is_alert}} included in a notification?","options":["Only when the monitor alerts","Never; ^ comments out the block","Whenever the monitor is NOT alerting, for example on warning or recovery"],"answer":2,"explanation":"Using ^ instead of # creates an inverted block that shows when the condition is false, in this case any notification that isn't an alert.","notes":["Alert-only text uses {{#is_alert}}.","^ inverts the condition; it doesn't comment out the block.","Correct: {{^is_alert}} shows whenever the monitor is not alerting."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-109","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"medium","q":"In a metric monitor message, what does {{value}} display?","options":["The value that breached the alert threshold","The configured alert threshold","The number of hosts in the monitor scope"],"answer":0,"explanation":"{{value}} is the value that breached the threshold. The configured thresholds are {{threshold}} and {{warn_threshold}}.","notes":["Correct: {{value}} is the value that breached the threshold.","The alert threshold is {{threshold}}.","No standard variable gives host count here; {{value}} is the metric value."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-110","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"medium","q":"A message reads: 'Disk at {{value}} (warning level: ___)'. Which variable fills the blank with the configured warning threshold?","options":["{{threshold}}","{{warn_threshold}}","{{ok_threshold}}"],"answer":1,"explanation":"{{warn_threshold}} is the warning threshold and {{threshold}} is the alert threshold. {{ok_threshold}} applies to Service Check monitor recovery.","notes":["{{threshold}} is the alert threshold.","Correct: {{warn_threshold}} is the warning threshold.","{{ok_threshold}} is the value that recovered a Service Check monitor."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-111","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"hard","q":"A monitor on avg:system.cpu.user{env:prod} (no grouping) has the message 'High CPU on {{host.name}}', but notifications show no host name. Why?","options":["{{host.name}} only works in Log monitors","Tag variables must be written as {{$host.name}}","{{host.name}} is only available when the monitor is grouped by host (multi alert)"],"answer":2,"explanation":"{{host.name}} is a tag variable that only gets a value when the monitor is grouped by host. A simple alert aggregates all hosts, so there is no single host to name.","notes":["{{host.name}} works in any monitor grouped by host, not only Log monitors.","Tag variables don't use a $ prefix in monitor messages.","Correct: host tag variables only have values when the monitor is grouped by host."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-112","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"medium","q":"You want the on-call PagerDuty service paged ONLY when a monitor recovers from ALERT to OK, not when it recovers from WARNING. Which block fits?","options":["{{#is_recovery}}","{{#is_alert_recovery}}","{{#is_warning_recovery}}"],"answer":1,"explanation":"{{#is_alert_recovery}} covers only ALERT → OK. {{#is_recovery}} also fires on recovery from WARNING, UNKNOWN or NO DATA.","notes":["{{#is_recovery}} also fires on recovery from WARNING, UNKNOWN or NO DATA.","Correct: {{#is_alert_recovery}} covers only ALERT to OK.","{{#is_warning_recovery}} covers only WARNING to OK."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-113","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"hard","q":"Who is notified when this monitor RECOVERS?\n{{#is_alert}}Disk almost full @pagerduty-ops{{/is_alert}}\n{{#is_warning}}Disk filling up @slack-ops-alerts{{/is_warning}}\n@ops-team@example.com","options":["@pagerduty-ops and @ops-team@example.com","Only @ops-team@example.com","@slack-ops-alerts and @ops-team@example.com"],"answer":1,"explanation":"Handles outside conditional blocks are notified on every state transition, including recovery. Handles inside {{#is_alert}} or {{#is_warning}} are notified only for those states.","notes":["@pagerduty-ops is inside {{#is_alert}}, so it isn't notified on recovery.","Correct: only handles outside conditional blocks are notified on recovery.","@slack-ops-alerts is inside {{#is_warning}}, so it isn't notified on recovery."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-114","topic":"Monitors & Alerts","subtopic":"Message Template Variables","difficulty":"hard","q":"A multi alert monitor is grouped by env, which has the values prod and preprod. You want a block that shows ONLY for env 'prod'. Which conditional is correct?","options":["{{#is_match \"env\" \"prod\"}}","{{#is_exact_match \"env\" \"prod\"}}","{{#is_alert \"env\" \"prod\"}}"],"answer":1,"explanation":"is_match checks for a substring, so 'prod' would also match 'preprod'. is_exact_match needs the whole value to match.","notes":["is_match is a substring check, so 'prod' also matches 'preprod'.","Correct: is_exact_match requires the whole value to equal 'prod'.","is_alert doesn't take tag and value arguments."],"ref":"https://docs.datadoghq.com/monitors/notify/variables/","verified":"2026-10"},{"id":"viz-115","topic":"Monitors & Alerts","subtopic":"Notification Handles","difficulty":"easy","q":"Which handle in a monitor message notifies the Slack channel 'ops-alerts' (with the Slack integration configured)?","options":["#slack-ops-alerts","slack:ops-alerts","@slack-ops-alerts"],"answer":2,"explanation":"Notifications are sent with @-handles, and Slack uses @slack-<channel> (or @slack-<account>-<channel>).","notes":["# is not the notification prefix.","slack:ops-alerts is not a notification handle format.","Correct: Slack channels are notified with @slack-<channel>."],"ref":"https://docs.datadoghq.com/monitors/notify/","verified":"2026-10"},{"id":"viz-116","topic":"Monitors & Alerts","subtopic":"Notification Handles","difficulty":"medium","q":"A team has configured a webhook named 'deploy-bot' in the Webhooks integration. How do they send monitor notifications to it?","options":["Add webhook: deploy-bot to datadog.yaml","Use @webhook-deploy-bot in the monitor message","Use {{#webhook}}deploy-bot{{/webhook}} in the message"],"answer":1,"explanation":"Webhooks are notified with @webhook-<name> in the monitor message, the same @-handle pattern as email, Slack and PagerDuty.","notes":["Webhooks aren't configured as notification targets in datadog.yaml.","Correct: webhooks are notified with @webhook-<name>.","{{#webhook}} is not a valid conditional block."],"ref":"https://docs.datadoghq.com/monitors/notify/","verified":"2026-10"},{"id":"viz-117","topic":"Monitors & Alerts","subtopic":"Downtimes","difficulty":"easy","q":"Database servers will be patched tonight from 01:00 to 03:00, and their monitors shouldn't page anyone. What is the recommended approach?","options":["Delete the monitors and recreate them after the patch","Schedule a downtime for the affected monitors/scope","Raise all thresholds temporarily"],"answer":1,"explanation":"Downtimes silence notifications during planned maintenance without changing or deleting the monitors.","notes":["Deleting monitors loses configuration and history.","Correct: downtimes silence notifications during planned maintenance.","Raising thresholds is error-prone and can hide real problems."],"ref":"https://docs.datadoghq.com/monitors/downtimes/","verified":"2026-10"},{"id":"viz-118","topic":"Monitors & Alerts","subtopic":"Downtimes","difficulty":"medium","q":"What happens to monitors covered by an active downtime?","options":["They keep evaluating and can change state, but notifications are silenced","They stop evaluating entirely until the downtime ends","They are automatically resolved to OK"],"answer":0,"explanation":"Downtimes silence alerts and notifications but don't prevent state transitions, so the monitor keeps evaluating.","notes":["Correct: monitors keep evaluating and changing state, but notifications are silenced.","Downtimes don't stop evaluation.","Downtimes don't resolve monitors to OK."],"ref":"https://docs.datadoghq.com/monitors/downtimes/","verified":"2026-10"},{"id":"viz-119","topic":"Monitors & Alerts","subtopic":"Downtimes","difficulty":"hard","q":"A downtime expires at its scheduled end while a covered monitor is still in ALERT. With default settings, what happens?","options":["Nothing; alerts that started during a downtime are discarded","The monitor is forced back to OK","A new notification is sent, because the monitor is still in an alert-worthy state"],"answer":2,"explanation":"By default, if a monitor is in ALERT, WARNING or NO DATA when a downtime expires, Datadog sends a new notification. A manually cancelled downtime doesn't send one.","notes":["Alert-worthy states are not discarded when a downtime expires.","Downtimes don't force monitors back to OK.","Correct: by default a new notification is sent if the monitor is still alert-worthy."],"ref":"https://docs.datadoghq.com/monitors/downtimes/","verified":"2026-10"},{"id":"viz-120","topic":"Monitors & Alerts","subtopic":"Monitor Priority","difficulty":"easy","q":"What is the range of priority values you can set on a Datadog monitor?","options":["P0 (highest) to P3","Sev1 to Sev4","P1 (highest) to P5 (lowest)"],"answer":2,"explanation":"Monitor priority runs from P1 (highest) to P5 (lowest). It can be used in messages with {{#is_priority 'P1'}} and overridden with {{override_priority 'Pi'}}.","notes":["Datadog monitor priority has no P0; it starts at P1.","Sev1 to Sev4 resembles incident severity, not monitor priority.","Correct: monitor priority ranges from P1 (highest) to P5 (lowest)."],"ref":"https://docs.datadoghq.com/monitors/notify/","verified":"2026-10"}],"packages":[["agent-043","net-024","viz-003","data-060","viz-005","allot-039","viz-002","data-019","agent-011","fund-019","allot-006","agent-021","viz-048","agent-053","data-067","fund-030","allot-025","net-022","viz-100","fund-023","net-028","net-054","allot-054","viz-092","data-056"],["allot-036","viz-026","agent-012","data-004","viz-108","net-045","agent-064","agent-061","allot-00
