ogStatsD accepts events (`_e{...}`) and service checks (`_sc|...`) in addition to metrics. Traces go to the trace receiver on 8126, and logs use the logs pipeline.","notes":["Wrong: traces go to the trace receiver on 8126 and logs use the logs pipeline.","Correct: DogStatsD also accepts events (`_e`) and service checks (`_sc`).","Wrong: profiles go through the trace Agent and RUM is collected by browser/mobile SDKs."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/","verified":"2026-10"},{"id":"data-017","topic":"Data Collection & Integrations","subtopic":"DogStatsD","difficulty":"hard","q":"An application sends this DogStatsD datagram:\n\n_sc|app.can_connect|2|#env:prod\n\nWhat status does the service check report?","options":["WARNING","CRITICAL","UNKNOWN"],"answer":1,"explanation":"Service check status integers are 0 = OK, 1 = WARNING, 2 = CRITICAL, 3 = UNKNOWN, so `2` is CRITICAL.","notes":["Wrong: WARNING is status 1.","Correct: status 2 means CRITICAL.","Wrong: UNKNOWN is status 3."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/","verified":"2026-10"},{"id":"data-018","topic":"Data Collection & Integrations","subtopic":"DogStatsD","difficulty":"hard","q":"An application emits `orders.placed:1|c|@0.25`, sending only a sampled subset of events. In one flush interval DogStatsD receives 10 of these packets. About what count does it report for that interval?","options":["10","2.5","40"],"answer":2,"explanation":"For COUNT metrics, DogStatsD multiplies received values by 1/sample_rate to correct for sampling: 10 x (1/0.25) = 40.","notes":["Wrong: 10 ignores the sample-rate correction applied to COUNT.","Wrong: 2.5 multiplies by the sample rate instead of dividing by it.","Correct: COUNT values are multiplied by 1/sample_rate: 10 x 4 = 40."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/dogstatsd_metrics_submission/","verified":"2026-10"},{"id":"data-019","topic":"Data Collection & Integrations","subtopic":"DogStatsD","difficulty":"hard","q":"The Agent runs in its own container. An application in a separate container sends DogStatsD metrics to `localhost:8125`, and none arrive in Datadog. What should be checked FIRST?","options":["That the app targets the Agent container's address and the Agent accepts non-local DogStatsD traffic","That outbound TCP port 8126 is open to Datadog","That `log_level` is set to `debug` in the Agent configuration"],"answer":0,"explanation":"Inside the app container, `localhost` is the app itself, not the Agent. The app must send to the Agent's address, and the Agent must have DogStatsD non-local traffic enabled. Port 8126 is local APM traffic, not an outbound Datadog port.","notes":["Correct: localhost in the app container is the app itself; target the Agent's address and enable non-local DogStatsD.","Wrong: 8126 is a local APM receiver port, not an outbound port to Datadog, and is unrelated to DogStatsD.","Wrong: debug logging adds detail but does not fix packets sent to the wrong address."],"ref":"https://docs.datadoghq.com/containers/docker/","verified":"2026-10"},{"id":"data-020","topic":"Data Collection & Integrations","subtopic":"DogStatsD","difficulty":"medium","q":"An admin changes `dogstatsd_port` from 8125 to 8200 in datadog.yaml and restarts the Agent. Custom metrics stop arriving. What is the most likely cause?","options":["The client libraries still send to port 8125","Port 8200/TCP must also be opened outbound to Datadog","DogStatsD only supports port 8125, so the Agent disabled it"],"answer":0,"explanation":"When you change the DogStatsD port, you must update the client configuration to match. The port is local to the Agent and does not affect outbound traffic to Datadog.","notes":["Correct: after changing the Agent port, clients must be configured to send to the same UDP port.","Wrong: dogstatsd_port is local to the host; outbound traffic to Datadog uses HTTPS 443.","Wrong: dogstatsd_port can be overridden; the Agent does not disable DogStatsD."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/","verified":"2026-10"},{"id":"data-021","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"easy","q":"For a GAUGE metric submitted several times within one flush interval, which value does Datadog keep for that interval?","options":["The sum of all values","The last value submitted","The average of all values"],"answer":1,"explanation":"A GAUGE represents a snapshot, so the last value reported in the interval is kept. Summing is COUNT behavior.","notes":["Wrong: summing values in the interval is COUNT behavior.","Correct: a GAUGE keeps the last value submitted in the interval.","Wrong: the Agent does not average gauge values within an interval."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-022","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"easy","q":"Which metric type adds up all values submitted during a flush interval?","options":["GAUGE","SET","COUNT"],"answer":2,"explanation":"A COUNT reports the total of the values submitted during the interval. A GAUGE keeps the last value and a SET counts unique values.","notes":["Wrong: a GAUGE keeps the last value.","Wrong: a SET counts unique values.","Correct: a COUNT sums all values submitted in the interval."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-023","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A RATE metric records 30 event occurrences during a 10-second interval. What value represents the RATE for that interval?","options":["3 per second","30","300"],"answer":0,"explanation":"RATE is the number of occurrences per second: 30 / 10 s = 3. 30 would be the COUNT for the interval.","notes":["Correct: RATE is occurrences per second: 30 / 10 s = 3.","Wrong: 30 is the raw COUNT for the interval.","Wrong: 300 multiplies by the interval instead of dividing."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-024","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"The values 2, 4, 4, 6, 4 are submitted for a COUNT metric within one 10-second flush interval. What value does the interval report?","options":["4","20","2"],"answer":1,"explanation":"COUNT sums the values: 2+4+4+6+4 = 20. 4 would be the last value (GAUGE behavior), and 2 per second would be the RATE.","notes":["Wrong: 4 is the last value, which is GAUGE behavior.","Correct: COUNT sums the values: 2+4+4+6+4 = 20.","Wrong: 2 per second would be the RATE (20 / 10 s), not the COUNT."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-025","topic":"Data Collection & Integrations","subtopic":"Custom Agent Checks","difficulty":"easy","q":"A team needs metrics from an in-house application that no existing Datadog integration supports. They decide to write a custom Agent check. What is a custom Agent check?","options":["A user-written Python check class that the Agent runs on its collection schedule to collect data no existing integration covers","A built-in Datadog integration that is enabled by renaming `conf.yaml.example` to `conf.yaml`","A monitor that compares a custom metric to a threshold and alerts when it is crossed"],"answer":0,"explanation":"Custom checks let you collect metrics and other data from your own systems or applications: a Python class extending `AgentCheck`, placed in checks.d and run by the Agent. For a generally available product, Datadog recommends a full integration instead.","notes":["Correct: a custom check is your own Python class (extending AgentCheck) that the Agent runs to collect data no integration covers.","Wrong: that describes enabling a built-in Agent-based integration that ships with the Agent.","Wrong: that describes a metric monitor, which alerts on data rather than collecting it."],"ref":"https://docs.datadoghq.com/developers/custom_checks/","verified":"2026-10"},{"id":"data-026","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"hard","q":"Through DogStatsD, a HISTOGRAM metric receives 5 values in one 10-second flush interval. Which value appears in-app for its `.count` aggregate?","options":["5","50","0.5"],"answer":2,"explanation":"The Agent submits the histogram `.count` as a RATE, so the app shows values / interval: 5 / 10 s = 0.5.","notes":["Wrong: 5 is the raw number of values; `.count` is submitted as a per-second RATE.","Wrong: 50 multiplies by the interval instead of dividing.","Correct: `.count` is a RATE: 5 values / 10 s = 0.5."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-027","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"easy","q":"Which of these aggregates is NOT produced by default for a DogStatsD HISTOGRAM metric?","options":[".min",".median",".95percentile"],"answer":0,"explanation":"By default the Agent produces `.avg`, `.count`, `.median`, `.95percentile`, and `.max`. `.min` must be added with `histogram_aggregates`.","notes":["Correct: `.min` is not produced by default; add it with histogram_aggregates.","Wrong: `.median` is a default histogram aggregate.","Wrong: `.95percentile` is produced by default via histogram_percentiles."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-028","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A team wants `.min` and `.sum` added to every histogram the Agent computes. Which datadog.yaml option should they edit?","options":["`histogram_percentiles`","`histogram_aggregates`","`dogstatsd_mapper_profiles`"],"answer":1,"explanation":"`histogram_aggregates` lists the aggregations generated (default: max, median, avg, count). `histogram_percentiles` controls percentile outputs like 0.95.","notes":["Wrong: histogram_percentiles sets percentile outputs such as 0.95, not min or sum.","Correct: histogram_aggregates (default max, median, avg, count) accepts min and sum.","Wrong: mapper profiles rename DogStatsD metrics and tags; they don't add aggregates."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-029","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A service runs on 50 hosts, and the team needs an accurate p99 latency across the whole fleet. Which metric type should the service submit?","options":["DISTRIBUTION","HISTOGRAM","GAUGE"],"answer":0,"explanation":"DISTRIBUTION values are aggregated server-side across all hosts, which enables globally accurate percentiles. HISTOGRAM percentiles are computed per Agent.","notes":["Correct: DISTRIBUTION aggregates raw values server-side across hosts for globally accurate percentiles.","Wrong: HISTOGRAM percentiles are computed per Agent, per host.","Wrong: a GAUGE only keeps one value per interval and cannot give percentiles."],"ref":"https://docs.datadoghq.com/metrics/distributions/","verified":"2026-10"},{"id":"data-030","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"hard","q":"A team graphs `avg:checkout.latency.95percentile{*}` across 20 hosts, where the metric is a DogStatsD HISTOGRAM, and treats the result as the fleet-wide p95. Why is this misleading?","options":["Histogram `.95percentile` is stored as a RATE and must be multiplied by the flush interval","Each Agent computes the percentile from its own host's data, and averaging per-host percentiles does not give a global percentile","Histogram percentiles are only kept for 15 days, so long time ranges are extrapolated"],"answer":1,"explanation":"Histograms are aggregated Agent-side per host, and averaging percentiles is not statistically valid. A DISTRIBUTION aggregates raw values server-side to give true global percentiles.","notes":["Wrong: `.95percentile` is a GAUGE; only `.count` is submitted as a RATE.","Correct: each Agent computes per-host percentiles, and averaging percentiles does not yield a global percentile.","Wrong: metrics are retained for 15 months; this is not a retention issue."],"ref":"https://docs.datadoghq.com/metrics/distributions/","verified":"2026-10"},{"id":"data-031","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A metric submitted as a SET through DogStatsD is stored with which in-app type?","options":["SET","COUNT","GAUGE"],"answer":2,"explanation":"DogStatsD SET submissions appear in Datadog as GAUGE, holding the number of unique values per interval.","notes":["Wrong: SET is a submission type only; it has no in-app SET type.","Wrong: COUNT is not the in-app type for DogStatsD SETs.","Correct: a DogStatsD SET is stored in-app as a GAUGE of unique values."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-032","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A metric submitted as a COUNT through DogStatsD (for example with `increment()`) appears in Datadog with which in-app type?","options":["RATE","COUNT","GAUGE"],"answer":0,"explanation":"DogStatsD COUNTs are stored as RATE in-app so values from different Agents stay comparable. A COUNT submitted directly through the API is stored as COUNT.","notes":["Correct: DogStatsD COUNTs appear as RATE in-app, normalized per second.","Wrong: COUNT in-app applies to counts submitted through the API, not DogStatsD.","Wrong: GAUGE is the in-app type for DogStatsD GAUGE and SET."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-033","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"hard","q":"For a DogStatsD HISTOGRAM, which in-app types do `.avg`/`.median`/`.max` and `.count` use?","options":["All are RATE","`.count` is GAUGE; the others are RATE","`.avg`, `.median`, `.max` are GAUGE; `.count` is RATE"],"answer":2,"explanation":"Histogram statistical aggregates are GAUGE; `.count` is submitted as a RATE (values per second).","notes":["Wrong: only `.count` is a RATE.","Wrong: it is the reverse: `.count` is RATE and the others are GAUGE.","Correct: `.avg`, `.median`, `.max` are GAUGE; `.count` is RATE."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-034","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"medium","q":"A custom script submits a point with timestamp `1767225600.7` (Unix seconds). How does Datadog store the timestamp?","options":["As 1767225601, rounded to the nearest second","As 1767225600700, in milliseconds","It rejects the point because the timestamp is not an integer"],"answer":0,"explanation":"Metric timestamps with fractions of a second are rounded to the nearest whole second. Datadog does not store millisecond precision for metric points.","notes":["Correct: fractional-second timestamps are rounded to the nearest second.","Wrong: Datadog does not store metric points at millisecond precision.","Wrong: the point is not rejected; the timestamp is rounded."],"ref":"https://docs.datadoghq.com/metrics/","verified":"2026-10"},{"id":"data-035","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"hard","q":"A batch job submits metric points with backdated timestamps. Which point is accepted?","options":["A point timestamped 2 hours in the past","A point timestamped 45 minutes in the past","A point timestamped 20 minutes in the future"],"answer":1,"explanation":"Points can be at most 1 hour in the past and 10 minutes in the future. Only the 45-minutes-ago point is inside that window.","notes":["Wrong: points older than 1 hour are outside the accepted window.","Correct: 45 minutes ago is inside the 1 hour past limit.","Wrong: points more than 10 minutes in the future are not accepted."],"ref":"https://docs.datadoghq.com/api/latest/metrics/#submit-metrics","verified":"2026-10"},{"id":"data-036","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"easy","q":"How long does Datadog retain metric data?","options":["30 days","13 months","15 months"],"answer":2,"explanation":"Metrics are retained for 15 months.","notes":["Wrong: 30 days is not the metric retention period.","Wrong: 13 months is a distractor; metrics are kept longer.","Correct: metric tags and values are retained for 15 months."],"ref":"https://docs.datadoghq.com/developers/guide/data-collection-resolution-retention/","verified":"2026-10"},{"id":"data-037","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"hard","q":"One host submits a HISTOGRAM metric `queue.wait` tagged `env` with only two values, `prod` and `staging`. With default histogram aggregates, how many custom metrics does this generate?","options":["2","5","10"],"answer":2,"explanation":"Each tag combination of a histogram produces 5 timeseries (avg, count, median, 95percentile, max): 2 combinations x 5 = 10.","notes":["Wrong: 2 counts only the tag combinations, not the 5 aggregates each.","Wrong: 5 is the per-combination count, ignoring the two env values.","Correct: 2 tag combinations x 5 default aggregates = 10 custom metrics."],"ref":"https://docs.datadoghq.com/account_management/billing/custom_metrics/","verified":"2026-10"},{"id":"data-038","topic":"Data Collection & Integrations","subtopic":"Metric Types & Timeseries","difficulty":"easy","q":"Which measurement is best submitted as a GAUGE?","options":["The current number of messages waiting in a queue","The number of requests handled per flush interval","The number of unique user IDs seen per flush interval"],"answer":0,"explanation":"A GAUGE reports a point-in-time value such as current queue depth. Requests handled fit COUNT, and unique IDs fit SET.","notes":["Correct: current queue depth is a point-in-time snapshot, which fits a GAUGE.","Wrong: requests handled per interval is a COUNT.","Wrong: unique IDs per interval is a SET."],"ref":"https://docs.datadoghq.com/metrics/types/","verified":"2026-10"},{"id":"data-039","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"Which type of integration is installed with the Agent, configured in `conf.d`, and implemented as a Python class with a `check` method?","options":["Agent-based","Authentication (crawler)-based","Library"],"answer":0,"explanation":"Agent-based integrations ship with the Agent and are Python checks configured through conf.d. Crawler-based integrations use credentials you give Datadog, and library integrations instrument application code.","notes":["Correct: Agent-based integrations ship with the Agent and use a Python check class configured in conf.d.","Wrong: crawler integrations use credentials entered in Datadog to pull from a provider API.","Wrong: library integrations instrument application code in a given language."],"ref":"https://docs.datadoghq.com/getting_started/integrations/","verified":"2026-10"},{"id":"data-040","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"You enter AWS role credentials in the Datadog UI so Datadog can pull CloudWatch metrics. What kind of integration is this?","options":["Agent-based","Library","Authentication (crawler)-based"],"answer":2,"explanation":"Crawler-based integrations use credentials you give Datadog to pull metrics from the provider's API. No Agent is needed for that data.","notes":["Wrong: no Agent is involved; Datadog pulls the data from the provider API.","Wrong: library integrations instrument application code.","Correct: supplying credentials so Datadog pulls metrics through the API is a crawler-based integration."],"ref":"https://docs.datadoghq.com/getting_started/integrations/","verified":"2026-10"},{"id":"data-041","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"Instrumenting a Python application with `ddtrace` falls into which integration category?","options":["Agent-based","Library","Authentication (crawler)-based"],"answer":1,"explanation":"Library integrations use Datadog's API or tracing libraries (such as ddtrace) to instrument applications based on their language.","notes":["Wrong: Agent-based integrations are checks that run inside the Agent.","Correct: tracing libraries like ddtrace are library integrations that instrument apps by language.","Wrong: crawler integrations pull from a third-party API with your credentials."],"ref":"https://docs.datadoghq.com/getting_started/integrations/","verified":"2026-10"},{"id":"data-042","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"An EC2 host runs the Agent and is also covered by the AWS integration. Why does CPU data from the AWS integration lag behind the Agent's and look coarser?","options":["Crawler-based metrics are pulled from the cloud provider's API with delay and lower resolution","The Agent buffers cloud metrics and forwards them once an hour","The AWS integration only sends metrics after the instance restarts"],"answer":0,"explanation":"Crawler data comes from the provider API: CloudWatch has its own latency plus Datadog's polling delay (often 10+ minutes) at 1- or 5-minute granularity. The Agent collects with virtually no delay every 15 seconds.","notes":["Correct: crawler metrics come from the provider API with polling delay and 1 or 5-minute granularity.","Wrong: the Agent does not buffer or forward cloud provider metrics hourly.","Wrong: the AWS integration polls continuously, regardless of instance restarts."],"ref":"https://docs.datadoghq.com/integrations/guide/cloud-metric-delay/","verified":"2026-10"},{"id":"data-043","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"By default, how often does the Agent's collector run integration checks?","options":["Every 10 seconds","Every 15 seconds","Every 60 seconds"],"answer":1,"explanation":"The collector runs checks every 15 seconds by default. 10 seconds is the DogStatsD flush interval.","notes":["Wrong: 10 seconds is the DogStatsD flush interval.","Correct: the collector runs checks every 15 seconds by default.","Wrong: 60 seconds is not the default check interval."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-044","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"After enabling the Redis integration, a user wants to add a widget to its out-of-the-box dashboard. What should they do?","options":["Clone the dashboard and edit the clone","Add the widget definition to `conf.d/redisdb.d/conf.yaml`","Ask Datadog Support to unlock the dashboard"],"answer":0,"explanation":"Out-of-the-box integration dashboards aren't edited directly. Clone the dashboard (Configuration Actions > Clone) and customize the unlinked copy.","notes":["Correct: clone the out-of-the-box dashboard and edit the unlinked copy.","Wrong: conf.yaml configures the Redis check, not dashboards.","Wrong: Support does not unlock integration dashboards; cloning is the supported path."],"ref":"https://docs.datadoghq.com/getting_started/dashboards/","verified":"2026-10"},{"id":"data-045","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"Which command installs a community integration on a Linux host running Agent v7?","options":["`sudo pip install datadog-<INTEGRATION_NAME>`","`sudo -u dd-agent datadog-agent integration install -t datadog-<INTEGRATION_NAME>==<VERSION>`","`sudo datadog-agent check <INTEGRATION_NAME> --install`"],"answer":1,"explanation":"Community integrations are installed with `datadog-agent integration install -t` as the dd-agent user. `check` runs a check once and does not install anything.","notes":["Wrong: plain pip installs into the wrong Python and is not the supported method.","Correct: community integrations install with `datadog-agent integration install -t` run as dd-agent.","Wrong: `check` runs a check once; it has no --install option."],"ref":"https://docs.datadoghq.com/agent/guide/use-community-integrations/","verified":"2026-10"},{"id":"data-046","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"A custom check is deployed as:\n\n/etc/datadog-agent/checks.d/custom_queue.py\n/etc/datadog-agent/conf.d/queue.yaml\n\nAfter a restart the check never runs. What is wrong?","options":["The Python file must live in `conf.d/` next to the YAML file","The configuration and check file names must match","Custom checks must be registered in datadog.yaml under `checks:`"],"answer":1,"explanation":"The check file in checks.d and the config file in conf.d must share the same name, for example `custom_queue.py` and `custom_queue.yaml`.","notes":["Wrong: the Python file belongs in checks.d; conf.d holds the YAML config.","Correct: the check file and config file names must match (custom_queue.py and custom_queue.yaml).","Wrong: custom checks are not registered in datadog.yaml."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-047","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"In a custom Agent check, which method must the check class implement for the Agent to collect data?","options":["`run(self)`","`collect(self, config)`","`check(self, instance)`"],"answer":2,"explanation":"A custom check class extends `AgentCheck` and implements `check(self, instance)`, which the collector calls on each run.","notes":["Wrong: `run(self)` is not the method the collector calls for custom checks.","Wrong: `collect(self, config)` is not part of the AgentCheck interface.","Correct: the class implements `check(self, instance)`, called on each run."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-048","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"A custom Agent check class must inherit from which class?","options":["`AgentCheck`, from `datadog_checks.base`","`DogStatsd`, from the `datadog` package","`Tracer`, from `ddtrace`"],"answer":0,"explanation":"Custom checks subclass `AgentCheck`, imported from `datadog_checks.base` (from `checks` only on Agents older than 6.6.0). DogStatsd is a metrics client, and Tracer is for APM.","notes":["Correct: custom checks subclass AgentCheck from datadog_checks.base.","Wrong: DogStatsd is a client for sending metrics from apps, not a check base class.","Wrong: Tracer is the ddtrace APM tracer."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-049","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"A custom check config contains:\n\ninit_config:\n\ninstances:\n  - min_collection_interval: 60\n\nHow often does the Agent try to run this instance?","options":["Every 60 minutes","Every 15 seconds","Every 60 seconds"],"answer":2,"explanation":"`min_collection_interval` is in seconds, so the collector tries to run the instance every 60 seconds instead of the 15-second default. The interval is a target, not a guarantee.","notes":["Wrong: min_collection_interval is in seconds, not minutes.","Wrong: 15 seconds is the default, overridden here.","Correct: the collector tries to run the instance every 60 seconds (a target, not a guarantee)."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-050","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"A custom check should run about every 5 minutes. Which conf.d snippet does this?","options":["instances:\n  - min_collection_interval: 300","instances:\n  - min_collection_interval: 5","init_config:\n  interval: 5m"],"answer":0,"explanation":"`min_collection_interval` is set per instance, in seconds: 5 minutes = 300. `interval: 5m` is not a valid check option.","notes":["Correct: min_collection_interval is set per instance in seconds; 5 minutes = 300.","Wrong: 5 would mean 5 seconds, not 5 minutes.","Wrong: `interval: 5m` is not a valid check option."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-051","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"On a Linux host Agent, the Docker check logs `permission denied` when it accesses `/var/run/docker.sock`. What fixes this?","options":["Set `dogstatsd_non_local_traffic: true`","Add the dd-agent user to the docker group: `usermod -a -G docker dd-agent`","Set `log_level: debug` and restart the Agent"],"answer":1,"explanation":"The Agent runs as `dd-agent`, which needs to be in the docker group to read the Docker socket. The other settings don't grant socket access.","notes":["Wrong: this lets DogStatsD accept remote packets; it doesn't grant socket access.","Correct: the dd-agent user must be in the docker group to read the Docker socket.","Wrong: debug logging adds detail but does not fix the permission."],"ref":"https://docs.datadoghq.com/integrations/docker_daemon/","verified":"2026-10"},{"id":"data-052","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"When the Agent runs as a container, which host path must be mounted into it for the Docker integration to collect container metrics?","options":["/var/log/datadog","/etc/datadog-agent/checks.d","/var/run/docker.sock"],"answer":2,"explanation":"The containerized Agent reads the Docker socket at `/var/run/docker.sock` (along with `/proc/` and `/sys/fs/cgroup/`) to collect container data.","notes":["Wrong: /var/log/datadog holds Agent logs on a Linux host.","Wrong: checks.d holds custom check Python files.","Correct: the Agent mounts /var/run/docker.sock (read-only) to read container data."],"ref":"https://docs.datadoghq.com/containers/docker/","verified":"2026-10"},{"id":"data-053","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"easy","q":"An integration ships `conf.d/postgres.d/conf.yaml.example`. What enables the integration?","options":["Copy or rename it to `conf.yaml`, configure it, and restart the Agent","Run `datadog-agent configcheck` to activate the example file","Remove the `.d` suffix from the folder name"],"answer":0,"explanation":"Example files are not loaded. Copy or rename `conf.yaml.example` to `conf.yaml`, edit it, then restart the Agent so the change takes effect. `configcheck` only prints loaded configurations.","notes":["Correct: rename or copy to conf.yaml, edit it, then restart the Agent.","Wrong: configcheck only prints loaded configurations; it activates nothing.","Wrong: the folder must keep its `<check>.d` name."],"ref":"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/","verified":"2026-10"},{"id":"data-054","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"medium","q":"After writing a new custom check, which Agent subcommand runs that check once and shows its output, so you can confirm it works?","options":["`datadog-agent configcheck`","`datadog-agent check <check_name>`","`datadog-agent diagnose`"],"answer":1,"explanation":"`check <name>` runs a single check and prints the metrics it collected. `configcheck` lists the loaded configurations, and `diagnose` tests connectivity.","notes":["Wrong: configcheck prints loaded and resolved configurations.","Correct: `check <name>` runs the check once and shows its output.","Wrong: diagnose runs connectivity diagnostics."],"ref":"https://docs.datadoghq.com/agent/configuration/agent-commands/","verified":"2026-10"},{"id":"data-055","topic":"Data Collection & Integrations","subtopic":"Integrations","difficulty":"hard","q":"Why does Datadog recommend naming a custom check with a `custom_` prefix, as in `custom_queue.py`?","options":["The Agent only loads files in checks.d that start with `custom_`","To avoid conflicts with the name of an existing Datadog Agent integration","Metrics from checks without the prefix are billed as standard metrics"],"answer":1,"explanation":"The docs recommend the `custom_` prefix so a custom check does not clash with a pre-existing integration's name. Metrics from any custom check are custom metrics, whatever the file name.","notes":["Wrong: the Agent loads checks.d files regardless of prefix.","Correct: the custom_ prefix avoids clashing with an existing Agent integration name.","Wrong: any custom check's metrics are custom metrics, whatever the file name."],"ref":"https://docs.datadoghq.com/developers/custom_checks/write_agent_check/","verified":"2026-10"},{"id":"data-056","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"easy","q":"What does the Agent's Autodiscovery feature do?","options":["It finds new cloud hosts through crawler integrations and installs the Agent on them","It detects containers and automatically applies integration configuration templates to them","It generates dashboards for every service it detects"],"answer":1,"explanation":"Autodiscovery watches container events and applies integration templates to matching containers, even when they move or change IPs.","notes":["Wrong: Autodiscovery does not install Agents on cloud hosts.","Correct: it watches container events and applies matching integration templates.","Wrong: dashboards come from integrations, not Autodiscovery."],"ref":"https://docs.datadoghq.com/getting_started/containers/autodiscovery/","verified":"2026-10"},{"id":"data-057","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"In a plain Docker environment (no Kubernetes), which is a valid source for Autodiscovery integration templates?","options":["Kubernetes ConfigMaps","Container labels such as `com.datadoghq.ad.checks`","An Ansible inventory file"],"answer":1,"explanation":"On Docker, templates can come from container labels (`com.datadoghq.ad.checks` on Agent 7.36+), local auto_conf/conf.d files, or key-value stores. ConfigMaps exist only in Kubernetes.","notes":["Wrong: ConfigMaps are Kubernetes objects and unavailable on plain Docker.","Correct: Docker container labels like com.datadoghq.ad.checks supply templates.","Wrong: Ansible inventories are not an Autodiscovery template source."],"ref":"https://docs.datadoghq.com/containers/docker/integrations/","verified":"2026-10"},{"id":"data-058","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"Which Autodiscovery template source can be used ONLY in Kubernetes?","options":["Key-value stores such as etcd","`auto_conf.yaml` files","ConfigMaps"],"answer":2,"explanation":"ConfigMaps are a Kubernetes object, so they apply only there. Key-value stores and auto_conf.yaml files also work in Docker.","notes":["Wrong: etcd, Consul and ZooKeeper stores also work on Docker.","Wrong: auto_conf.yaml files are local files that also work on Docker.","Correct: ConfigMaps are Kubernetes objects, so they apply only there."],"ref":"https://docs.datadoghq.com/containers/kubernetes/integrations/","verified":"2026-10"},{"id":"data-059","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"Which pod annotation key supplies an Autodiscovery check template for a container named `redis`?","options":["`ad.datadoghq.com/redis.checks`","`com.datadoghq.ad.check_names`","`tags.datadoghq.com/redis.service`"],"answer":0,"explanation":"Kubernetes Autodiscovery annotations take the form `ad.datadoghq.com/<CONTAINER_NAME>.checks`. `com.datadoghq.ad.*` are Docker labels, and `tags.datadoghq.com/*` labels are for unified service tagging.","notes":["Correct: Kubernetes uses ad.datadoghq.com/<CONTAINER_NAME>.checks.","Wrong: com.datadoghq.ad.check_names is the legacy Docker label format.","Wrong: tags.datadoghq.com labels are for unified service tagging."],"ref":"https://docs.datadoghq.com/containers/kubernetes/integrations/","verified":"2026-10"},{"id":"data-060","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"Which key-value stores can serve as Autodiscovery template sources?","options":["Redis, Memcached, and etcd","Vault, Consul, and DynamoDB","etcd, Consul, and ZooKeeper"],"answer":2,"explanation":"Autodiscovery supports etcd, Consul, and ZooKeeper as key-value template stores.","notes":["Wrong: Redis and Memcached are not supported template stores.","Wrong: Vault and DynamoDB are not supported template stores.","Correct: Consul, etcd and ZooKeeper are the supported key-value stores."],"ref":"https://docs.datadoghq.com/containers/docker/integrations/","verified":"2026-10"},{"id":"data-061","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"easy","q":"In an Autodiscovery template, what does `%%host%%` resolve to?","options":["The node's hostname as reported by `datadog-agent hostname`","The container's network IP address","The Datadog intake host for the configured site"],"answer":1,"explanation":"`%%host%%` resolves to the container's network IP. `%%hostname%%` is the hostname from the container configuration.","notes":["Wrong: that describes the Agent's own hostname, not a template variable value.","Correct: %%host%% resolves to the container's network IP.","Wrong: intake hosts come from the site setting, not template variables."],"ref":"https://docs.datadoghq.com/containers/guide/template_variables/","verified":"2026-10"},{"id":"data-062","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"hard","q":"A container exposes ports 80, 443, and 8443. Its Autodiscovery template uses `http://%%host%%:%%port%%/status`. Which port does `%%port%%` resolve to?","options":["80","443","8443"],"answer":2,"explanation":"`%%port%%` uses the highest exposed port when ports are sorted numerically in ascending order, here 8443. Use `%%port_<N>%%` to choose a different one.","notes":["Wrong: 80 is %%port_0%%, the lowest exposed port.","Wrong: 443 is %%port_1%%.","Correct: %%port%% is the highest exposed port sorted ascending, here 8443."],"ref":"https://docs.datadoghq.com/containers/guide/template_variables/","verified":"2026-10"},{"id":"data-063","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"hard","q":"A template contains `password: %%env_REDIS_PASSWORD%%`. Where does the Agent read `REDIS_PASSWORD` from?","options":["From the environment of the monitored Redis container","From a Kubernetes Secret named REDIS_PASSWORD","From the environment variables seen by the Agent process"],"answer":2,"explanation":"`%%env_<VAR>%%` is replaced with the variable as seen by the Agent process, so it must be set on the Agent, not on the application container.","notes":["Wrong: the monitored container's environment is not read.","Wrong: %%env_%% reads an environment variable, not a Secret by name.","Correct: %%env_<VAR>%% uses the variable as seen by the Agent process."],"ref":"https://docs.datadoghq.com/containers/guide/template_variables/","verified":"2026-10"},{"id":"data-064","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"The Agent ships `conf.d/redisdb.d/auto_conf.yaml`. A container from the `redis` image starts with no Datadog labels or annotations. What happens?","options":["The Agent applies the Redis check template to the container through Autodiscovery","Nothing until the user renames auto_conf.yaml to conf.yaml","The Agent runs the Redis check against localhost on the Agent host"],"answer":0,"explanation":"auto_conf.yaml files are default Autodiscovery templates whose `ad_identifiers` match container images such as `redis`, so the check is applied automatically. It can be turned off with DD_IGNORE_AUTOCONF.","notes":["Correct: the default redisdb auto_conf.yaml template matches redis images automatically.","Wrong: auto_conf.yaml is already an active Autodiscovery template; no rename is needed.","Wrong: the template targets the container via %%host%%, not localhost on the Agent host."],"ref":"https://docs.datadoghq.com/containers/guide/auto_conf/","verified":"2026-10"},{"id":"data-065","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"hard","q":"On Agent 7.36 or later, a team wants to define an nginx Autodiscovery check template on a plain Docker container (no Kubernetes) using a single container label. Which label key should they use?","options":["`com.datadoghq.ad.checks`","`com.datadoghq.ad.check_names`","`ad.datadoghq.com/nginx.checks`"],"answer":0,"explanation":"Since Agent 7.36, Docker Autodiscovery uses one JSON label, `com.datadoghq.ad.checks`, mapping the integration name to its init_config and instances. Older Agents used separate check_names, init_configs and instances labels.","notes":["Correct: Agent 7.36+ uses the single JSON label com.datadoghq.ad.checks.","Wrong: check_names is part of the legacy multi-label format used before 7.36.","Wrong: ad.datadoghq.com/<container>.checks is a Kubernetes pod annotation, not a Docker label."],"ref":"https://docs.datadoghq.com/containers/docker/integrations/","verified":"2026-10"},{"id":"data-066","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"hard","q":"A pod has the annotation `ad.datadoghq.com/web.checks` with a valid nginx template, but the pod spec's only container is named `nginx`. The check never runs. Why?","options":["The annotation must be on the Agent DaemonSet, not the application pod","The identifier in the annotation must match the container name in the pod spec","Annotations only work when the template is also copied into a ConfigMap"],"answer":1,"explanation":"In `ad.datadoghq.com/<CONTAINER_NAME>.checks`, the identifier must match a container name in the pod, so here it should be `ad.datadoghq.com/nginx.checks`.","notes":["Wrong: annotations go on the application pod, not the Agent DaemonSet.","Correct: the identifier must match the container name (spec.containers[].name), here nginx.","Wrong: annotations work on their own without a ConfigMap."],"ref":"https://docs.datadoghq.com/containers/kubernetes/integrations/","verified":"2026-10"},{"id":"data-067","topic":"Data Collection & Integrations","subtopic":"Autodiscovery","difficulty":"medium","q":"Which template variable inserts the container's process ID into an Autodiscovery template?","options":["`%%pid%%`","`%%port%%`","`%%hostname%%`"],"answer":0,"explanation":"`%%pid%%` resolves to the container process ID. `%%port%%` is an exposed port, and `%%hostname%%` is the hostname from the container configuration.","notes":["Correct: %%pid%% is the container process ID.","Wrong: %%port%% is the highest exposed port.","Wrong: %%hostname%% is the hostname from the container configuration."],"ref":"https://docs.datadoghq.com/containers/guide/template_variables/","verified":"2026-10"},{"id":"data-068","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"easy","q":"Which endpoint submits metric points to Datadog through the HTTP API?","options":["`GET /api/v1/query`","`POST /api/v2/series`","`GET /api/v1/validate`"],"answer":1,"explanation":"`POST /api/v2/series` submits metrics. `GET /api/v1/query` reads timeseries, and `/api/v1/validate` checks an API key.","notes":["Wrong: GET /api/v1/query reads timeseries.","Correct: POST /api/v2/series submits metric points.","Wrong: GET /api/v1/validate checks an API key."],"ref":"https://docs.datadoghq.com/api/latest/metrics/#submit-metrics","verified":"2026-10"},{"id":"data-069","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"medium","q":"Which key or keys does `POST /api/v2/series` require?","options":["An API key only","An application key only","Both an API key and an application key"],"answer":0,"explanation":"Submitting data (metrics, events, logs) needs only the API key. Reading or managing data, such as querying timeseries, also needs an application key.","notes":["Correct: submitting metrics needs only the API key (DD-API-KEY).","Wrong: an application key alone cannot submit data.","Wrong: application keys are needed to read or manage data, not to submit metrics."],"ref":"https://docs.datadoghq.com/api/latest/metrics/#submit-metrics","verified":"2026-10"},{"id":"data-070","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"medium","q":"A reporting script pulls timeseries with `GET /api/v1/query`. Which credentials must it send?","options":["An API key only","A client token","Both an API key and an application key"],"answer":2,"explanation":"Reading data through the API needs the org's API key plus a user's or service account's application key (newer bearer access tokens are also accepted). Client tokens are for browser and mobile SDKs.","notes":["Wrong: reading data needs more than the API key.","Wrong: client tokens are for browser and mobile SDKs (RUM, browser logs).","Correct: querying requires an API key plus an application key."],"ref":"https://docs.datadoghq.com/api/latest/authentication/","verified":"2026-10"},{"id":"data-071","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"easy","q":"Which endpoint checks whether an API key is valid?","options":["`GET /api/v1/validate`","`POST /api/v2/series`","`GET /api/v1/query`"],"answer":0,"explanation":"`GET /api/v1/validate` returns whether the supplied API key is valid.","notes":["Correct: GET /api/v1/validate returns whether the API key is valid.","Wrong: POST /api/v2/series submits metrics.","Wrong: GET /api/v1/query reads timeseries."],"ref":"https://docs.datadoghq.com/api/latest/authentication/","verified":"2026-10"},{"id":"data-072","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"easy","q":"Which HTTP headers carry Datadog keys in an API request?","options":["`Authorization: Bearer <API_KEY>` and `X-App-Key`","`DD-API-KEY` and `DD-APPLICATION-KEY`","`X-Datadog-Token` and `X-Datadog-User`"],"answer":1,"explanation":"Datadog API requests pass keys in the `DD-API-KEY` and `DD-APPLICATION-KEY` headers.","notes":["Wrong: X-App-Key is not a Datadog header, and Bearer auth is for access tokens, not the API key.","Correct: keys go in the DD-API-KEY and DD-APPLICATION-KEY headers.","Wrong: these are not Datadog API headers."],"ref":"https://docs.datadoghq.com/api/latest/authentication/","verified":"2026-10"},{"id":"data-073","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"medium","q":"An organization is hosted on the EU1 site. Which base URL should its API calls use?","options":["`https://api.datadoghq.com/eu/`","`https://eu.api.datadoghq.com/`","`https://api.datadoghq.eu/`"],"answer":2,"explanation":"The API base is `https://api.<site>/`, and the EU1 site is `datadoghq.eu`, so EU1 calls go to `api.datadoghq.eu`.","notes":["Wrong: the site is part of the hostname, not a URL path.","Wrong: EU1 uses the datadoghq.eu domain, not an eu. subdomain of datadoghq.com.","Correct: the EU1 API base is api.datadoghq.eu."],"ref":"https://docs.datadoghq.com/getting_started/site/","verified":"2026-10"},{"id":"data-074","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"hard","q":"An org on the US3 site sends metrics with a valid API key to `https://api.datadoghq.com/api/v2/series` and gets HTTP 403. What is the most likely fix?","options":["Send the request to `https://api.us3.datadoghq.com` instead","Add a `DD-APPLICATION-KEY` header","Retry with exponential backoff"],"answer":0,"explanation":"Each Datadog site is completely independent, so a US3 org's key fails against the US1 endpoint. Use the org's site-specific base URL. Metric submission needs no application key, and backoff is the response to 429.","notes":["Correct: sites are independent, so the US3 key must be used with api.us3.datadoghq.com.","Wrong: metric submission needs only an API key.","Wrong: backoff addresses 429 rate limiting, not 403 authentication errors."],"ref":"https://docs.datadoghq.com/getting_started/site/","verified":"2026-10"},{"id":"data-075","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"medium","q":"A script polling the Datadog API starts receiving HTTP 429 responses. What does this mean, and what should the script do?","options":["The API key is invalid, so the script should rotate it","The request is rate limited, so the script should back off and use the `X-RateLimit-*` headers to time retries","The payload is too large, so the script should split it into smaller batches"],"answer":1,"explanation":"429 means too many requests (rate limited). Datadog returns `X-RateLimit-Limit`, `-Remaining`, `-Reset`, and related headers. Bad keys produce 401/403 and oversized payloads produce 413.","notes":["Wrong: an invalid key gives 401/403, not 429.","Correct: 429 is rate limiting; use the X-RateLimit-* headers to time retries.","Wrong: oversized payloads return 413."],"ref":"https://docs.datadoghq.com/api/latest/rate-limits/","verified":"2026-10"},{"id":"data-076","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"easy","q":"Which API endpoint posts a custom event to the Datadog event stream?","options":["`POST /api/v1/events`","`POST /api/v2/series`","`POST /api/v1/check_run`"],"answer":0,"explanation":"Events can be submitted with `POST /api/v1/events` on api.<site> (a v2 intake also exists for change and alert events). `/api/v2/series` is for metrics, and `check_run` submits service checks.","notes":["Correct: POST /api/v1/events posts an event.","Wrong: /api/v2/series submits metrics.","Wrong: /api/v1/check_run submits service checks."],"ref":"https://docs.datadoghq.com/api/latest/events/","verified":"2026-10"},{"id":"data-077","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"medium","q":"An application sends logs directly over HTTP to a US1 account without the Agent. Which endpoint should it use?","options":["`https://api.datadoghq.com/api/v2/series`","`https://http-intake.logs.datadoghq.com/api/v2/logs`","`agent-intake.logs.datadoghq.com:10516`"],"answer":1,"explanation":"HTTP log submission goes to `http-intake.logs.<site>/api/v2/logs` with an API key. Port 10516 was the TCP log intake, which is deprecated and no longer supported, and `/api/v2/series` is for metrics.","notes":["Wrong: /api/v2/series is the metrics endpoint.","Correct: HTTP logs go to http-intake.logs.<site>/api/v2/logs with an API key.","Wrong: port 10516 was the TCP log intake, which is deprecated and not supported."],"ref":"https://docs.datadoghq.com/api/latest/logs/","verified":"2026-10"},{"id":"data-078","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"easy","q":"Which Datadog library instruments a Python application for APM tracing?","options":["`datadog` (the DogStatsD/API client)","`datadog_checks.base`","`ddtrace`"],"answer":2,"explanation":"`ddtrace` is Datadog's Python APM client; it sends traces to the Agent's trace receiver (8126/TCP by default). The `datadog` package is a DogStatsD/API client, and `datadog_checks.base` is for writing Agent checks.","notes":["Wrong: the datadog package is a DogStatsD and API client.","Wrong: datadog_checks.base is for writing Agent checks.","Correct: ddtrace is Datadog's Python APM client."],"ref":"https://ddtrace.readthedocs.io/en/stable/","verified":"2026-10"},{"id":"data-079","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"hard","q":"A script sends this body to `POST /api/v2/series`:\n\n{\"series\": [{\"metric\": \"shop.cart.size\", \"type\": 3,\n  \"points\": [{\"timestamp\": 1767225600, \"value\": 4}]}]}\n\nWhich metric type does `\"type\": 3` declare?","options":["COUNT","RATE","GAUGE"],"answer":2,"explanation":"In the v2 series API, the type enum is 0 = unspecified, 1 = count, 2 = rate, 3 = gauge.","notes":["Wrong: count is type 1.","Wrong: rate is type 2.","Correct: type 3 is gauge."],"ref":"https://docs.datadoghq.com/api/latest/metrics/#submit-metrics","verified":"2026-10"},{"id":"data-080","topic":"Data Collection & Integrations","subtopic":"API Endpoints","difficulty":"hard","q":"What HTTP status does `POST /api/v2/series` return when a well-formed payload with a valid API key is received?","options":["200 OK","202 Accepted","204 No Content"],"answer":1,"explanation":"The submit-metrics endpoint returns 202 (Payload accepted), meaning the data is accepted for asynchronous processing.","notes":["Wrong: the endpoint does not return 200 for submissions.","Correct: 202 means the payload was accepted for asynchronous processing.","Wrong: 204 No Content is not used here."],"ref":"https://docs.datadoghq.com/api/latest/metrics/#submit-metrics","verified":"2026-10"},{"id":"viz-001","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"easy","q":"Which of the following tag strings breaks Datadog's rule for the first character of a tag?","options":["2026release:true","region:us-east-1","team:payments"],"answer":0,"explanation":"Tags must start with a letter. '2026release:true' starts with a digit; the other two start with letters and use only allowed characters.","notes":["Correct: tags must start with a letter, and this one starts with a digit.","Valid: starts with a letter and uses allowed characters (letters, digits, hyphens, colon).","Valid: starts with a letter and is a normal key:value tag."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-002","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"easy","q":"What is the maximum length of a single tag in Datadog (key, colon and value combined)?","options":["100 characters","256 characters","200 characters"],"answer":2,"explanation":"Tags can be up to 200 characters long, and the key, the colon and the value all count toward that limit.","notes":["100 characters is too low; the documented maximum is 200.","256 characters is not the tag limit; tags are capped at 200.","Correct: tags can be up to 200 characters, counting key, colon and value."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-003","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"medium","q":"An application submits a metric through DogStatsD with the tag 'Env:Production'. How is this tag stored on the metric?","options":["Env:Production, with case preserved","env:production","It is dropped, because metric tags must already be lowercase"],"answer":1,"explanation":"Metric tags (and span tags) are normalized to lowercase, so the tag becomes env:production. That is why camel case in tag keys should be avoided.","notes":["Metric tags are not case preserved; they are normalized to lowercase.","Correct: metric and span tags are converted to lowercase.","Uppercase tags are not dropped; they are lowercased and kept."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-004","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"medium","q":"A host is tagged 'env:staging:east'. How does Datadog interpret this tag?","options":["Key 'env:staging' with value 'east'","It is rejected because a tag may contain only one colon","Key 'env' with value 'staging:east'"],"answer":2,"explanation":"In key:value tags, the key is everything before the FIRST colon, so the key is env and the value is staging:east. Colons are allowed characters in tags.","notes":["The key ends at the first colon, not the last one.","Colons are allowed characters, so the tag is not rejected.","Correct: the key is everything before the first colon; the rest is the value."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-005","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"medium","q":"The following is set in datadog.yaml:\ntags:\n  - role:web server\nWhich tag will appear on the host's metrics?","options":["role:web_server","role:webserver","role:web-server"],"answer":0,"explanation":"Characters that are not allowed in tags, including spaces, are converted to underscores, giving role:web_server. (DD_TAGS is the exception: it splits on whitespace.)","notes":["Correct: unsupported characters such as spaces are converted to underscores.","Spaces are not removed; they become underscores.","Spaces become underscores, not hyphens."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-006","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"hard","q":"A container is started with:\nDD_TAGS=\"team:core region:us east\"\nWhich tags does the Agent apply?","options":["team:core and region:us_east","team:core, region:us, and east","team:core and 'region:us east' with the space preserved"],"answer":1,"explanation":"DD_TAGS separates tags on whitespace, so the value is split into three tags: team:core, region:us and east. To keep a space in a value, set tags in YAML, which converts the space to an underscore.","notes":["Spaces in DD_TAGS are not converted to underscores; they split tags.","Correct: DD_TAGS splits on whitespace, producing team:core, region:us and east.","DD_TAGS cannot keep a space inside a value; whitespace is the separator."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-007","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"easy","q":"Which tag format does Datadog recommend for the best functionality?","options":["key=value","key:value","key/value"],"answer":1,"explanation":"Datadog recommends key:value tags. A slash is an allowed character, but 'key/value' is treated as a single value-only tag, not a key and value.","notes":["Datadog tags use a colon, not '=', to separate key and value.","Correct: Datadog recommends the key:value format for richer querying and grouping.","A slash is allowed but makes a value-only tag, not a key and value."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-008","topic":"Tagging & Search","subtopic":"Tag Format Rules","difficulty":"hard","q":"A metric is tagged 'app:payments__api' (two consecutive underscores). How is the tag normalized?","options":["app:payments__api, unchanged","app:paymentsapi","app:payments_api"],"answer":2,"explanation":"Datadog collapses consecutive underscores into one and strips leading and trailing underscores, so the result is app:payments_api.","notes":["Consecutive underscores are not kept; they collapse into one.","Underscores are not deleted entirely; they collapse to a single underscore.","Correct: consecutive underscores collapse into a single underscore."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-009","topic":"Tagging & Search","subtopic":"Reserved Tags","difficulty":"medium","q":"Which of these tag keys is NOT one of Datadog's reserved tag keys?","options":["source","region","version"],"answer":1,"explanation":"Reserved keys are host, device, source, service, env, version and team. 'region' is a common custom tag but has no reserved meaning.","notes":["source is a reserved tag key.","Correct: region is a common custom tag but not reserved.","version is a reserved tag key used by unified service tagging."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-010","topic":"Tagging & Search","subtopic":"Reserved Tags","difficulty":"easy","q":"Which reserved tag key is intended to assign ownership of resources to a group of people?","options":["team","owner","service"],"answer":0,"explanation":"'team' is the reserved tag key for ownership. 'service' scopes application data across metrics, traces and logs; 'owner' is not reserved.","notes":["Correct: team is the reserved key for ownership.","owner is not a reserved tag key.","service is reserved, but it scopes application data, not ownership."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-011","topic":"Tagging & Search","subtopic":"Unified Service Tagging","difficulty":"easy","q":"Which environment variables configure unified service tagging for an instrumented application?","options":["DD_TAGS, DD_HOSTNAME and DD_SITE","DD_ENVIRONMENT, DD_SERVICE_NAME and DD_APP_VERSION","DD_ENV, DD_SERVICE and DD_VERSION"],"answer":2,"explanation":"Unified service tagging uses the reserved env, service and version tags, set with DD_ENV, DD_SERVICE and DD_VERSION.","notes":["DD_TAGS sets host tags, DD_HOSTNAME the hostname and DD_SITE the Datadog site.","These variable names do not exist; the real ones are DD_ENV, DD_SERVICE and DD_VERSION.","Correct: DD_ENV, DD_SERVICE and DD_VERSION set the env, service and version tags."],"ref":"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/","verified":"2026-10"},{"id":"viz-012","topic":"Tagging & Search","subtopic":"Unified Service Tagging","difficulty":"medium","q":"To set unified service tags on a Docker container through labels, which label keys are used?","options":["com.datadoghq.ad.env, com.datadoghq.ad.service, com.datadoghq.ad.version","com.datadoghq.tags.env, com.datadoghq.tags.service, com.datadoghq.tags.version","tags.datadoghq.com/env, tags.datadoghq.com/service, tags.datadoghq.com/version"],"answer":1,"explanation":"Docker uses com.datadoghq.tags.<env|service|version> labels. tags.datadoghq.com/* is the Kubernetes label form, and com.datadoghq.ad.* labels are Autodiscovery templates.","notes":["com.datadoghq.ad.* labels hold Autodiscovery check templates.","Correct: Docker uses com.datadoghq.tags.env, .service and .version labels.","tags.datadoghq.com/* is the Kubernetes label format."],"ref":"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/","verified":"2026-10"},{"id":"viz-013","topic":"Tagging & Search","subtopic":"Unified Service Tagging","difficulty":"medium","q":"In Kubernetes, which labels on the Deployment and pod template set unified service tags?","options":["tags.datadoghq.com/env, tags.datadoghq.com/service, tags.datadoghq.com/version","ad.datadoghq.com/env, ad.datadoghq.com/service, ad.datadoghq.com/version","com.datadoghq.tags.env, com.datadoghq.tags.service, com.datadoghq.tags.version"],"answer":0,"explanation":"Kubernetes uses the tags.datadoghq.com/<env|service|version> labels. ad.datadoghq.com/ annotations hold Autodiscovery check templates.","notes":["Correct: Kubernetes uses tags.datadoghq.com/env, /service and /version labels.","ad.datadoghq.com/ is the Autodiscovery annotation prefix.","com.datadoghq.tags.* is the Docker label format."],"ref":"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/","verified":"2026-10"},{"id":"viz-014","topic":"Tagging & Search","subtopic":"Unified Service Tagging","difficulty":"medium","q":"A team wants to compare error rates in traces and logs before and after each deployment of the checkout service. Which unified service tag makes this possible?","options":["env","service","version"],"answer":2,"explanation":"The version tag identifies the deployed release, so telemetry can be compared across deployments. env and service stay the same across deploys of the same service.","notes":["env stays the same across deployments of a service in one environment.","service stays the same across deployments of the same service.","Correct: version identifies each deployment, so telemetry can be compared across releases."],"ref":"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/","verified":"2026-10"},{"id":"viz-015","topic":"Tagging & Search","subtopic":"Tag Assignment","difficulty":"easy","q":"According to Datadog, what is the most efficient way to assign tags across your infrastructure?","options":["Rely on integration inheritance, such as tags on AWS instances or Chef recipes","Add tags manually to each host in the UI","Add every tag to each DogStatsD call in application code"],"answer":0,"explanation":"Datadog calls integration inheritance the most efficient method: tags on cloud resources and configuration-management integrations flow automatically to hosts and metrics.","notes":["Correct: Datadog calls integration inheritance the most efficient tagging method.","Manual UI tagging works but doesn't scale across infrastructure.","Tagging every DogStatsD call is per-metric and error-prone, not the most efficient method."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-016","topic":"Tagging & Search","subtopic":"Tag Assignment","difficulty":"medium","q":"Which of these is valid syntax for host tags in an Agent v7 datadog.yaml?","options":["tags = [\"env:prod\", \"role:db\"]","tags: env:prod, role:db","tags:\n  - \"env:prod\"\n  - \"role:db\""],"answer":2,"explanation":"In Agent v6/v7, tags is a YAML list (block or bracketed form). A comma-separated string was the Agent v5 datadog.conf format, and '=' is not YAML.","notes":["Brackets with '=' is not YAML for this key; '=' is not valid here.","A comma-separated string was the Agent v5 datadog.conf format.","Correct: Agent v6/v7 uses a YAML list of strings under tags."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-017","topic":"Tagging & Search","subtopic":"Tag Assignment","difficulty":"medium","q":"A user adds a host tag in the Datadog UI. How quickly should the change be expected to apply?","options":["Instantly, on the next 15-second check run","It can take up to five minutes","Only after the Agent on that host is restarted"],"answer":1,"explanation":"Datadog notes that UI changes to host tags can take up to five minutes to apply. No Agent restart is needed because the tag is set in Datadog, not in the Agent's config.","notes":["UI tag changes are not instant; they may take up to five minutes.","Correct: Datadog says UI host tag changes can take up to five minutes to apply.","No Agent restart is needed because the tag is set in Datadog, not in the Agent config."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-018","topic":"Tagging & Search","subtopic":"Tag Assignment","difficulty":"medium","q":"A host has 'team:dba' set in datadog.yaml. The MySQL integration runs on the same host with no tags in mysql.d/conf.yaml. Which statement is true?","options":["MySQL metrics carry team:dba through host-tag inheritance","MySQL metrics carry team:dba only if it is repeated in mysql.d/conf.yaml","Integration metrics never carry host tags, only check-level tags"],"answer":0,"explanation":"Metrics, logs and traces sent through the Agent inherit the host's tags, so the MySQL metrics are tagged team:dba. Instance-level 'tags' in conf.yaml add tags to that check only.","notes":["Correct: host tags from datadog.yaml apply to everything the Agent forwards.","Repeating the tag isn't needed; host tags are already inherited.","Integration metrics sent through the Agent do carry host tags."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-019","topic":"Tagging & Search","subtopic":"Tag Assignment","difficulty":"medium","q":"You want the tag 'cluster:orders' on the Postgres integration's metrics only, not on every metric from the host. Where should it be set?","options":["Under 'tags' in datadog.yaml","In DD_TAGS on the Agent container","Under 'tags' in the instance section of conf.d/postgres.d/conf.yaml"],"answer":2,"explanation":"Each integration configuration file accepts instance-level tags that apply only to that check. Tags in datadog.yaml or DD_TAGS are host-level and apply to everything the Agent sends.","notes":["datadog.yaml tags are host tags applied to all Agent data.","DD_TAGS sets host tags on everything the Agent sends.","Correct: tags in the integration's conf.yaml apply only to that check."],"ref":"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/","verified":"2026-10"},{"id":"viz-020","topic":"Tagging & Search","subtopic":"Tagging Best Practices","difficulty":"easy","q":"Which tag would Datadog advise AGAINST adding to a custom metric?","options":["env:prod","service:checkout","user_id:48291"],"answer":2,"explanation":"Tags shouldn't come from unbounded sources such as user IDs, request IDs or epoch timestamps. Each new value creates a new timeseries and drives up custom metric counts.","notes":["env:prod is a bounded, recommended tag.","service:checkout is a bounded, reserved tag.","Correct: user IDs are unbounded and create a new timeseries per user."],"ref":"https://docs.datadoghq.com/getting_started/tagging/","verified":"2026-10"},{"id":"viz-021","topic":"Tagging & Search","subtopic":"Tagging Best Practices","difficulty":"medium","q":"Why is adding a 'request_id' tag to a high-traffic custom metric a bad idea?","options":["Each unique tag value combination becomes a new custom metric, so cardinality and cost grow without bound","Tags longer than 36 characters are truncated, so request IDs become unreadable","DogStatsD rejects any tag whose value is numeric"],"answer":0,"explanation":"A custom metric is a unique combination of metric name and tag values. An unbounded tag like request_id creates a new timeseries for nearly every request.","notes":["Correct: each unique tag value creates a new timeseries, so cardinality grows without bound.","There is no 36-character truncation; tags can be up to 200 characters.","Numeric tag values are allowed; the problem is cardinality, not format."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/","verified":"2026-10"},{"id":"viz-022","topic":"Tagging & Search","subtopic":"Tagging Best Practices","difficulty":"hard","q":"A gauge 'api.latency' is reported from 5 hosts, each tagged with one of 4 'endpoint' values on every host (all combinations occur). A 'region' tag is then added, but each host is always in exactly one region. How many custom metrics does this produce?","options":["25","20","40"],"answer":1,"explanation":"5 hosts x 4 endpoints = 20 unique combinations. Because region is fully determined by host, it adds no new combinations, so the count stays at 20.","notes":["25 wrongly adds region values as if they created new combinations.","Correct: 5 hosts x 4 endpoints = 20; region depends on host and adds nothing.","40 wrongly doubles the count; region never creates new host combinations."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/","verified":"2026-10"},{"id":"viz-023","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"easy","q":"In the query avg:system.cpu.user{env:prod,role:db}, what does the comma inside the braces mean?","options":["OR: sources with either tag","AND: only sources with both tags","The second tag is used for grouping"],"answer":1,"explanation":"A comma inside the scope braces is a logical AND, so only sources tagged both env:prod and role:db are included. Grouping uses 'by {}'.","notes":["A comma is not OR; use IN or OR for that.","Correct: a comma inside the scope means AND.","Grouping is done with 'by {}', not with a comma in the scope."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-024","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"medium","q":"Which query returns CPU for hosts in EITHER the prod or the staging environment?","options":["avg:system.cpu.user{env:prod,env:staging}","avg:system.cpu.user{env IN (prod, staging)}","avg:system.cpu.user{env:prod} by {env:staging}"],"answer":1,"explanation":"The IN operator matches any listed value, the same as env:prod OR env:staging. The comma form is AND, which needs both values on the same source.","notes":["The comma form is AND, so a source would need both env values.","Correct: IN matches any listed value, like env:prod OR env:staging.","'by' groups results; it does not add a second filter value."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-025","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"medium","q":"You want disk usage per device but must exclude loop devices such as /dev/loop0 and /dev/loop1. Which scope works?","options":["{!device:/dev/loop*}","{device:-/dev/loop*}","{device!=/dev/loop*}"],"answer":0,"explanation":"Prefixing a tag with ! excludes it, and the wildcard matches every loop device: avg:system.disk.in_use{!device:/dev/loop*} by {device}.","notes":["Correct: ! excludes the tag, and the wildcard matches every loop device.","'-' after the colon is not metric exclusion syntax.","!= is not valid metric scope syntax."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-026","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"hard","q":"Which of these metric queries is INVALID?","options":["avg:mymetric{env:prod AND NOT region:us-east}","avg:mymetric{env:prod,!region:us-east}","avg:mymetric{env:prod AND !region:us-east}"],"answer":2,"explanation":"Datadog doesn't allow mixing the symbolic ! with Boolean operators like AND in the same filter. Use AND NOT, or the comma with !.","notes":["Valid: AND NOT uses only functional Boolean syntax.","Valid: comma with ! uses only symbolic syntax.","Correct: symbolic ! cannot be mixed with functional operators like AND."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-027","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"easy","q":"Which scope matches all hosts whose names begin with 'web-'?","options":["{host:web-*}","{host:web-%}","{host:^web-.*}"],"answer":0,"explanation":"Metric queries support * wildcards for prefix, suffix and substring matches. % and regular expressions are not scope syntax.","notes":["Correct: metric scopes support * wildcards for prefix matches.","% is not a wildcard in metric queries.","Regular expressions are not supported in metric scopes."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-028","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"medium","q":"What does 'by {host}' do in avg:system.load.1{env:prod} by {host}?","options":["Filters the query to a host called 'host'","Averages all hosts into a single line","Draws one series per host, each averaged within its group"],"answer":2,"explanation":"'by {tag}' groups results so there is one series per tag value, here one line per host. Without 'by', all matching sources are combined into one series.","notes":["'by' groups by the tag key; it doesn't filter to a host named 'host'.","Without 'by' all hosts would be combined into one line; 'by' does the opposite.","Correct: 'by {host}' draws one series per host."],"ref":"https://docs.datadoghq.com/dashboards/querying/","verified":"2026-10"},{"id":"viz-029","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"medium","q":"Which query shows production CPU for every location EXCEPT atlanta and seattle?","options":["avg:system.cpu.user{env:prod AND location NOT IN (atlanta,seattle)}","avg:system.cpu.user{env:prod,location:!(atlanta,seattle)}","avg:system.cpu.user{env:prod} NOT by {location:atlanta,seattle}"],"answer":0,"explanation":"NOT IN excludes every listed value of a tag key and can be combined with AND. The other two forms aren't valid filter syntax.","notes":["Correct: NOT IN excludes every listed value and can be combined with AND.","location:!(...) is not valid filter syntax.","'NOT by' is not valid query syntax."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-030","topic":"Tagging & Search","subtopic":"Metric Query Syntax","difficulty":"hard","q":"What does this query graph?\nsum:kubernetes.pods.running{service:*-canary} by {service}","options":["One line per service whose name ends in '-canary', showing the summed number of running pods","Total running pods across all services, as one line","Running pods for a single service literally named '*-canary'"],"answer":0,"explanation":"The suffix wildcard matches every service ending in -canary, 'sum' adds pod counts across sources, and 'by {service}' draws one line per matching service.","notes":["Correct: the suffix wildcard matches every *-canary service and 'by' splits them.","'by {service}' produces one line per service, not a single total.","* is a wildcard here, not a literal character."],"ref":"https://docs.datadoghq.com/metrics/advanced-filtering/","verified":"2026-10"},{"id":"viz-031","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"easy","q":"In the Log Explorer, how do you search on a log attribute named http.status_code for the value 500?","options":["#http.status_code:500","@http.status_code:500","attr.http.status_code:500"],"answer":1,"explanation":"Log attributes are searched with the @ prefix, for example @http.status_code:500. Tags and reserved attributes such as service or status don't need it.","notes":["# is not used to search log attributes.","Correct: log attributes are searched with the @ prefix.","attr. is not a log search prefix."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-032","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"medium","q":"Which log query matches every 4xx status code (the attribute is a facet)?","options":["@http.status_code:{400..499}","@http.status_code:400-499","@http.status_code:[400 TO 499]"],"answer":2,"explanation":"Numeric ranges in log search use [min TO max]. Range and comparison searches work only on numeric attributes that have been added as facets (measures).","notes":["{a..b} is not log range syntax.","A hyphenated range is not valid; it is not interpreted as a range.","Correct: numeric ranges use [min TO max] on a faceted numeric attribute."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-033","topic":"Tagging & Search","subtopic":"Log Search Syntax","difficulty":"medium","q":"You want logs from service 'web' but NOT those with status 'info'. Which query does this?","options":["service:web EXCEPT status:info","service:web -status:info","service:web status:!=info"],"answer":1,"explanation":"A leading '-' (or NOT) excludes matching logs. EXCEPT and != are not log search operators.","notes":["EXCEPT is not a log search operator.","Correct: a leading - excludes logs matching the term.","!= is not a log search operator."],"ref":"https://docs.datadoghq.com/logs/explorer/search_syntax/","verified":"2026-10"},{"id":"viz-034","topic":"Tagging & Search","subtopic":"Facets & Measures","difficulty":"hard","q":"Logs contain a numeric attribute 'duration', but the search @duration:>500 returns nothing. What should be done FIRST?","options":["Add @duration as a facet (measure) so numeric operators can be used","Quote the value: @duration:\">500\"","Set logs_enabled: true in datadog.yaml and restart the Agent"],"answer":0,"explanation":"Numeric comparisons and ranges need the attribute to be added as a facet first. Quoting the value makes it a literal string match, and logs are clearly already being collected.","notes":["Correct: numeric operators like > need the attribute added as a face
