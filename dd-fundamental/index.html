19","agent-073","data-057"],["data-005","agent-047","net-035","agent-022","viz-104","data-051","allot-067","fund-021","fund-037","data-002","net-039","viz-079","agent-049","viz-036","allot-005","viz-088","agent-048","agent-013","allot-011","allot-041","viz-067","viz-015","net-048","data-001","fund-020"],["data-028","allot-060","net-066","agent-055","data-026","allot-044","fund-011","viz-074","net-034","viz-061","agent-029","viz-091","viz-116","net-059","allot-051","agent-072","fund-028","allot-018","agent-026","data-029","fund-005","data-012","viz-004","viz-045","agent-057"],["allot-061","viz-086","agent-082","allot-012","agent-036","allot-040","viz-059","viz-080","agent-041","allot-024","fund-047","data-046","fund-026","net-032","viz-009","net-070","fund-048","data-043","data-047","agent-042","viz-090","viz-023","agent-089","net-042","data-014"],["viz-106","agent-071","fund-022","fund-057","data-071","fund-058","data-016","net-071","allot-042","agent-069","allot-064","viz-075","agent-068","viz-058","agent-007","viz-031","allot-015","data-069","allot-058","net-047","agent-035","net-002","data-076","viz-038","viz-081"]],"checked":"October 2026","official":[{"id":"official-01","topic":"Official practice set","subtopic":"Agent Supported Platforms","difficulty":"","q":"Can the Datadog Agent be installed and run on any operating system?","options":["No, it only supports running on Linux based operating systems.","No, you need to check the version of your operating system to ensure its compatibility.","Yes, it can run on any version of an operating system without issue"],"answer":1,"explanation":"The Agent runs on Linux, Windows, macOS, containers and more, but each platform has minimum supported versions, so you must confirm your OS version is supported before installing.","notes":["The Agent also supports Windows, macOS, containers and other platforms, not only Linux.","Correct: the supported platforms list gives minimum (and some maximum) OS versions, so compatibility must be checked.","Not every OS version works; old releases such as Windows Server 2008 R2 need older Agent versions or are unsupported."],"ref":"https://docs.datadoghq.com/agent/supported_platforms/","verified":"2026-10"},{"id":"official-02","topic":"Official practice set","subtopic":"Cloud Integration Billing","difficulty":"","q":"Which of the following is a correct statement?","options":["No one is billed twice if they are running the Agent on an AWS EC2 instance that is also picked up by the Datadog AWS integration.","Host level metrics can be obtained with almost no delay by relying on those provided by cloud services for a cloud based host.","Host level metrics can be obtained with a higher resolution by using those provided by cloud services instead of the Datadog Agent."],"answer":0,"explanation":"Datadog's AWS billing docs state you are not billed twice for an EC2 instance that runs the Agent and is also picked up by the AWS integration. Cloud provider metrics arrive with minutes of delay and lower resolution than the Agent's 15-second collection. Current docs: deduplication relies on EC2 instance metadata, so with IMDSv2-only instances use Agent 7.64.0+ or set ec2_prefer_imdsv2: true.","notes":["Correct: Datadog does not bill twice for an EC2 host that runs the Agent and is also seen by the AWS integration.","CloudWatch data arrives with several minutes of delay; the Agent gives system metrics with virtually zero delay.","Cloud provider metrics are coarser (per minute or more); the Agent collects every 15 seconds."],"ref":"https://docs.datadoghq.com/account_management/billing/aws/","verified":"2026-10"},{"id":"official-03","topic":"Official practice set","subtopic":"Autodiscovery","difficulty":"","q":"Which of the following is a valid data source to populate an integration template when using the Datadog Agent's Autodiscovery feature in a Docker environment?","options":["Key-value stores","Helm Chart","ConfigMap"],"answer":0,"explanation":"In Docker, Autodiscovery integration templates can come from Docker labels, local configuration files, or a key-value store (Consul, etcd or ZooKeeper). Helm charts and ConfigMaps are Kubernetes mechanisms, not Docker template sources.","notes":["Correct: key-value stores such as Consul, etcd and ZooKeeper are a documented Autodiscovery template source in Docker.","Helm is a Kubernetes package manager used to deploy the Agent, not a Docker template source.","ConfigMaps are a Kubernetes object; Docker environments use labels, files or key-value stores."],"ref":"https://docs.datadoghq.com/containers/docker/integrations/","verified":"2026-10"},{"id":"official-04","topic":"Official practice set","subtopic":"DogStatsD","difficulty":"","q":"Dogstatsd uses UDP instead of TCP because","options":["it is very reliable given it guarantees the delivery of applications metric data to DogstatsD.","it is a connection-oriented protocol so the application will wait to transmit data in case DogStatsD isn't available.","it allows the application to send metrics to DogStatsD and resume its work without waiting for a response."],"answer":2,"explanation":"DogStatsD uses UDP, which is fire-and-forget: the application sends the metric and resumes work without waiting for a response, so an Agent outage does not block the app. UDP does not guarantee delivery and is connectionless.","notes":["UDP does not guarantee delivery; that is a TCP property.","UDP is connectionless; TCP is connection-oriented and would make the app wait.","Correct: with UDP the application sends metrics and resumes work without waiting for a response."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/","verified":"2026-10"},{"id":"official-05","topic":"Official practice set","subtopic":"Integration Types","difficulty":"","q":"Datadog Authentication (crawler) based integrations","options":["use credentials provided by the user in Datadog for obtaining metrics with the API.","are installed with the Datadog Agent and use a Python class method called check to define the metrics to collect.","use the Datadog API to allow monitoring of applications based on the language they are written in."],"answer":0,"explanation":"Authentication (crawler) based integrations are set up in Datadog by providing credentials, which Datadog uses to pull metrics through the provider's API (for example AWS, Azure, Slack, PagerDuty).","notes":["Correct: crawler integrations use credentials you provide in Datadog to obtain metrics through an API.","That describes Agent-based integrations, which use a Python check method.","That describes library integrations, which instrument applications by language."],"ref":"https://docs.datadoghq.com/getting_started/integrations/","verified":"2026-10"},{"id":"official-06","topic":"Official practice set","subtopic":"Metric Timestamps","difficulty":"","q":"In Datadog, metrics submitted with a fractions of a second timestamp","options":["are rounded to the nearest whole second.","are stored in milliseconds to account for the fraction.","are rejected by the metrics endpoint upon submission."],"answer":0,"explanation":"Datadog stores metric points with second-level timestamps; any point submitted with a fractional-second timestamp is rounded to the nearest second, and points with the same timestamp overwrite earlier ones.","notes":["Correct: the Metrics docs say fractional-second timestamps are rounded to the nearest second.","Datadog does not store millisecond precision for metric timestamps; API timestamps are POSIX seconds.","Fractional timestamps are not rejected; they are rounded."],"ref":"https://docs.datadoghq.com/metrics/","verified":"2026-10"},{"id":"official-07","topic":"Official practice set","subtopic":"Linux Basics","difficulty":"","q":"Which of the following commands will display the distribution and version of a Linux host?","options":["cat /etc/os*","uname -n","hostname"],"answer":0,"explanation":"cat /etc/os* prints files such as /etc/os-release, which contain the distribution name and version (NAME, VERSION_ID). uname -n and hostname both print only the host name.","notes":["Correct: the glob matches /etc/os-release, which holds the distribution name and version.","uname -n prints the network node hostname, not the distribution.","hostname prints the host name, not the distribution or version."],"ref":"https://www.freedesktop.org/software/systemd/man/latest/os-release.html","verified":"2026-10"},{"id":"official-08","topic":"Official practice set","subtopic":"Configuration Management","difficulty":"","q":"When wanting to install the Datadog Agent on 10 hosts by using a new Ansible server, the Ansible server has been set up, hosts have been added to the inventory file, and the necessary connectivity has been verified. Which step should be taken NEXT on the Ansible server?","options":["Run the Datadog Agent installation command.","Install the Datadog role from Ansible Galaxy.","In the ansible.cfg file, set the host_key_checking variable to False."],"answer":1,"explanation":"After the Ansible server, inventory and connectivity are ready, the next step is to install Datadog's Ansible content from Ansible Galaxy so a playbook can use it to install the Agent. Current docs: the datadog.dd collection (ansible-galaxy collection install datadog.dd) is now recommended, and the standalone datadog.datadog role is labeled legacy.","notes":["The Agent cannot be installed through Ansible until the Datadog role or collection is available on the Ansible server.","Correct: install the Datadog role from Ansible Galaxy next; current docs recommend the datadog.dd collection instead.","Disabling host key checking is an optional SSH convenience, not a required Datadog install step."],"ref":"https://docs.datadoghq.com/agent/guide/ansible_standalone_role/","verified":"2026-10"},{"id":"official-09","topic":"Official practice set","subtopic":"DogStatsD Configuration","difficulty":"","q":"When a user wants to instrument an application to send custom metrics to Datadog, how should they edit the Agent configuration file?","options":["Un-comment the use_dogstatsd and dogstatsd_port parameters.","Un-comment the use_dogstatsd parameter and set it to true.","Un-comment the dogstatsd_port parameter and set it to 8125."],"answer":0,"explanation":"The exam expects you to uncomment use_dogstatsd and dogstatsd_port in datadog.yaml to enable DogStatsD on its port. Current docs: DogStatsD is enabled by default over UDP port 8125 in Agent v6+, so no edit is needed unless you want to change dogstatsd_port (then restart the Agent).","notes":["Correct per the exam: uncommenting both parameters enables DogStatsD and sets its port; in Agent 6+ both are already the defaults.","Setting only use_dogstatsd leaves the port to its default; the exam expects both parameters.","Setting only dogstatsd_port does not explicitly enable DogStatsD in the exam's expected answer."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/","verified":"2026-10"},{"id":"official-10","topic":"Official practice set","subtopic":"Custom Metrics","difficulty":"","q":"Which feature allows the ability to submit custom metrics programmatically to Datadog?","options":["Datadog Agent","DogStatsD","Datadog API"],"answer":1,"explanation":"DogStatsD is the metrics aggregation service, bundled with the Agent, that applications use to submit custom metrics programmatically through client libraries. Current docs: custom metrics can also be posted directly to the HTTP API (POST /api/v2/series), but the exam expects DogStatsD.","notes":["The Agent is the overall collector; programmatic custom-metric submission goes through its DogStatsD server.","Correct: DogStatsD client libraries let applications submit custom metrics programmatically.","The API can also accept metrics, but the exam's expected answer is DogStatsD, the purpose-built feature."],"ref":"https://docs.datadoghq.com/developers/dogstatsd/","verified":"2026-10"},{"id":"official-11","topic":"Official practice set","subtopic":"Linux Basics","difficulty":"","q":"What is the main difference between Linux OS and Windows?","options":["Linux is a free open source OS while Windows is a proprietary OS.","Linux is a free OS while Windows is a paying OS.","Linux is more secure than Windows"],"answer":0,"explanation":"Linux is free and open source (GPL), so its code can be read, modified and shared, while Windows is proprietary closed-source software. Some Linux distributions (such as RHEL subscriptions) are paid, so price alone is not the main difference.","notes":["Correct: the key difference is open source (Linux) versus proprietary (Windows).","Some Linux distributions are sold with paid subscriptions, so free versus paid is not the defining difference.","Security depends on configuration and patching; it is not the defining difference between the two OSes."],"ref":"https://en.wikipedia.org/wiki/Linux","verified":"2026-10"},{"id":"official-12","topic":"Official practice set","subtopic":"Unified Service Tagging","difficulty":"","q":"Unified service tagging is a best practice that ties Datadog telemetry together through the use of which three standard tags?","options":["host, service, and source","service, device, and version","env, service, and version"],"answer":2,"explanation":"Unified service tagging ties traces, metrics and logs together with three reserved tags: env, service and version.","notes":["host and source are reserved tags but not part of unified service tagging.","device is a reserved tag for devices, not one of the three unified service tags.","Correct: env, service and version are the three unified service tags."],"ref":"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/","verified":"2026-10"},{"id":"official-13","topic":"Official practice set","subtopic":"Agent Commands","difficulty":"","q":"To run an agent subcommand, this syntax must be used: <AGENT_BINARY><SUB_COMMAND> <OPTIONS>\nIn order to get all the configurations loaded and resolved, which of the following subcommands should be used?","options":["diagnose","configcheck","check"],"answer":1,"explanation":"The configcheck subcommand prints all configurations loaded and resolved by a running Agent, including Autodiscovery-resolved templates.","notes":["diagnose runs a connectivity diagnosis, not a configuration dump.","Correct: configcheck prints the configurations loaded and resolved by a running Agent.","check runs a single named check once and prints its output."],"ref":"https://docs.datadoghq.com/agent/configuration/agent-commands/","verified":"2026-10"},{"id":"official-14","topic":"Official practice set","subtopic":"Dashboards","difficulty":"","q":"Once an integration is enabled/configured, the out of box dashboards are","options":["to be cloned and used as templates.","the source of truth for all metrics collected for the integration.","empty until new widgets are created."],"answer":0,"explanation":"Integration (preset) dashboards are created automatically when you install an integration; the recommended way to customize one is to clone it and edit the copy. The docs note that cloning a preset dashboard is the fastest way to get widgets relevant to your data.","notes":["Correct: out-of-the-box dashboards are meant to be cloned and used as templates for your own dashboards.","OOTB dashboards show a curated subset of metrics; Metrics Summary is where you see everything collected.","OOTB dashboards come pre-populated with widgets for the integration's metrics."],"ref":"https://docs.datadoghq.com/dashboards/widgets/","verified":"2026-10"},{"id":"official-15","topic":"Official practice set","subtopic":"Agent Log Level","difficulty":"","q":"To configure the Agent log level to collect critical, error, and warn logs only, how should the local datadog.yaml file be modified?","options":["Replace # log_level: INFO with log_level: CRITICAL.","Replace # log_level: INFO with log_level: ERROR.","Replace # log_level: INFO with log_level: WARN."],"answer":2,"explanation":"The Agent logs the configured level and every more severe level. Setting log_level: WARN therefore keeps WARN, ERROR and CRITICAL messages; the change requires an Agent restart.","notes":["CRITICAL would log only critical messages, dropping errors and warnings.","ERROR would log errors and critical messages but drop warnings.","Correct: WARN logs warnings plus everything more severe (ERROR and CRITICAL)."],"ref":"https://docs.datadoghq.com/agent/troubleshooting/debug_mode/","verified":"2026-10"},{"id":"official-16","topic":"Official practice set","subtopic":"Hostname Detection","difficulty":"","q":"For a host running in AWS, how does the Datadog agent determine the hostname?","options":["The hostname must be configured in the agent's datadog.yaml file.","The agent automatically discovers the EC2 instance id.","The agent uses the IP address."],"answer":1,"explanation":"On EC2, the Agent can reach the instance metadata endpoint and uses the EC2 instance ID as the canonical hostname when no custom hostname is set and the DNS hostname is an EC2 default such as ip-10-0-0-1. Current docs: a hostname set in datadog.yaml or a non-default DNS hostname takes precedence over the instance ID.","notes":["A hostname can be set in datadog.yaml, but it is not required; the Agent detects one automatically.","Correct: the Agent discovers the EC2 instance ID from instance metadata and uses it as the hostname.","The IP address is not used as the hostname; EC2 default names like ip-10-0-0-1 are replaced by the instance ID."],"ref":"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/","verified":"2026-10"},{"id":"official-17","topic":"Official practice set","subtopic":"API and Application Keys","difficulty":"","q":"When a Datadog user account is disabled, what happens to the API and application keys that were created by this account?","options":["API keys created by the disabled account remain valid. Application keys created by the disabled account are revoked.","API keys created by the disabled account remain valid. Application keys are transferred to the admin account that created the disabled account. If this admin account is also disabled, the application keys are revoked.","API and application keys created by the disabled account are revoked."],"answer":0,"explanation":"API keys belong to the organization, so those created by a disabled user stay valid. Application keys are tied to the user who created them and are revoked when that user is disabled; Datadog does not transfer them to another user.","notes":["Correct: API keys from the disabled account remain valid; its application keys are revoked.","Datadog does not transfer application keys from one user to another.","API keys are organization-level and are not revoked when their creator is disabled."],"ref":"https://docs.datadoghq.com/account_management/api-app-keys/","verified":"2026-10"},{"id":"official-18","topic":"Official practice set","subtopic":"Agent Configuration","difficulty":"","q":"When a user is making configuration changes in a datadog.yaml file, which of the following is true?","options":["The Datadog Agent must be restarted to apply changes made to datadog.yaml.","The Datadog Agent must be stopped before making any changes to datadog.yaml. Changes at runtime may result in an error.","Changes can be made dynamically in datadog.yaml."],"answer":0,"explanation":"The Agent reads datadog.yaml at startup, so edits take effect only after the Agent is restarted. You can edit the file while the Agent runs.","notes":["Correct: restart the Agent to apply changes made to datadog.yaml.","Editing the file while the Agent runs is safe; it simply is not read until the next start.","datadog.yaml is not reloaded dynamically; a restart is needed."],"ref":"https://docs.datadoghq.com/agent/troubleshooting/debug_mode/","verified":"2026-10"},{"id":"official-19","topic":"Official practice set","subtopic":"Custom Metrics","difficulty":"","q":"Which of the following BEST describes custom metrics in Datadog?","options":["All non-Agent metrics, such as those submitted by an integration, are considered custom metrics.","Any metric submitted using DogStatsD or a custom Agent Check is a considered a custom metric.","All metrics that are submitted by a community integration are considered custom metric"],"answer":1,"explanation":"Any metric submitted through DogStatsD or a custom Agent check is a custom metric. Metrics from Datadog's standard integrations generally are not. Current docs: metrics from Marketplace integrations and from integrations outside Datadog's catalog also count as custom.","notes":["Metrics from Datadog's standard integrations are generally not custom metrics.","Correct: metrics submitted with DogStatsD or a custom Agent check are custom metrics.","Being a community integration is not the defining rule; DogStatsD and custom checks are the general case."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/","verified":"2026-10"},{"id":"official-20","topic":"Official practice set","subtopic":"Configuration Management","difficulty":"","q":"Which of the following is a deployment tool?","options":["Kubernetes","Red Hat Enterprise Linux","Ansible"],"answer":2,"explanation":"Ansible is a configuration management and deployment tool that can install the Agent across many hosts. Kubernetes is a container orchestrator and Red Hat Enterprise Linux is an operating system.","notes":["Kubernetes is a container orchestration platform, not the deployment tool the exam means.","Red Hat Enterprise Linux is an operating system.","Correct: Ansible is a deployment/configuration management tool; Datadog provides the datadog.dd collection for it."],"ref":"https://docs.datadoghq.com/agent/basic_agent_usage/ansible/","verified":"2026-10"},{"id":"official-21","topic":"Official practice set","subtopic":"Agent Configuration","difficulty":"","q":"After making configuration changes to datadog.yaml while the Agent is running, the Agent will apply the changes","options":["the next time it starts.","during the next check cycle.","when it receives the reload command."],"answer":0,"explanation":"datadog.yaml is read when the Agent starts, so changes apply the next time the Agent starts (after a restart). Current docs: a few settings such as log_level can also be changed at runtime with datadog-agent config set, but file edits still need a restart.","notes":["Correct: datadog.yaml changes apply when the Agent next starts.","Check cycles rerun checks; they do not reload datadog.yaml.","The Agent has no reload command for datadog.yaml; it must be restarted."],"ref":"https://docs.datadoghq.com/agent/troubleshooting/debug_mode/","verified":"2026-10"},{"id":"official-22","topic":"Official practice set","subtopic":"Autodiscovery","difficulty":"","q":"What is the purpose of the auto_conf.yaml file in an integration's conf.d directory?","options":["It is an example configuration template for the integration.","It allows the agent to AutoDiscover services and monitor them using the integration.","It configures the integration to run automatically."],"answer":1,"explanation":"auto_conf.yaml holds a default Autodiscovery template for the integration, letting the Agent automatically detect matching containers and monitor them. conf.yaml.example is the example template.","notes":["The example configuration file is conf.yaml.example, not auto_conf.yaml.","Correct: auto_conf.yaml is the Autodiscovery template that lets the Agent discover and monitor services.","auto_conf.yaml applies only through Autodiscovery when a matching container is found; it does not simply enable the check."],"ref":"https://docs.datadoghq.com/containers/guide/auto_conf/","verified":"2026-10"},{"id":"official-23","topic":"Official practice set","subtopic":"Metric Types","difficulty":"","q":"An application is instrumented to send custom metrics via StatsD. What needs to be done in order to send histogram metrics?","options":["Use StatsD to send histogram metric types.","Add DogstatsD instrumentation to send histogram metric types.","Calculate histogram values in the application and use StatsD to send them as metrics."],"answer":1,"explanation":"The HISTOGRAM metric type is specific to DogStatsD, a Datadog extension of StatsD, so the application needs DogStatsD instrumentation to send histograms. Each histogram produces aggregates such as .count, .avg, .median, .max and .95percentile.","notes":["Standard StatsD has no histogram type; it is a DogStatsD extension.","Correct: add DogStatsD instrumentation, since HISTOGRAM is specific to DogStatsD.","Pre-computing values loses the server-side aggregations DogStatsD histograms provide; use DogStatsD instead."],"ref":"https://docs.datadoghq.com/metrics/custom_metrics/dogstatsd_metrics_submission/","verified":"2026-10"},{"id":"official-24","topic":"Official practice set","subtopic":"Agent Commands","difficulty":"","q":"The agent on an Ubuntu host has been temporarily stopped in order to edit a configuration file, but needs to started again. What is the command to run?","options":["sudo datadog-agent restart","sudo service datadog-agent restart","sudo service datadog-agent start"],"answer":2,"explanation":"The Agent was stopped, so it should be started with sudo service datadog-agent start. Restart is meant for a running Agent, and on Linux the Agent service is managed through the service manager rather than the datadog-agent binary. Current docs: on systemd hosts the documented command is sudo systemctl start datadog-agent.","notes":["On Linux the Agent service is controlled through the service manager (service or systemctl), not a datadog-agent restart command.","restart is for a running Agent; the Agent is stopped, so start is the correct action.","Correct: sudo service datadog-agent start starts a stopped Agent (systemctl start on systemd hosts)."],"ref":"https://docs.datadoghq.com/agent/supported_platforms/linux/","verified":"2026-10"},{"id":"official-25","topic":"Official practice set","subtopic":"Agent Configuration","difficulty":"","q":"For a Datadog Agent running on a host, what is the definitive method for determining its default configuration values?","options":["Examine its original datadog.yaml file.","Read the Agent documentation on docs.datadoghq.com.","Run the command datadog-agent configcheck."],"answer":0,"explanation":"The datadog.yaml installed with the Agent is generated from its configuration template and lists every option with its default value in comments, so it is the definitive record for that Agent version. Current docs: the per-OS example files (such as datadog.yaml.example) carry the same defaults, and datadog-agent config shows the runtime configuration.","notes":["Correct: the original datadog.yaml lists each option with its default for that installed Agent version.","Online docs describe the latest Agent and may not match the installed version's defaults.","configcheck shows loaded check (integration) configurations, not datadog.yaml defaults."],"ref":"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/","verified":"2026-10"}]};

const Q = Object.fromEntries([...DATA.questions, ...DATA.official].map(q => [q.id, q]));
const MAIN = new Set(DATA.questions.map(q => q.id));
const TOPICS = [...new Set(DATA.questions.map(q => q.topic))];
const HOT = ["Networking & Datadog Ports", "Allotments, Billing & Custom Metrics"];
const LS_KEY = "ddf-drill-v1";
const SECS_PER_Q = 80;  // real exam: 90 questions in 120 minutes
const FULL_N = 90;

function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }
const store = Object.assign({ best: {}, attempts: {}, q: {}, mode: "study" }, load());

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rich = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>");
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const fmt = s => s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const LETTERS = "ABCD";
const scoreColor = p => p >= 80 ? "var(--ok)" : p >= 65 ? "var(--warn)" : "var(--bad)";
const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>`;

function shell(kind) { document.body.dataset.shell = kind; }
function bind(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); }

/* stems: first line is prose; a final line ending in "?", ":" or "." is prose; lines between are a code/config snippet */
function renderStem(text) {
  const lines = text.split("\n");
  if (lines.length === 1) return `<p>${rich(text)}</p>`;
  const head = lines.shift();
  while (lines.length && lines[0].trim() === "") lines.shift();
  let tail = "";
  const last = lines[lines.length - 1] || "";
  if (lines.length > 1 && /[?:.]\s*$/.test(last) && /\s\w+\s/.test(last) && !/^\s/.test(last)) tail = lines.pop();
  while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
  return `<p>${rich(head)}</p>${lines.length ? `<pre class="code">${esc(lines.join("\n"))}</pre>` : ""}${tail ? `<p>${rich(tail)}</p>` : ""}`;
}

function topicStats(ids) {
  const seen = ids.filter(id => store.q[id]);
  const c = seen.reduce((s, id) => s + store.q[id].c, 0), w = seen.reduce((s, id) => s + store.q[id].w, 0);
  return { seen: seen.length, acc: c + w ? pct(c, c + w) : null };
}
function missedIds() { return Object.keys(store.q).filter(id => store.q[id].last === false && Q[id]); }
const barHTML = p => `<span class="bar"><i style="width:${p ?? 0}%;background:${p == null ? "transparent" : scoreColor(p)}"></i></span>`;

function renderStats() {
  const s = topicStats([...MAIN]);
  const done = Object.keys(store.best).filter(k => k.startsWith("pkg-")).length;
  document.getElementById("stats").innerHTML = `
    <span>Seen <b>${s.seen}/${MAIN.size}</b></span>
    <span>Accuracy <b>${s.acc == null ? "–" : s.acc + "%"}</b></span>
    <span>Mock tests <b>${done}/${DATA.packages.length}</b></span>`;
  syncResetButton();
}

/* reset: a header button that opens a confirmation dialog listing exactly what will be erased */
const resetModal = document.getElementById("resetmodal");
function hasProgress() { return Object.keys(store.q).length > 0 || Object.keys(store.attempts).length > 0; }
function syncResetButton() {
  const btn = document.getElementById("reset");
  btn.disabled = !hasProgress();
  btn.title = btn.disabled ? "Nothing to reset yet" : "Erase all scores and history";
}
function openReset() {
  const seen = topicStats([...MAIN]).seen, tests = Object.keys(store.best).length;
  const attempts = Object.values(store.attempts).reduce((a, b) => a + b, 0), misses = missedIds().length;
  document.getElementById("reset-desc").innerHTML = `<p class="muted">This erases everything saved in this browser and can't be undone:</p>
    <ul><li>${seen} answered question${seen === 1 ? "" : "s"} and your accuracy</li><li>${tests} best score${tests === 1 ? "" : "s"} across ${attempts} attempt${attempts === 1 ? "" : "s"}</li><li>${misses} question${misses === 1 ? "" : "s"} in Retry my mistakes</li></ul>`;
  resetModal.hidden = false;
  document.getElementById("reset-no").focus();
}
function closeReset() { resetModal.hidden = true; document.getElementById("reset").focus(); }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
bind("reset", openReset);
bind("reset-no", closeReset);
bind("reset-yes", () => { store.best = {}; store.attempts = {}; store.q = {}; save(); resetModal.hidden = true; setView("home"); toast("Progress reset"); });
resetModal.addEventListener("click", e => { if (e.target === resetModal) closeReset(); });
document.addEventListener("keydown", e => { if (!resetModal.hidden && e.key === "Escape") { e.stopImmediatePropagation(); closeReset(); } }, true);

function setView(v) {
  stopTimer(); S = null; shell("browse");
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.view === v)));
  renderStats();
  if (v === "sheet") renderSheet(); else renderHome();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.view)));

/* ---------------- home ---------------- */
function renderHome() {
  const pkgs = DATA.packages.map((_, i) => {
    const b = store.best["pkg-" + (i + 1)];
    return `<button class="pkg" data-pkg="${i}" aria-label="Mock test ${i + 1}${b == null ? ", not started" : ", best " + b + "%"}">
      <span class="pn"><b style="font-weight:400">Test </b>${String(i + 1).padStart(2, "0")}</span>
      <span class="ps ${b == null ? "none" : ""}">${b == null ? "–" : b + "%"}</span>
      ${barHTML(b)}
    </button>`;
  }).join("");

  const count = t => DATA.questions.filter(q => q.topic === t).length;
  const misses = missedIds().length;
  const drills = [
    ["topic:" + HOT[0], "Ports & networking", `${count(HOT[0])} questions`, true],
    ["topic:" + HOT[1], "Allotments & custom metrics", `${count(HOT[1])} questions`, true],
    ["official", "Official practice set", "Datadog's 25 practice questions", false],
    ["random", "Random 25", `From all ${MAIN.size} questions`, false],
    ["misses", "Retry my mistakes", misses ? `${misses} to review` : "Nothing yet", false],
  ].map(([k, t, d, hot]) => `<button class="item" data-drill="${esc(k)}" ${k === "misses" && !misses ? "disabled" : ""}>
      <span class="t">${esc(t)}${hot ? `<span class="badge">Exam-heavy</span>` : ""}</span><span class="d">${esc(d)}</span><span class="r" aria-hidden="true">›</span></button>`).join("");

  const topics = TOPICS.map(t => {
    const ids = DATA.questions.filter(q => q.topic === t).map(q => q.id), s = topicStats(ids);
    return `<button class="item" data-topic="${esc(t)}"><span class="t">${esc(t)}</span><span class="r">${s.acc == null ? "–" : s.acc + "%"}</span>${barHTML(s.acc)}</button>`;
  }).join("");

  app.innerHTML = `
  <div class="home">
    <section>
      <div class="block-head"><h2>Mock tests</h2><span class="hint">25 questions each, covering every exam topic</span></div>
      <button class="sim" id="fullsim"><span class="t">Full exam simulation</span><span class="d">${FULL_N} questions · 2 hours · 3 options each, like the real exam</span><span class="r">${store.best.full == null ? "›" : "best " + store.best.full + "%"}</span></button>
      <div class="pkgs">${pkgs}</div>
    </section>
    <div class="split">
      <section>
        <div class="block-head"><h2>Focused practice</h2></div>
        <div class="list">${drills}</div>
      </section>
      <section>
        <div class="block-head"><h2>By topic</h2><span class="hint">Your accuracy</span></div>
        <div class="list">${topics}</div>
      </section>
    </div>
  </div>`;

  bind("fullsim", fullExam);
  app.querySelectorAll(".pkg").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.pkg;
    setup({ key: "pkg-" + (i + 1), title: "Mock test " + String(i + 1).padStart(2, "0"), ids: DATA.packages[i], kind: "25 questions mixing all nine exam topics, weighted like the real exam." });
  }));
  app.querySelectorAll("[data-drill]").forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.drill;
    if (d === "official") setup({ key: "official", title: "Official practice set", ids: DATA.official.map(q => q.id), keepOrder: true, kind: "Datadog's own practice questions. Answers follow the official key; where the docs have changed since, the explanation says so." });
    else if (d === "random") setup({ key: "random", title: "Random 25", ids: shuffle([...MAIN]).slice(0, 25), kind: "25 questions picked at random from the whole bank." });
    else if (d === "misses") setup({ key: "misses", title: "Retry my mistakes", ids: shuffle(missedIds()).slice(0, 50), kind: "Questions you got wrong last time. Answer one correctly and it leaves this list." });
    else topicDrill(d.slice(6));
  }));
  app.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => topicDrill(b.dataset.topic)));
}
function fullExam() {
  const byTopic = TOPICS.map(t => shuffle(DATA.questions.filter(q => q.topic === t).map(q => q.id)));
  const quota = byTopic.map(ids => Math.floor(FULL_N * ids.length / MAIN.size));
  for (let i = 0; quota.reduce((a, b) => a + b, 0) < FULL_N; i++) quota[i % quota.length]++;
  setup({ key: "full", title: "Full exam simulation", ids: byTopic.flatMap((ids, i) => ids.slice(0, quota[i])), defaultMode: "exam",
    kind: "Same length and time limit as the real exam: 90 questions in 2 hours, drawn from every topic. The real exam scores 75 of them (15 are unscored trial questions you can't tell apart); here all 90 count." });
}
function topicDrill(t) {
  const ids = DATA.questions.filter(q => q.topic === t).map(q => q.id);
  const rank = id => { const s = store.q[id]; return !s ? 1 : s.last === false ? 0 : 2; };
  const picked = shuffle(ids).sort((a, b) => rank(a) - rank(b)).slice(0, 25);
  setup({ key: "topic-" + t, title: t, ids: picked, kind: `25 of the ${ids.length} questions on this topic, starting with ones you missed or haven't seen.` });
}

/* ---------------- setup: choose a mode ---------------- */
function setup(cfg) {
  stopTimer(); S = null; shell("browse");
  const n = cfg.ids.length, b = store.best[cfg.key], att = store.attempts[cfg.key] || 0;
  app.innerHTML = `
  <div class="setup">
    <div><button class="btn ghost small" id="back" style="padding-left:4px">${ICON_BACK.replace("<svg", '<svg style="width:16px;height:16px;vertical-align:-3px"')} Back</button></div>
    <div class="stack" style="gap:6px">
      <h2 style="font-size:1.4rem">${esc(cfg.title)}</h2>
      <p class="muted">${esc(cfg.kind)}</p>
      <p class="hint">${n} questions${att ? ` · ${att} attempt${att === 1 ? "" : "s"}` : ""}${b != null ? ` · best ${b}%` : ""}</p>
    </div>
    <div class="modes">
      <button class="mode ${(cfg.defaultMode || store.mode) === "study" ? "last" : ""}" data-start="study">
        <span class="tagline">Study</span>
        <ul><li>Graded as soon as you answer</li><li>Every option explained</li><li>No timer</li></ul>
        <span class="btn primary go">Start studying</span>
      </button>
      <button class="mode ${(cfg.defaultMode || store.mode) === "exam" ? "last" : ""}" data-start="exam">
        <span class="tagline exam">Exam</span>
        <ul><li>${n >= 60 ? Math.round(n * SECS_PER_Q / 60) + " min" : fmt(n * SECS_PER_Q)} timer, the real exam's pace</li><li>No topic labels or feedback until you submit</li><li>Flag questions and change answers freely</li></ul>
        <span class="btn go">Start exam</span>
      </button>
    </div>
    <p class="hint">The real exam: 90 multiple-choice questions in 2 hours, one correct answer among three options, unanswered counts as wrong. Exam mode works the same way.<br>Tip: press 1–3 or A–C to answer and Enter to continue.</p>
  </div>`;
  bind("back", () => setView("home"));
  app.querySelectorAll("[data-start]").forEach(el => el.addEventListener("click", () => { store.mode = el.dataset.start; save(); start(cfg, el.dataset.start); }));
  window.scrollTo(0, 0);
}

/* ---------------- quiz (focus shell) ---------------- */
let S = null, timerId = null;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function start(cfg, mode) {
  stopTimer(); shell("focus");
  const list = (cfg.keepOrder ? cfg.ids : shuffle(cfg.ids)).map(id => Q[id]);
  S = {
    cfg, key: cfg.key, title: cfg.title, mode, idx: 0, flags: new Set(), panel: null,
    items: list.map(q => ({ q, order: shuffle(q.options.map((_, i) => i)) })),
    picks: list.map(() => null), started: Date.now(), limit: list.length * SECS_PER_Q
  };
  if (mode === "exam") timerId = setInterval(tick, 1000);
  renderQuestion();
}
function timeLeft() { return Math.max(0, S.limit - Math.floor((Date.now() - S.started) / 1000)); }
function tick() {
  if (!S || S.result) return stopTimer();
  const left = timeLeft(), el = document.getElementById("timer");
  if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 120); }
  if (left <= 0) finish();
}

/* one option list for answering, study-mode feedback, and the results review */
function optionList(it, pick, revealed, interactive) {
  const q = it.q;
  return `<div class="opts">${it.order.map((oi, pos) => {
    const isAns = oi === q.answer, isPick = oi === pick;
    let cls = "", tag = "";
    if (revealed) {
      if (isAns) { cls = "right"; tag = isPick ? "Your answer, correct." : "Correct answer."; }
      else if (isPick) { cls = "wrong"; tag = "Your answer."; }
    } else if (isPick) cls = "sel";
    const note = revealed && q.notes && q.notes[oi] ? rich(q.notes[oi]) : "";
    const why = revealed && (tag || note) ? `<span class="why">${tag ? `<b>${tag}</b>` : ""}${note}</span>` : "";
    const el = interactive ? "button" : "div";
    const tx = q.options[oi].includes("\n") ? `<span class="tx code">${esc(q.options[oi])}</span>` : `<span class="tx">${rich(q.options[oi])}</span>`;
    return `<${el} class="opt ${cls}" ${interactive ? `data-oi="${oi}"` : ""}><span class="k">${LETTERS[pos]}</span>${tx}${why}</${el}>`;
  }).join("")}</div>`;
}
function explainBox(q) {
  return `<div class="explain"><div>${rich(q.explanation)}</div>
    ${q.ref ? `<a href="${esc(q.ref)}" target="_blank" rel="noopener">Docs: ${esc(q.ref.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : ""}</div>`;
}

function focusBar({ title, sub, right = "", progress = null, exitLabel = "Exit" }) {
  return `<div class="fbar">
    <div class="fbar-row">
      <button class="btn ghost exit" id="exit" aria-label="${esc(exitLabel)}">${exitLabel === "Exit" ? ICON_X : ICON_BACK}<span>${esc(exitLabel)}</span></button>
      <div class="title"><b>${esc(title)}</b>${sub ? `<span>${sub}</span>` : ""}</div>
      <span class="spacer"></span>${right}
    </div>
    ${progress == null ? "" : `<div class="progress"><i style="width:${progress}%"></i></div>`}
  </div>`;
}

function renderQuestion() {
  const it = S.items[S.idx], q = it.q, n = S.items.length, pick = S.picks[S.idx];
  const study = S.mode === "study", revealed = study && pick !== null, last = S.idx === n - 1;
  const answered = S.picks.filter(p => p !== null).length;
  const right = study ? S.items.filter((x, i) => S.picks[i] === x.q.answer).length : 0;
  const flagged = S.flags.has(S.idx);

  const barRight = study
    ? `<span class="hint">${right}/${answered} correct</span>`
    : `<span class="timer ${timeLeft() < 120 ? "low" : ""}" id="timer" title="Time left">${fmt(timeLeft())}</span>
       <button class="btn small" id="overview" aria-expanded="${S.panel === "overview"}">Questions</button>`;

  let panel = "";
  if (S.panel === "exit") {
    panel = `<div class="banner warn"><span>${study ? "Leave this session? Answers so far are kept in your history." : "Leave this exam? It won't be scored."}</span><span class="spacer"></span>
      <button class="btn small danger" id="exit-yes">Leave</button><button class="btn small" id="exit-no">Keep going</button></div>`;
  } else if (S.panel === "overview") {
    const unanswered = n - answered;
    panel = `<div class="banner overview" style="display:grid">
      <div class="palette">${S.items.map((_, i) => `<button data-jump="${i}" class="${S.picks[i] !== null ? "done" : ""} ${S.flags.has(i) ? "flag" : ""} ${i === S.idx ? "cur" : ""}" aria-label="Question ${i + 1}${S.picks[i] !== null ? ", answered" : ""}${S.flags.has(i) ? ", flagged" : ""}">${i + 1}</button>`).join("")}</div>
      <div class="row"><span class="legend"><span>${answered} answered</span><span>${unanswered} left</span><span>${S.flags.size} flagged</span></span><span class="spacer"></span>
        <button class="btn small primary" id="submit">Submit exam</button></div>
      ${unanswered ? `<span class="hint">Unanswered questions count as wrong.</span>` : ""}
    </div>`;
  }

  let primary;
  if (study) primary = revealed ? `<button class="btn primary" id="next">${last ? "See results" : "Next"}</button>` : `<span class="hint">Choose an answer</span>`;
  else primary = last ? `<button class="btn primary" id="review">Review and submit</button>` : `<button class="btn primary" id="next">Next</button>`;

  app.innerHTML = `
    ${focusBar({ title: S.title, sub: `Question ${S.idx + 1} of ${n}${study ? "" : " · exam"}`, right: barRight, progress: pct(study ? answered : S.idx + 1, n) })}
    ${panel}
    <div class="quiz">
      <div class="qmeta"><span class="label">${!study || q.topic === S.title ? "" : esc(q.topic)}</span>${study ? "" : `<button class="btn small ghost flagbtn" id="flag" aria-pressed="${flagged}">${flagged ? "Flagged" : "Flag"}</button>`}</div>
      <div class="stem">${renderStem(q.q)}</div>
      ${revealed ? `<div class="verdict ${pick === q.answer ? "ok" : "no"}"><span class="dot"></span>${pick === q.answer ? "Correct" : `Not quite. The answer is ${LETTERS[it.order.indexOf(q.answer)]}.`}</div>` : ""}
      ${optionList(it, pick, revealed, !revealed)}
      ${revealed ? explainBox(q) : ""}
      <div class="actions"><button class="btn ghost" id="prev" ${S.idx === 0 ? "disabled" : ""}>Back</button>${primary}</div>
    </div>`;

  app.querySelectorAll("button.opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.oi)));
  bind("prev", () => go(S.idx - 1));
  bind("next", () => (study && last) ? finish() : go(S.idx + 1));
  bind("review", () => { S.panel = "overview"; renderQuestion(); window.scrollTo(0, 0); });
  bind("overview", () => { S.panel = S.panel === "overview" ? null : "overview"; renderQuestion(); });
  bind("submit", finish);
  bind("flag", () => { flagged ? S.flags.delete(S.idx) : S.flags.add(S.idx); renderQuestion(); });
  bind("exit", () => { if (study && answered === 0) return setView("home"); S.panel = "exit"; renderQuestion(); });
  bind("exit-no", () => { S.panel = null; renderQuestion(); });
  bind("exit-yes", () => setView("home"));
  app.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => { S.panel = null; go(+b.dataset.jump); }));
}
function choose(oi) {
  if (S.mode === "study") {
    if (S.picks[S.idx] !== null) return;
    S.picks[S.idx] = oi; record(S.items[S.idx].q, oi);
  } else S.picks[S.idx] = oi;
  renderQuestion();
}
function go(i) { if (i < 0 || i >= S.items.length) return; S.idx = i; if (S.panel === "exit") S.panel = null; renderQuestion(); window.scrollTo(0, 0); }
function record(q, pick) {
  const s = store.q[q.id] || { c: 0, w: 0, last: null }, ok = pick === q.answer;
  if (ok) s.c++; else s.w++;
  s.last = ok; store.q[q.id] = s; save();
}

document.addEventListener("keydown", e => {
  if (!S || S.result || !document.querySelector(".quiz") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { S.panel = S.panel ? null : "exit"; renderQuestion(); return; }
  const pos = k.length === 1 ? ("1234".includes(k) ? "1234".indexOf(k) : "abcd".indexOf(k)) : -1;
  if (pos >= 0) { const oi = S.items[S.idx].order[pos]; if (oi !== undefined) choose(oi); return; }
  if (k === "enter" || k === "arrowright") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON" && k === "enter") return;
    if (S.mode === "study" && S.picks[S.idx] === null) return;
    e.preventDefault();
    if (S.idx === S.items.length - 1) { if (S.mode === "study") finish(); else { S.panel = "overview"; renderQuestion(); } }
    else go(S.idx + 1);
  }
  if (k === "arrowleft") go(S.idx - 1);
});

/* ---------------- results (focus shell) ---------------- */
function finish() {
  stopTimer();
  if (S.mode === "exam") S.items.forEach((it, i) => record(it.q, S.picks[i] ?? -1));
  const n = S.items.length, right = S.items.filter((it, i) => S.picks[i] === it.q.answer).length, p = pct(right, n);
  store.attempts[S.key] = (store.attempts[S.key] || 0) + 1;
  if (S.key.startsWith("pkg-") || S.key === "official" || S.key === "full") store.best[S.key] = Math.max(store.best[S.key] ?? 0, p);
  save();
  S.result = { right, n, p, secs: Math.round((Date.now() - S.started) / 1000) };
  renderResults(right < n ? "wrong" : "all");
}
function renderResults(filter) {
  shell("focus");
  const { right, n, p, secs } = S.result;
  const byTopic = {};
  S.items.forEach((it, i) => { const t = it.q.topic; byTopic[t] = byTopic[t] || [0, 0]; byTopic[t][1]++; if (S.picks[i] === it.q.answer) byTopic[t][0]++; });
  const rows = Object.entries(byTopic).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [c, k]]) =>
    `<tr><td>${esc(t)}</td><td style="width:32%">${barHTML(pct(c, k))}</td><td class="num">${c}/${k}</td></tr>`).join("");
  const items = S.items.map((it, i) => ({ it, i, ok: S.picks[i] === it.q.answer })).filter(x => filter === "all" || (filter === "wrong" ? !x.ok : x.ok));
  const review = items.map(({ it, i, ok }) => {
    const pick = S.picks[i];
    return `<div class="ritem">
      <div class="row"><span class="label">Question ${i + 1} · ${esc(it.q.topic)}</span><span class="spacer"></span>
        <span class="verdict ${ok ? "ok" : "no"}" style="font-size:.88rem"><span class="dot"></span>${ok ? "Correct" : pick === null ? "Not answered" : "Incorrect"}</span></div>
      <div class="stem" style="font-size:1rem">${renderStem(it.q.q)}</div>
      ${optionList(it, pick, true, false)}
      ${explainBox(it.q)}
    </div>`;
  }).join("");
  const wrongIds = S.items.filter((it, i) => S.picks[i] !== it.q.answer).map(it => it.q.id);
  const verdict = p >= 80 ? "In the ready range. Keep it there across a few tests." : p >= 65 ? "Close. Go through what you missed, then retake." : "Keep practicing. Study mode on your weakest topics helps most.";
  app.innerHTML = `
    ${focusBar({ title: S.title, sub: "Results", exitLabel: "Done" })}
    <div class="quiz">
      <div class="score"><span class="big" style="color:${scoreColor(p)}">${p}%</span><span class="muted">${right} of ${n} correct · ${fmt(secs)}${store.best[S.key] != null ? ` · best ${store.best[S.key]}%` : ""}</span></div>
      <p>${verdict} <span class="muted">Datadog doesn't publish the passing score; 80%+ here is a safe target.</span></p>
      <div class="row">
        ${wrongIds.length ? `<button class="btn primary" id="retrywrong">Study the ${wrongIds.length} I missed</button>` : ""}
        <button class="btn" id="again">Retake</button>
      </div>
      <table class="rtable"><tbody>${rows}</tbody></table>
      <div class="row" style="margin-top:12px"><h2>Review</h2><span class="spacer"></span>
        <div class="seg" role="group" aria-label="Filter questions">${[["wrong", "Missed"], ["right", "Correct"], ["all", "All"]].map(([f, l]) => `<button data-f="${f}" aria-pressed="${f === filter}">${l}</button>`).join("")}</div></div>
      <div class="review">${review || `<p class="muted">Nothing here.</p>`}</div>
    </div>`;
  const cfg = S.cfg;
  bind("exit", () => setView("home"));
  bind("again", () => setup(cfg));
  bind("retrywrong", () => start({ key: "retry", title: cfg.title + " · missed", ids: wrongIds, kind: "" }, "study"));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => renderResults(b.dataset.f)));
  window.scrollTo(0, 0);
}

/* ---------------- cheat sheet ---------------- */
function renderSheet() {
  app.innerHTML = "";
  app.appendChild(document.getElementById("sheet-tpl").content.cloneNode(true));
  document.getElementById("checked").textContent = DATA.checked;
  app.querySelectorAll("[data-jumpto]").forEach(b => b.addEventListener("click", () =>
    document.getElementById(b.dataset.jumpto).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" })));
}

setView("home");
</script>

</body>
</html>
